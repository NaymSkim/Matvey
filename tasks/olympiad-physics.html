такта между ними. Комнатная температура t0 = 20 ◦ C, вода в сосудах прогревается равномерно.","problemImage":"olympiad-assets/229.jpg"},{"id":"1.9.3","chapter":1,"chapterName":"Механика","topic":"1.9","topicName":"Баллистика. Координаты","difficulty":"hard","score":3.39,"searchText":"(«Будущие исследователи — будущее науки», 2015, 9 ) Горизонтальная дальность полета тела, брошенного под углом к горизонту, вдвое больше максимальной высоты подъема тела. Под каким углом было брошено тело? Какую часть времени полета скорость тела была меньше половины начальной скорости?","problemImage":"olympiad-assets/230.jpg"},{"id":"1.28.17","chapter":1,"chapterName":"Механика","topic":"1.28","topicName":"Статика","difficulty":"hard","score":3.4,"searchText":"(Всесиб., 2019, 9 ) Из пластикового листа вырезали равнобедренный прямоугольный треугольник, вблизи его вершин просверлили отверстия. За отверстие у прямого угла подвесили треугольник, а к двум другим прикрепили две одинаковые массивные чашки. Когда в одну из чашек положили гирю массой 100 г, треугольник повернулся на 15◦ относительно симметричного положения. Когда в свободную чашку налили воды, треугольник принял положение с таким же наклоном, но в противоположную сторону. Определите массу воды. Массой треугольника пренебречь.","problemImage":"olympiad-assets/231.jpg"},{"id":"1.29.5","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"hard","score":3.4,"searchText":"(Всеросс., 2021, ШЭ, 9 ) В 1648 году Блез Паскаль продемонстрировал опыт, результат которого может показаться весьма неожиданным. Он вставил в закрытую бочку, полностью наполненную водой, длинную узкую вертикальную трубку и, поднявшись на балкон дома, влил в эту трубку всего лишь одну кружку воды. До вливания воды трубка была пустая. Из-за малой толщины трубки вода в ней поднялась до большой высоты, и давление в бочке увеличилось настолько, что крепления бочки не выдержали, и она треснула. Предположим, что внутренний радиус трубки в опыте Паскаля был равен 4 мм, а давление в бочке после вливания в трубку кружки воды оказалось больше атмосферного давления на 80000 Па. Чему был равен объём воды в кружке? Плотность воды 1000 кг/м3, ускорение свободного падения 10 Н/кг. Ответ выразите в литрах и округлите до десятых долей.","problemImage":"olympiad-assets/232.jpg"},{"id":"2.4.3","chapter":2,"chapterName":"Тепловые явления","topic":"2.4","topicName":"Теплопроводность","difficulty":"hard","score":3.4,"searchText":"(Инженерная олимпиада, 2022, 9 ) Четыре одинаковых стержня AE, ED, DB и DC соединены так, как показано на рисунке. В точках соединения обеспечен тепловой контакт между стержнями. Температуры точек A, B и C поддерживаются равными: tA = t, tB = 2t, tC = 3t. Найти температуру точки D. Поток тепла по стержню зависит от его длины, площади сечения и материала и пропорционален разности температур его концов. Потоком тепла через боковые поверхности стержней пренебречь.","problemImage":"olympiad-assets/233.jpg"},{"id":"3.4.3","chapter":3,"chapterName":"Электричество","topic":"3.4","topicName":"Мощность тока","difficulty":"hard","score":3.4,"searchText":"(Всеросс., 2022, ШЭ, 9 ) Лампу накаливания подключили к идеальному источнику постоянного напряжения 220 В. При этом в лампе выделялась мощность 60 Вт. Затем две таких лампы соединили последовательно и подключили к тому же источнику. При этом в каждой лампе выделялась мощность 22 Вт. 1. Зависит ли сопротивление данной лампы от силы протекающего через неё электрического тока? 2. Найдите силу тока, протекавшего через источник, когда к нему была подключена только одна лампа. Ответ дайте в миллиамперах, округлив до целого числа. 3. Найдите силу тока, протекавшего через источник, когда к нему были подключены две последовательно соединённые лампы. Ответ дайте в миллиамперах, округлив до целого числа. 4. Две таких же лампы соединили параллельно и подключили к тому же источнику. Найдите суммарную мощность, выделявшуюся в лампах. Ответ дайте в ваттах, округлив до целого числа.","problemImage":"olympiad-assets/234.jpg"},{"id":"1.20.5","chapter":1,"chapterName":"Механика","topic":"1.20","topicName":"Движение со связями","difficulty":"hard","score":3.41,"searchText":"(«Росатом», 2021, 9 ) Невесомую жесткую спицу длиной L прикрепили шарнирно одним концом к вертикальной стенке и удерживают горизонтально. На спицу надели маленькую массивную муфту и расположили на расстоянии l = L/2 от шарнира (см. рис.). В некоторый момент времени спицу отпускают. Какую скорость будет иметь конец спицы в тот момент, когда муфта соскочит со спицы? Трение между спицей и муфтой, а также трение в шарнире отсутствует.","problemImage":"olympiad-assets/235.jpg"},{"id":"1.34.3","chapter":1,"chapterName":"Механика","topic":"1.34","topicName":"Процессы и измерения","difficulty":"hard","score":3.41,"searchText":"(«Формула Единства» / «Третье тысячелетие», 2021, 9 ) В лаборатории стоит два одинаковых электрометра (по сути — два металлических шарика с приделанной к каждому стрелкой-индикатором количества заряда в условных единицах). Стрелка 1-го электрометра показывала 45 единиц заряда, 2-го — ноль. На 1-й электрометр села незаряженная, но электропроводящая муха, потом перелетела на 2-й электрометр, а затем взлетела, после чего 2-й электрометр показал 10 единиц заряда. 1. Какой заряд при этом мог остаться у мухи? 2. Какой заряд может быть у мухи, если она очень много раз будет летать с одного электрометра на другой? Примечание. Считайте, что заряд не стекает ни в воздух, ни куда-либо вовне.","problemImage":"olympiad-assets/236.jpg"},{"id":"1.24.3","chapter":1,"chapterName":"Механика","topic":"1.24","topicName":"Консервативные системы","difficulty":"hard","score":3.42,"searchText":"(«Курчатов», 2020, 9 ) Через жёстко закреплённую горизонтальную трубу переброшена нерастяжимая нить массой m = 10 г и длиной L = 2,5 м. Масса нити равномерно распределена по её длине. К концам нити прикреплены два одинаковых груза 1 и 2 массой M = 20 г каждый. В начальном положении груз 2 расположен на высоте h = 0,1 м ниже груза 1. Грузы отпускают без начальной скорости. Найдите разность ∆T = T1 − T2, где T1 и T2 — силы, с которыми нить действует на грузы 1 и 2 в момент, когда груз 2 опустился на высоту x = 0,2 м относительно своего начального положения. Числовой ответ выразите в миллиньютонах. Ускорение свободного падения g = 10 м/с2; трение не учитывайте.","problemImage":"olympiad-assets/237.jpg"},{"id":"1.29.15","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"hard","score":3.42,"searchText":"(«Надежда энергетики», 2019, 9 ) В своей научной работе «Opera geometrica» в 1644 г. итальянский математик и физик Эванджелиста Торричелли изложил устройство ртутного барометра. Величина атмосферного давления измерялась таким барометром по высоте столба ртути, находившейся в стеклянной трубке, нижний конец которой был опущен в сосуд с ртутью, а верхний запаян. Если трубку ртутного барометра подвесить на нити к динамометру так, что её нижний конец по-прежнему будет опущен в сосуд с ртутью (не касаясь при этом дна сосуда), то можно ли определить значение атмосферного давления по показаниям динамометра? Поясните ваш ответ. Показания динамометра можно использовать для определения атмосферного давления","problemImage":"olympiad-assets/238.jpg"},{"id":"1.29.31","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"hard","score":3.43,"searchText":"(«Формула Единства» / «Третье тысячелетие», 2023, 9 ) В длинную тонкую трубку залили равные объёмы двух несмешивающихся жидкостей с различными плотностями, заполнив её ровно наполовину. Трубку свернули в кольцо, расположив его в вертикальной плоскости (см. рис.). Угол, который составляет с вертикалью отрезок, проходящий через границу раздела жидкостей и центр кольца, равен α = 10◦. Найдите плотность лёгкой жидкости ρ2, если плотность тяжёлой известна и равна ρ1 = 1000 кг/м3.","problemImage":"olympiad-assets/239.jpg"},{"id":"1.33.1","chapter":1,"chapterName":"Механика","topic":"1.33","topicName":"Сопротивление среды","difficulty":"hard","score":3.43,"searchText":"(«Надежда энергетики», 2016, 9 ) Два шарика одинаковых размеров закреплены на концах длинной, невесомой и нерастяжимой нити, перекинутой через невесомый блок. Блок неподвижно закреплён над бассейном с водой, при этом длина нити такова, что оба шарика не могут одновременно находиться в воде. Массы шариков равны m и 2m, при этом плотность шарика массой 2m в три раза больше плотности воды. Определите отношение скорости установившегося движения системы, в случае, когда первый из шариков движется в воде, а второй в воздухе, к скорости установившегося движения в случае, когда второй шарик движется в воде, а первый в воздухе. Сила вязкого трения шарика о воду пропорциональна скорости движения шарика в воде, прочими потерями пренебречь.","problemImage":"olympiad-assets/240.jpg"},{"id":"1.9.15","chapter":1,"chapterName":"Механика","topic":"1.9","topicName":"Баллистика. Координаты","difficulty":"hard","score":3.44,"searchText":"(Всесиб., 2021, 9 ) Из окна многоэтажки бросили небольшой мячик, сообщив ему горизонтальную начальную скорость. Из окна этажом ниже через время τ произвели в том же направлении горизонтальный бросок другим небольшим мячиком. Мячики столкнулись в воздухе. Определите сумму времен нахождения мячиков в полете до столкновения, если окна находятся на одной вертикали на расстоянии h друг от друга. Ускорение свободного падения g. Влиянием воздуха пренебречь.","problemImage":"olympiad-assets/241.jpg"},{"id":"1.30.1","chapter":1,"chapterName":"Механика","topic":"1.30","topicName":"Трубка с жидкостью","difficulty":"hard","score":3.44,"searchText":"(Всесиб., 2018, 9 ) Длинный сосуд массы M и внутренним сечением Sс лежит на столе. В верхней стенке сосуда имеется небольшое отверстие сечения Sпр, которое плотно закрыто пробкой. Чтобы вытащить пробку, удерживая сосуд, надо приложить силу f. Сосуд заполнили водой и начинают тянуть по горизонтальному столу за открытый конец с большой силой F. При каком минимальном значении этой силы пробка выскочит? Расстояние от уровня воды до пробки X, а от уровня воды до дна сосуда L. Плотность воды ρ, трения между сосудом и столом нет.","problemImage":"olympiad-assets/242.jpg"},{"id":"3.1.7","chapter":3,"chapterName":"Электричество","topic":"3.1","topicName":"Электрические цепи","difficulty":"hard","score":3.44,"searchText":"(Всеросс., 2023, МЭ, 9 ) В электрической цепи, схема которой изображена на рисунке, сопротивления всех резисторов одинаковы и равны R = 60 Ом, а напряжение идеального источника равно U = 9 В. Сопротивлением проводов можно пренебречь. 1. Найдите силу тока, текущего через резистор R6. Ответ выразите в мА, округлите до целого числа. 2. Найдите силу и направление тока, текущего через провод AB. Ответ выразите в мА, округлите до целого числа. А) от точки A к точке B; Б) от точки B к точке A. 3. Найдите силу и направление тока, текущего через провод CD. Ответ выразите в мА, округлите до целого числа. А) от точки C к точке D; Б) от точки D к точке C.","problemImage":"olympiad-assets/243.jpg"},{"id":"4.3.2","chapter":4,"chapterName":"Оптика","topic":"4.3","topicName":"Преломление света","difficulty":"hard","score":3.44,"searchText":"(Олимпиада КФУ, 2019, 9 ) На дне сосуда с водой расположены два зеркала под углом 90◦ − α, α — малый угол, может быть как положительным так и отрицательным. На поверхность воды падает лазерный луч под углом падения β и, преломляясь, попадает на первое зеркало, а затем на второе (см. рис.). Определите угол между вошедшим в воду и вышедшим из воды лучем. Показатель преломления воды n. Указание: возможно будет полезна формула sin(α+β) = sin α cos β +sin β cos α; для малого α в первом приближении sin α ≈ α, cos α ≈ 1. • Формула линзы • Общая формула линзы","problemImage":"olympiad-assets/244.jpg"},{"id":"1.11.5","chapter":1,"chapterName":"Механика","topic":"1.11","topicName":"Движение по окружности","difficulty":"hard","score":3.45,"searchText":"(«Шаг в будущее», 2021, 9 ) При резке металлического проката (листы, прутки, рельсы и т. п.) может использоваться два типа дисковых режущих инструментов: абразивные диски и металлические с твердосплавными зубцами. Оба диска имеют диаметр 300 мм, при этом абразивный диск постепенно стачивается. Частота вращения обоих дисков постоянна и равна 3600 об/мин. Производительность k дисков определяется отношением скорости реза (площади распиливаемого поперечного сечения в секунду, м2 /с) к скорости резания (скорости движения края диска по заготовке, м/с) и равна 10−6 м. Определить проценты износа металлического диска с твердосплавными зубцами и абразивного диска при разрезании каждым из них 40 металлических стержней круглого сечения диаметром 5 см, если одним абразивным диском можно перепилить 0,133 м2 металла, а ресурс стального диска равен 60 минутам.","problemImage":"olympiad-assets/245.jpg"},{"id":"1.35.6","chapter":1,"chapterName":"Механика","topic":"1.35","topicName":"Механические колебания и волны","difficulty":"hard","score":3.45,"searchText":"(«Формула Единства» / «Третье тысячелетие», 2023, 9 ) Осёл, козёл, мартышка и косолапый мишка выступали на юбилее Политехнического. Помня о дурной славе своего квартета, они заменили альт и контрабас на гобой и фагот, а скрипки оставили. И перед концертом проверили, что все инструменты звучат в унисон. Взлетали и лопались наполненные гелием шары, а сотрудники кафедры гидроаэродинамики надували из баллонов всё новые и новые... К концу вечера музыканты обнаружили, что духовые безнадёжно перестали попадать в ноты. От распада квартет спас студент-физик, который напомнил, что, прижимая струну, скрипачи задают частоту её колебаний, а клапаны духовых инструментов задают длину волны издаваемого звука. Из-за значительного количества гелия в воздухе скорость звука увеличилась на 10%. На сколько стали отличаться частоты инструментов, изначально настроенных на 300 Гц?","problemImage":"olympiad-assets/246.jpg"},{"id":"3.2.11","chapter":3,"chapterName":"Электричество","topic":"3.2","topicName":"Вычисление сопротивлений","difficulty":"hard","score":3.45,"searchText":"(Всесиб., 2020, 9 ) На тонкую непроводящую ленту толщиной d1 и шириной h нанесено с одной стороны проводящее покрытие толщиной d2. Лента плотно свита в спираль с радиусом свитка r проводящим слоем наружу. Если щупы омметра прижать к противоположным торцам свитка (точки A и B на рис.), он показывает сопротивление R1. Какими будут показания омметра, если одним щупом коснуться центра свитка (точка C), а другим — его края (точка D)? Краевыми эффектами пренебречь.","problemImage":"olympiad-assets/247.jpg"},{"id":"3.4.7","chapter":3,"chapterName":"Электричество","topic":"3.4","topicName":"Мощность тока","difficulty":"hard","score":3.45,"searchText":"(Всеросс., 2023, МЭ, 9 ) Аккумуляторные батарейки типоразмера AA имеют длину 5,0 см, диаметр 1,4 см и массу 17 г. 1. Сколько энергии может выделить такой аккумулятор, работая в номинальном режиме, если напряжение аккумулятора равно 1,2 В, а его ёмкость 2800 мА · ч? Ответ выразите в кДж, округлите до десятых долей. 2. С какой скоростью полетит эта батарейка, если полностью преобразовать запасённую в ней энергию в кинетическую энергию батарейки? Ответ выразите в км/с, округлите до десятых долей. 3. Сколько энергии содержится в сахарном песке, занимающем такой же объём, как данная батарейка? Плотность сахарного песка 0,77 г/см3, а его калорийность 1680 кДж на 100 грамм. Ответ выразите в кДж, округлите до десятых долей.","problemImage":"olympiad-assets/248.jpg"},{"id":"1.29.18","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"hard","score":3.46,"searchText":"(Олимпиада КФУ, 2020, 9 ) В лаборатории экспериментально синтезировали жидкое вещество, которое оседает на дно так, что его плотность меняется от глубины как ρ = ρ0 + αh, где ρ0 = 200 кг/м3 это плотность у самой поверхности, и коэффициент α = 0,05 кг/м4. В такую жидкость опустили цилиндр высотой H, в результате чего он погрузился на половину своего объема. Затем на цилиндр положили груз массой M = 100 г. и тот погрузился полностью. Найдите высоту цилиндра, если площадь основания цилиндра S = 20 см2.","problemImage":"olympiad-assets/249.jpg"},{"id":"1.29.20","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"hard","score":3.46,"searchText":"(«Надежда энергетики», 2022, 9 ) Кастрюля с водой 1 уравновешена на рычажных весах с помощью гири 2 (см. рис. а). В воду опускают металлический шарик 4, подвешенный на легкой нити (см. рис. б) так, что он не касается дна и стенок кастрюли. Нить привязана к коромыслу 3 вторых весов, равновесие которых достигается при помещении на правую чашку трех одинаковых гирек 5. Определите плотность материала шарика, если для уравновешивания весов с кастрюлей к гире 2 необходимо добавить одну гирьку 5. Плотность воды ρ = 1000 кг/м3.","problemImage":"olympiad-assets/250.jpg"},{"id":"1.28.24","chapter":1,"chapterName":"Механика","topic":"1.28","topicName":"Статика","difficulty":"hard","score":3.47,"searchText":"(«Шаг в будущее», 2022, 9 ) Ситуационная задача. Автомобиль массой 1600 кг оснащен независимой подвеской всех четырех колес. Полный ход подвески (в точке крепления колеса) составляет 30 см. Пружины жесткостью 300 кН/м размещены на половине длины рычага подвески, и в нижнем положении рычага полностью расслаблены. Передняя подвеска несет 60% массы. Определите номинальное сжатие пружин подвески и номинальный ход каждой подвески. Для передней подвески номинальное сжатие пружины 3,14 см, номинальный ход подвески 6,3 см;","problemImage":"olympiad-assets/251.jpg"},{"id":"3.1.8","chapter":3,"chapterName":"Электричество","topic":"3.1","topicName":"Электрические цепи","difficulty":"hard","score":3.47,"searchText":"(Всеросс., 2022, МЭ, 9 ) Участок цепи, схема которого показана на рисунке, состоит из семи одинаковых резисторов сопротивлением 420 Ом каждый и идеальных соединительных проводов. Через этот участок течёт постоянный ток силой I = 100 мА. 1. Какое напряжение покажет идеальный вольтметр, если его выводы подключить к точкам B и G? Вольтметр показывает напряжение без учёта знака. Ответ выразите в вольтах, округлите до целого числа. 2. Какая тепловая мощность выделяется во всём участке цепи? Ответ выразите в ваттах, округлите до десятых долей.","problemImage":"olympiad-assets/252.jpg"},{"id":"1.22.1","chapter":1,"chapterName":"Механика","topic":"1.22","topicName":"Движение с переменной массой","difficulty":"hard","score":3.48,"searchText":"(«Шаг в будущее», 2022, 9 ) Платформа массы M = 700 кг заезжает под погрузочный бункер, расположенный на высоте h = 1,25 м, откуда в нее со скоростью µ = 100 кг/с начинает сыпаться песок. Определить скорость платформы через τ = 3 с после касания платформы первой песчинкой, если ее ускорение к этому моменту составляет a = 1 м/с2. Коэффициент сопротивления движению платформы со стороны рельсов k = 0,06. Сопротивлением воздуха пренебречь. Ускорение свободного падения принять равным 10 м/с2.","problemImage":"olympiad-assets/253.jpg"},{"id":"1.29.7","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"hard","score":3.48,"searchText":"(Всеросс., 2023, ШЭ, 9 ) В сосуде находятся вода и масло, жидкости не перемешаны между собой. На границу раздела жидкостей помещают поплавок неизвестной плотности. Плотность воды 1000 кг/м3, плотность масла 925 кг/м3. 1. Определите плотность поплавка, если известно, что в верхней жидкости находится 1/3 от всего объёма поплавка, а в нижней — остальные 2/3 объёма. Поплавок не касается дна сосуда. Ответ дайте в кг/м3, округлив до целого числа. 2. К этому поплавку подвесили снизу свинцовое грузило. Найдите отношение объёма поплавка к объёму грузила, если поплавок полностью погрузился в нижнюю жидкость. Плотность свинца 11300 кг/м3. Груз и поплавок не касаются дна сосуда. Ответ округлите до целого числа.","problemImage":"olympiad-assets/254.jpg"},{"id":"2.3.3","chapter":2,"chapterName":"Тепловые явления","topic":"2.3","topicName":"Фазовые переходы","difficulty":"hard","score":3.48,"searchText":"(Всеросс., 2021, ШЭ, 9 ) При приготовлении морса замороженную клюкву насыпали в кипящую воду. После этого температура воды упала до t1 = 89 ◦ C. Во сколько раз масса воды была больше массы клюквы? Поскольку ягоды клюквы маленькие, они размораживаются очень быстро, поэтому теплообмен воды с окружающей средой можно не учитывать. Начальная температура клюквы t2 = −18 ◦ C. Удельная теплоёмкость льда 2100 Дж/(кг · ◦ C), удельная теплоёмкость воды 4200 Дж/(кг · ◦ C), удельная теплота плавления льда 330 кДж/кг. Клюкву можно считать полностью состоящей из воды, так как эта ягода содержит очень много жидкости. Ответ округлите до целого числа.","problemImage":"olympiad-assets/255.jpg"},{"id":"3.1.25","chapter":3,"chapterName":"Электричество","topic":"3.1","topicName":"Электрические цепи","difficulty":"hard","score":3.48,"searchText":"(«Физтех», 2023, 9 ) В электрической цепи, схема которой представлена на рисунке, четыре резистора, у двух из которых сопротивление по 20 Ом, у двух других сопротивление по 40 Ом. Сопротивление амперметров пренебрежимо мало. После подключения к клеммам A и B источника постоянного напряжения показания амперметров оказались различными. Меньшее показание I1 = 1 А. 1. Найдите показание I2 второго амперметра. 2. Найдите напряжение U источника.","problemImage":"olympiad-assets/256.jpg"},{"id":"1.8.2","chapter":1,"chapterName":"Механика","topic":"1.8","topicName":"Графики движения","difficulty":"hard","score":3.49,"searchText":"(Всеросс., 2021, ШЭ, 9 ) Тело движется вдоль прямой, не изменяя направления своего движения. На рисунке приведён график зависимости модуля скорости тела от пройденного им пути. 1. За какое время тело прошло путь 8 м? Ответ выразите в секундах, округлите до десятых долей. 2. Чему равна средняя скорость тела за первые 2 с его движения? Ответ выразите в м/с, округлите до целого числа. 3. Чему равна средняя скорость тела на первой половине пройденного им пути? Ответ выразите в м/с, округлите до десятых долей.","problemImage":"olympiad-assets/257.jpg"},{"id":"1.17.6","chapter":1,"chapterName":"Механика","topic":"1.17","topicName":"Сила трения","difficulty":"hard","score":3.49,"searchText":"(«Курчатов», 2021, 9 ) Кошка совершает прыжок с края стола высоты H, приобретая начальную скорость V0, направленную под углом α к горизонту, таким что sin α = 2gH/V0. Длина лап кошки равна l, при этом l \u001c H. Приземление кошки на пол с коэффициентом трения µ происходит таким образом, что на кошку действует минимально возможная сила реакции опоры. Найдите тормозной путь кошки в двух случаях: а) коэффициент трения µ \u001c ctg α; б) коэффициент трения µ \u001d ctg α.","problemImage":"olympiad-assets/258.jpg"},{"id":"3.2.3","chapter":3,"chapterName":"Электричество","topic":"3.2","topicName":"Вычисление сопротивлений","difficulty":"hard","score":3.5,"searchText":"(Всеросс., 2023, МЭ, 9 ) На рисунках представлены схемы электрических цепей, каждая из которых имеет два вывода для подключения омметра. Выберите электрическую цепь, сопротивление которой, измеряемое между выводами, максимально. Сопротивление звеньев (участков между двумя соседними точками) во всех цепях одинаково. 1.; 2.; 3.; 4.; 5..","problemImage":"olympiad-assets/259.jpg"},{"id":"1.20.1","chapter":1,"chapterName":"Механика","topic":"1.20","topicName":"Движение со связями","difficulty":"hard","score":3.52,"searchText":"(«Будущие исследователи — будущее науки», 2015, 9 ) Клин массы m с углом α при основании находится на горизонтальном столе. На наклонную грань клина положили груз и начали на него действовать с постоянной силой, направленной перпендикулярно наклонной грани клина (см. рис.). Трение между грузом и клином, клином и столом отсутствует. Чему равно ускорение груза, если известно, что оно направлено вертикально? С какой силой клин при этом давит на стол? Ускорение свободного падения g считать известным.","problemImage":"olympiad-assets/260.jpg"},{"id":"1.29.25","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"hard","score":3.52,"searchText":"(«Будущие исследователи — будущее науки», 2019, 9 ) Два цилиндра одинаковой массы, сделанные из одного материала и имеющие длины 8 см и 10 см, висят на концах переброшенной через блок идеальной нити. При этом оба цилиндра наполовину погружены в воду (см. рис.). На сколько сместятся цилиндры, если после доливания воды в сосуд ее уровень поднимется на 4 см; на 5 см?","problemImage":"olympiad-assets/261.jpg"},{"id":"2.3.15","chapter":2,"chapterName":"Тепловые явления","topic":"2.3","topicName":"Фазовые переходы","difficulty":"hard","score":3.52,"searchText":"(«Курчатов», 2020, 9 ) Электрокалориметр, наполненный некоторым количеством воды, нагревают с постоянной мощностью N = 75 Вт. В воду, имеющую температуру 0 ◦ C, опускают небольшое количество льда и начинают измерять температуру смеси. Через три минуты после помещения льда в калориметр она увеличивается на ∆T1 = 1 ◦ C, а к концу четвёртой минуты ещё на ∆T2 = 4 ◦ C. Найдите изначальную массу воды в электрокалориметре, а также массу добавленного льда. Удельная теплота плавления льда λ = 340 Дж/г, удельная теплоёмкость воды C = 4,2 Дж/(г · ◦ C).","problemImage":"olympiad-assets/262.jpg"},{"id":"1.20.6","chapter":1,"chapterName":"Механика","topic":"1.20","topicName":"Движение со связями","difficulty":"hard","score":3.54,"searchText":"(Инженерная олимпиада, 2021, 9 ) Кривошипно-шатунный механизм состоит из двух стержней OA (кривошип) и AB (шатун), которые движутся следующим образом. Кривошип вращается с угловой скоростью ω вокруг точки O, шатун в точке A шарнирно связан с кривошипом, в точке B — с ползуном, который движется в направляющих, образующих угол α с горизонтом. Найти угловую скорость шатуна AB в тот момент времени, когда угол между кривошипом и горизонтом равен α = 30◦ (см. рисунок). AB = OA.","problemImage":"olympiad-assets/263.jpg"},{"id":"2.2.12","chapter":2,"chapterName":"Тепловые явления","topic":"2.2","topicName":"Теплообмен","difficulty":"hard","score":3.55,"searchText":"(Всесиб., 2018, 9 ) Жидкость через трубы подается от нагревателя к двум кранам. При включенном нагревателе начинают набирать воду из крана №1 (кран №2 закрыт). Температура воды в первых трех ведрах оказалась равной T1 = 20 ◦ C, T2 = 60 ◦ C и T3 = 70 ◦ C. Затем кран №1 закрывают, а кран №2 открывают. Определите температуру воды TX в первом ведре, набранном из крана №2. Длина трубы от нагревателя до места разветвления равна 2L, а от места разветвления до каждого из кранов — L. Объемы всех ведер и диаметры всех труб одинаковы. Перемешиванием жидкости в трубах и теплообменом между жидкостью и трубами пренебречь. Вначале трубы были полностью заполнены водой, а температура воды во всех трубах одинакова и равна T1. Нагреватель мгновенно повышает температуру проходящей через него воды до T3.","problemImage":"olympiad-assets/264.jpg"},{"id":"1.29.24","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"hard","score":3.56,"searchText":"(«Будущие исследователи — будущее науки», 2017, 9 ) Два цилиндра одинаковой высоты 6 см и одинакового поперечного сечения висят на концах переброшенной через блок идеальной нити. При этом один из цилиндров погружен в воду на половину высоты, а другой — на треть (см. рис.). Плотности материалов цилиндров больше плотности воды. На сколько сместятся цилиндры относительно блока, если после доливания воды в сосуд ее уровень поднимется на 5 см? правый цилиндр сместится на 2 см вниз, а левый — на 2 см вверх.","problemImage":"olympiad-assets/265.jpg"},{"id":"2.3.5","chapter":2,"chapterName":"Тепловые явления","topic":"2.3","topicName":"Фазовые переходы","difficulty":"hard","score":3.56,"searchText":"(Всеросс., 2021, МЭ, 9 ) В четыре одинаковые стеклянные колбы налили равные количества воды так, что колбы оказались заполнены лишь частично. Затем эти колбы с водой нагрели на водяной бане до температуры 100 ◦ C. После этого колбы вынули из водяной бани и провели с ними четыре разных опыта. 1. Первую колбу плотно закрыли пробкой и оставили остывать на воздухе при комнатной температуре. 2. Вторую колбу поместили в морозильную камеру, не затыкая пробкой. 3. Третью колбу плотно закрыли пробкой и сразу же полили холодной водой. 4. Четвертую колбу плотно закрыли пробкой и сразу же полили горячей водой при температуре 100 ◦ C. В ходе какого из этих опытов вода в колбе может закипеть? 1. 1 и 3; 2. 2; 3. 3; 4. 4; 5. 1 и 4.","problemImage":"olympiad-assets/266.jpg"},{"id":"1.28.6","chapter":1,"chapterName":"Механика","topic":"1.28","topicName":"Статика","difficulty":"hard","score":3.57,"searchText":"(«Надежда энергетики», 2018, 9 ) Дядюшка Поджер (персонаж юмористической повести Дж. К. Джерома «Трое в лодке, не считая собаки») забил гвоздь в стену и собрался вешать картину. У него есть моток прекрасного шелкового шнура, кусок которого он закрепил в специальных защелках в двух верхних углах картины и накинул шнурок на гвоздь. Однако картина никак не желала висеть ровно — она постоянно сползала то в одну, то в другую сторону. Очевидно трение между шнурком и гвоздем было слишком мало. Определите, какой длины должен быть шнурок, чтобы дядюшка Поджер смог всё же ровно подвесить прямоугольную картину с размерами a = 3 фута по горизонтали и b = 2 фута по вертикали, если полностью пренебречь трением между шнурком и гвоздем. Считать также, что защелки в углах картины не требуют дополнительной длины шнурка для его фиксации, а их массой, как и массой самого шнурка, можно пренебречь.","problemImage":"olympiad-assets/267.jpg"},{"id":"3.2.7","chapter":3,"chapterName":"Электричество","topic":"3.2","topicName":"Вычисление сопротивлений","difficulty":"hard","score":3.57,"searchText":"(«Надежда энергетики», 2017, 9 ) Квадратная пластина из тонкого медного листа разрезана на четыре одинаковых квадрата. Если в точке пересечения разрезов все малые квадраты соединить каплей припоя, то сопротивление между точками А и В будет равно R1 (рис. 1). Если эти же малые квадраты соединить четырьмя каплями, помещёнными в точках пересечения разрезов со сторонами исходного квадрата (рис. 2), то сопротивление между точками А и В будет равно R2. Полученную фигуру дополнительно разрезают по главным диагоналям, а затем скрепляют ещё четырьмя каплями припоя в точках пересечения разрезов с границей исходного квадрата (рис. 3). Определите в этом случае сопротивление между точками А и В. Разрезы полностью изолируют части пластины друг от друга, а сопротивление припоя пренебрежимо мало.","problemImage":"olympiad-assets/268.jpg"},{"id":"1.8.6","chapter":1,"chapterName":"Механика","topic":"1.8","topicName":"Графики движения","difficulty":"hard","score":3.6,"searchText":"(Всеросс., 2022, МЭ, 9 ) Две машины едут по прямой дороге навстречу друг другу с одинаковыми скоростями. Дорога проходит через мост длиной 600 м, и каждая машина въезжает на мост со своей стороны. На мосту скорости машин тоже одинаковы, но меньше, чем вне моста. На графике показана зависимость расстояния L между машинами от времени t. К сожалению, график был обрезан слева, и числа на вертикальной оси не сохранились. 1. Найдите скорость машин на мосту. Ответ выразите в км/ч, округлите до целого числа. 2. Чему равна скорость машин вне моста? Ответ выразите в км/ч, округлите до целого числа. 3. Найдите расстояние между машинами в начальный момент времени. Ответ выразите в м, округлите до целого числа.","problemImage":"olympiad-assets/269.jpg"},{"id":"1.9.8","chapter":1,"chapterName":"Механика","topic":"1.9","topicName":"Баллистика. Координаты","difficulty":"hard","score":3.6,"searchText":"(«Будущие исследователи — будущее науки», 2021, 9 ) Два тела бросили одновременно из точек на поверхности земли, удаленных друг от друга на расстояние L. Векторы начальных скоростей тел лежат в одной вертикальной плоскости и составляют с горизонтом углы 30◦ и 60◦ (см. рис.). Какого минимального значения достигает расстояние между находящимися в полете телами, если дальности полета тел равны L?","problemImage":"olympiad-assets/270.jpg"},{"id":"1.16.4","chapter":1,"chapterName":"Механика","topic":"1.16","topicName":"Сила упругости","difficulty":"hard","score":3.6,"searchText":"(Всеросс., 2023, ШЭ, 9 ) Вася взял три очень лёгкие пружины длиной 10 см каждая и жёсткостью 100 Н/м, 100 Н/м и 200 Н/м соответственно. 1. Вася соединил три эти пружины последовательно. Чему будет равно общее удлинение пружин, если левый конец сцепки закрепить, а к правому концу прикладывать силу 2 Н? Ответ выразите в сантиметрах, округлив до целого числа. 2. Систему с какой максимальной жёсткостью можно собрать, используя эти три пружины? Ответ выразите в Н/м, округлив до целого числа. 3. Систему с какой минимальной жёсткостью можно собрать, используя эти три пружины? Ответ выразите в Н/м, округлив до целого числа.","problemImage":"olympiad-assets/271.jpg"},{"id":"1.16.11","chapter":1,"chapterName":"Механика","topic":"1.16","topicName":"Сила упругости","difficulty":"hard","score":3.6,"searchText":"(«Росатом», 2022, 9 ) Куски невесомой нерастяжимой нити связывают три невесомых пружины с коэффициентами жесткости k, 2k и 3k. Концы веревки прикреплены к горизонтальному потолку, а сама она охватывает невесомый подвижный блок так, как показано на рисунке. Куски веревки от потолка до блока вертикальны. В некоторый момент времени блок начинают тянуть вниз с постоянной скоростью v. С какой скоростью движется точка A (см. рисунок)? Какой силой нужно действовать на блок через время t после начала движения? Считать, что для любых растяжений пружин справедлив закон Гука.","problemImage":"olympiad-assets/272.jpg"},{"id":"1.28.8","chapter":1,"chapterName":"Механика","topic":"1.28","topicName":"Статика","difficulty":"hard","score":3.6,"searchText":"(Олимпиада КФУ, 2021, 9 ) Две однородные гладкие доски длиной L и 2L, подвешенные с помощью системы идеальных* нитей и блоков (см. рис.), изначально находятся в равновесии в горизонтальном положении. Масса верхней доски M. На нижнюю доску закрепляют небольшой груз массой M на расстоянии a = 2L/3 от левого края. На каком расстоянии от левого края нужно поместить (закрепить) на верхнюю доску груз массы m = M/6, чтобы доски могли находиться в состоянии равновесия в горизонтальном положении? *Под идеальными нитями здесь подразумеваются гибкие невесомые и нерастяжимые нити. Под идеальными блоками — невесомые блоки, способные вращаться без трения.","problemImage":"olympiad-assets/273.jpg"},{"id":"1.29.32","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"hard","score":3.6,"searchText":"(Всесиб., 2016, 9 ) Когда на пластине из легкого пластика стояло три гири, то она плавала наполовину погрузившись в воду. Когда поставили двенадцать гирь, то верхняя грань пластины оказалась вровень с поверхностью воды. Во сколько раз плотность пластика меньше плотности воды? Гири одинаковы.","problemImage":"olympiad-assets/274.jpg"},{"id":"1.9.13","chapter":1,"chapterName":"Механика","topic":"1.9","topicName":"Баллистика. Координаты","difficulty":"hard","score":3.61,"searchText":"(«Формула Единства» / «Третье тысячелетие», 2023, 9 ) Колесо радиуса 20 см, двигаясь по прямой дороге равномерно со скоростью 9 км/ч, из-за наличия проскальзывания, переместилось всего на 2 метра, сделав при этом целых 5 оборотов. На какой максимальной высоте от земли сможет побывать капелька, оторвавшаяся от колеса в точке A? Примечание. Сопротивлением воздуха пренебрегите.","problemImage":"olympiad-assets/275.jpg"},{"id":"1.27.2","chapter":1,"chapterName":"Механика","topic":"1.27","topicName":"Неупругие взаимодействия","difficulty":"hard","score":3.61,"searchText":"(«Формула Единства» / «Третье тысячелетие», 2021, 9 ) Пушка стреляет ядром в наклонную (под углом α = 30◦ ) сверхпрочную горку. Удар ядра о горку абсолютно неупругий. В результате удара поверхность ядра, контактирующая с горкой, слегка размягчилась, но по мере скольжения ядра вдоль горки она остывает и твердеет. Экспериментально установлено, что при этом коэффициент трения скольжения зависит от пройденного расстояния вдоль горки так, как показано на рисунке. Какой высоты h должна быть горка, чтобы к человеку, находящемуся на вершине горки, ядро «приехало» с нулевой скоростью? Начальная скорость ядра v0 = 100 м/с, ускорение свободного падения g = 10 м/с2.","problemImage":"olympiad-assets/276.jpg"},{"id":"1.29.4","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"hard","score":3.62,"searchText":"(Всеросс., 2020, ШЭ, 9 ) В мензурку, стоящую внутри стакана на его горизонтальном дне, налито до некоторой высоты масло массой 100 г. В стакан медленно наливают воду. Когда высота воды в стакане сравнивается с высотой масла в мензурке, она отрывается от дна стакана. Плотность масла 800 кг/м3, плотность воды 1000 кг/м3. Вода подтекает под дно мензурки. Толщиной стенок мензурки можно пренебречь. Ускорение свободного падения принять равным g = 10 Н/кг. 1. Сколько миллилитров масла налито в мензурку? Ответ округлите до целого числа. 2. Чему равна сила Архимеда, действующая на мензурку с маслом в момент её отрыва от дна стакана? Ответ укажите в ньютонах, округлив до сотых долей. 3. Найдите массу пустой мензурки. Ответ укажите в граммах, округлив до целого числа","problemImage":"olympiad-assets/277.jpg"},{"id":"2.3.12","chapter":2,"chapterName":"Тепловые явления","topic":"2.3","topicName":"Фазовые переходы","difficulty":"hard","score":3.62,"searchText":"(Всесиб., 2016, 9 ) В сосуд с нагревателем через промежутки времени t0 = 6 мин опускают одинаковые порции снега с одинаковой, но неизвестной температурой. Первая порция растаяла и превратилась в воду с температурой 0 ◦ C через время t = 5 мин 20 сек, после чего температура воды выросла до T0 = 10 ◦ C к моменту опускания второй порции снега. Вторая порция растаяла через меньшее, чем t, время, третья еще быстрее, а сотая — растаяла почти сразу. Объясните, почему так происходит. Какова температура воды перед опусканием сотой порции снега и сразу после того, как она растаяла, если временем теплообмена можно пренебречь? Тепловая мощность, передаваемая нагревателем воде и снегу, постоянна.","problemImage":"olympiad-assets/278.jpg"},{"id":"1.28.15","chapter":1,"chapterName":"Механика","topic":"1.28","topicName":"Статика","difficulty":"hard","score":3.64,"searchText":"(Всесиб., 2017, 9 ) На вертикальном бруске толщины d = 2 см лежит симметрично однородный горизонтальный брусок длины L = 20 см. К правому концу горизонтального бруска на лёгкой нити подвесили груз, а к левому — гири. Найдите массу груза и массу горизонтального бруска, если равновесие сохраняется при суммарной массе гирь от m1 = 22 г до m2 = 107 г, а вне этого интервала масс перевешивают или груз, или гири. m = (m2 + m1 )/2 − (m2 − m1 )d/2L ≈ 60 г; M = (m2 − m1 )(L2 + d2 )/2Ld − (m2 + m1 ) ≈ 300 г","problemImage":"olympiad-assets/279.jpg"},{"id":"3.3.1","chapter":3,"chapterName":"Электричество","topic":"3.3","topicName":"Эквивалентный источник","difficulty":"hard","score":3.64,"searchText":"(«Курчатов», 2020, 9 ) Элементы с внутренними сопротивлениями r1 = 5 Ом и r2 = 2 Ом и с ЭДС E1 = 3 В и E2 = 10 В соединены с внешним сопротивлением R, как показано на рисунке 1. Элементы с E1 и E2 заменяют на один элемент с ЭДС E и внутренним сопротивлением r, как показано на рисунке 2, при этом падение напряжения на внешнем резисторе не меняется для любого значения сопротивления R. Найдите значения E и r.","problemImage":"olympiad-assets/280.jpg"},{"id":"1.19.1","chapter":1,"chapterName":"Механика","topic":"1.19","topicName":"Наклонная плоскость","difficulty":"hard","score":3.65,"searchText":"(Олимпиада КФУ, 2023, 9 ) Брусок массы m = 5 кг лежит на наклонной плоскости, образующей угол α = 30◦ с горизонтом. Оси координат представлены на рисунке, ось y перпендикулярна плоскости рисунка. Какую минимальную силу F в плоскости yz нужно приложить, чтобы тело сдвинулось с места? Коэффициент трения между бруском и плоскостью µ = 0,6. Сила F направлена под углом γ = 60◦ к оси z. Внешняя сила приложена таким образом, что брусок движется поступательно. Ускорение свободного падения принять за 10 м/c2. • Движение со связями. Кинематика • Движение со связями. Динамика","problemImage":"olympiad-assets/281.jpg"},{"id":"1.28.2","chapter":1,"chapterName":"Механика","topic":"1.28","topicName":"Статика","difficulty":"hard","score":3.66,"searchText":"(Всеросс., 2020, ШЭ, 9 ) Однородная деревянная линейка с миллиметровыми делениями имеет массу 20 г и длину 40 см. Отметка «0» находится на самом краю линейки. На столе лежит круглый в поперечном сечении карандаш. На этот карандаш перпендикулярно ему положили линейку. Она касается карандаша штрихом «15 см». На конце линейки с отметкой «40 см» стоит игрушка Буратино массой 10 г. 1. На какое деление линейки нужно посадить попугая Кешу (его масса 50 г), чтобы они с Буратино могли качаться на линейке, как на качелях? Ответ укажите в см, округлив до целого числа. 2. Какая сила реакции действует на линейку со стороны карандаша после того, как Кеша сел на неё, приведя линейку в горизонтальное положение? Ускорение свободного падения принять равным g = 10 Н/кг. Ответ укажите в ньютонах, округлив до десятых долей.","problemImage":"olympiad-assets/282.jpg"},{"id":"3.2.12","chapter":3,"chapterName":"Электричество","topic":"3.2","topicName":"Вычисление сопротивлений","difficulty":"hard","score":3.66,"searchText":"(Всесиб., 2019, 9 ) Две одинаковых катушки соединены двумя отрезками провода длиной L = 1 м каждый (см. рисунок). Известно, что катушки намотаны тем же проводом, который использован для соединения их выводов. Определите длину этого провода в каждой из катушек, если омметр, подключенный к клеммам A и B, показывает сопротивление R1 = 0,5455 Ом, а при его подключении к точкам A и B1 он показывает R2 = 0,55 Ом. Целостность схемы не нарушается.","problemImage":"olympiad-assets/283.jpg"},{"id":"1.5.3","chapter":1,"chapterName":"Механика","topic":"1.5","topicName":"Относительность движения","difficulty":"hard","score":3.67,"searchText":"(Всеросс., 2021, МЭ, 9 ) Два плота свободно сплавляются по прямой реке, двигаясь друг за другом вдоль оси её русла с постоянной скоростью течения. Расстояние между плотами 100 м. Мальчик прыгает с первого плота, плывущего ниже по течению реки, плывёт ко второму плоту, который находится выше по течению реки, касается его и возвращается к своему первому плоту. Известно, что мальчик доплыл обратно от второго плота к первому за 4 минуты. Скорость мальчика в неподвижной воде в два раза больше скорости течения реки. 1. Какое расстояние прошли плоты за эти 4 минуты? Ответ дайте в метрах, округлив до целого числа. 2. Сколько времени затратил бы мальчик на весь аналогичный заплыв (туда и обратно), если бы расстояние между плотами было в два раза меньше? Ответ дайте в минутах, округлив до целого числа.","problemImage":"olympiad-assets/284.jpg"},{"id":"1.25.3","chapter":1,"chapterName":"Механика","topic":"1.25","topicName":"Упругие взаимодействия","difficulty":"hard","score":3.67,"searchText":"(«Курчатов», 2020, 9 ) В кубе массы M просверлено отверстие так, что шар массы m может войти горизонтально, а затем пройти через куб и вылететь вертикально вверх. Шар и куб расположены на поверхности без трения, куб изначально находится в покое. Рассмотрим ситуацию, в котором шар движется горизонтально со скоростью v0. Шар попадает в куб и выбрасывается из верхней части куба. Предположим, что нет потерь на трение, когда шар проходит через куб, где он входит в верхнее отверстие, а затем выбрасывается из бокового отверстия. Определите время возврата шарика в положение, в котором происходит первоначальное столкновение, в терминах отношения масс β = M m","problemImage":"olympiad-assets/285.jpg"},{"id":"3.1.22","chapter":3,"chapterName":"Электричество","topic":"3.1","topicName":"Электрические цепи","difficulty":"hard","score":3.67,"searchText":"(«Росатом», 2022, 9 ) Когда омметр, амперметр и вольтметр соединили последовательно (левый рисунок), их показания были следующими: омметра R0 = 1,0 Ом, амперметра I0 = 1,0 А, вольтметра U0 = 1,0 В. Какими будут показания приборов, когда их соединили так, как показано на правом рисунке, если внутреннее сопротивление омметра равно rΩ = 1,0 Ом. Указание. Омметр — прибор для измерения сопротивлений — представляет собой последовательно соединённые источник напряжения, амперметр и резистор. Омметр измеряет силу электрического тока в цепи и пересчитывает её и напряжение источника в сопротивление внешней цепи.","problemImage":"olympiad-assets/286.jpg"},{"id":"4.2.2","chapter":4,"chapterName":"Оптика","topic":"4.2","topicName":"Отражение света. Плоское зеркало","difficulty":"hard","score":3.67,"searchText":"(Всеросс., 2021, ШЭ, 9 ) В большой комнате на стене висит высокое прямоугольное зеркало шириной 2 м. На расстоянии 1 м от этой стены и 2 м от вертикального края зеркала (если измерять вдоль стены) стоит человек A. Он начинает двигаться со скоростью 1 м/с в сторону зеркала параллельно стене, на которой оно висит. В этот же момент человек B, который находится на расстоянии 3,5 м от зеркала напротив его середины, начинает идти к зеркалу со скоростью 1 м/с вдоль линии, перпендикулярной стене. Начальные положения и направления движений обоих людей показаны на рисунке. 1. С какой скоростью сближаются человек B и его изображение в зеркале? Ответ выразите в м/с, округлите до целого числа. 2. На каком расстоянии от стены, на которой висит зеркало, находится изображение человека A в момент начала его движения? Ответ выразите в метрах, округлите до целого числа. 3. Через какое время после начала движения человек A и человек B увидят друг друга в зеркале? Ответ выразите в секундах, округлите до десятых долей.","problemImage":"olympiad-assets/287.jpg"},{"id":"1.28.11","chapter":1,"chapterName":"Механика","topic":"1.28","topicName":"Статика","difficulty":"hard","score":3.69,"searchText":"(«Формула Единства» / «Третье тысячелетие», 2023, 9 ) На цилиндрическом карнизе для портьер свободно надето тонкое кольцо. В нижней точке кольца находится улитка (см. рис.). Масса улитки и кольца одинаковы. Улитка начинает медленно двигаться вверх по кольцу. При каком минимальном значении коэффициента трения кольца о карниз улитка сумеет добраться до верхней точки кольца?","problemImage":"olympiad-assets/288.jpg"},{"id":"2.3.2","chapter":2,"chapterName":"Тепловые явления","topic":"2.3","topicName":"Фазовые переходы","difficulty":"hard","score":3.69,"searchText":"(Всеросс., 2020, ШЭ, 9 ) Вася решил выяснить, какова температура снега внутри сугробов во дворе. У него не нашлось термометра, но он знал, что системы вентиляции и отопления у него дома поддерживают температуру внутри квартиры равной +20 ◦ C. В первую очередь Вася набрал в чашку воду и оставил её на столе на ночь, чтобы та достигла комнатной температуры. На следующий день он принёс домой целый термос снега, вынутого изнутри сугроба, и разделил его на две равные части. На первую половину Вася потихоньку лил воду при комнатной температуре, помешивая, пока весь снег не растаял. На это ушло 880 мл воды. Второй половине снега Вася просто дал растаять: объём полученной воды оказался равным 210 мл. Наконец он выяснил, что удельная теплоёмкость воды 4200 Дж/(кг · ◦ C), удельная теплоёмкость льда (из кристаллов которого состоит снег) 2100 Дж/(кг · ◦ C), а его удельная теплота плавления 340 кДж/кг. 1. Найдите температуру снега внутри сугроба. Ответ укажите в градусах Цельсия, округлив до целого числа. 2. Какая температура установилась бы в термосе, если бы Вася смешал 880 мл воды со всем снегом, который он принес домой? Ответ укажите в градусах Цельсия, округлив до целого числа.","problemImage":"olympiad-assets/289.jpg"},{"id":"1.35.4","chapter":1,"chapterName":"Механика","topic":"1.35","topicName":"Механические колебания и волны","difficulty":"hard","score":3.7,"searchText":"(Всеросс., 2023, МЭ, 9 ) В случае землетрясения из его очага (гипоцентра) начинают распространяться несколько типов волн. Так называемые первичные (p) волны являются самыми быстрыми. Пусть в нашем случае их скорость распространения составляет 5 км/с. Вторичные (s) волны более медленные, распространяются со скоростью 3 км/с. Две станции сейсмологических наблюдений находятся на расстоянии 75 км друг от друга. Одна станция фиксирует приход p- и s-волн с разницей в 6 с, а вторая — в 8 с. Найдите максимальную глубину, на которой мог находиться гипоцентр землетрясения. Ответ выразите в км, округлите до целого числа.","problemImage":"olympiad-assets/290.jpg"},{"id":"3.1.23","chapter":3,"chapterName":"Электричество","topic":"3.1","topicName":"Электрические цепи","difficulty":"hard","score":3.7,"searchText":"(Всесиб., 2022, 9 ) В распоряжении инженера имелись три одинаковых вольтметра. Для того чтобы измерить сопротивление резистора, включенного в схему последовательно с резистором с сопротивлением R0 = 1000 Ом, инженер сделал два измерения. В первом случае он подключил вольтметры по схеме I (см. рис.), а во втором — по схеме II. В первом случае вольтметры показывали, соответственно, V1 = 10 В и U1 = 34 В, во втором — V2 = 9 В и U2 = 17 В. Определите сопротивление неизвестного резистора. Вольтметры неидеальные (имеют конечное сопротивление).","problemImage":"olympiad-assets/291.jpg"},{"id":"2.2.8","chapter":2,"chapterName":"Тепловые явления","topic":"2.2","topicName":"Теплообмен","difficulty":"hard","score":3.71,"searchText":"(«Надежда энергетики», 2017, 9 ) Петя пришёл из школы и решил приготовить себе на обед пельмени. На упаковке он прочитал, что для этого надо сначала вскипятить воду. Он налил в кастрюлю некоторое количество холодной воды при температуре t0 = 20 ◦ C, но когда она через время T = 12 мин закипела, то пришла из школы его старшая сестра Лена, и сказала, что тоже хочет пельменей. Кипящей воды в кастрюле оказалось недостаточно для двух порций. Лена быстро долила в кипящую воду некоторое количество холодной воды при той же температуре t0. Через время τ = 4 мин вода в кастрюле опять закипела, и ребята приготовили себе пельмени. Определите минимальную температуру воды θ в кастрюле после добавления холодной воды в кипяток. Скорость поступления тепла к воде в кастрюле и скорость утечки тепла из кастрюли считайте постоянными.","problemImage":"olympiad-assets/292.jpg"},{"id":"1.9.11","chapter":1,"chapterName":"Механика","topic":"1.9","topicName":"Баллистика. Координаты","difficulty":"hard","score":3.72,"searchText":"(Олимпиада КФУ, 2020, 9 ) В особо охраняемой комнате, вдоль прямой линии, по полу двигается источник лазерного излучения, направленный вверх. Под потолком синхронно с лазером двигается анализатор, который фиксирует прерывания луча. Луч равномерно сдвигается вперед на расстояние a, затем возвращается в исходную точку также с постоянной скоростью. Период его движения равен T. Из этой исходной точки кто-то бросил мячик под углом α. В этот момент лазер находился на другой стороне (на расстоянии a от точки бросания). Найдите максимальную скорость, при которой анализатор зафиксирует ровно 3 прерывания луча. Отскок от стены не рассматривать. Размерами мячика пренебречь.","problemImage":"olympiad-assets/293.jpg"},{"id":"1.29.41","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"hard","score":3.72,"searchText":"(«Физтех», 2022, 9 ) Ко дну бассейна глубиной H = 2,5 м приклеена осесимметричная конструкция (см. рис.). Клей затвердел. Верхняя поверхность конструкции — полусфера. Объём конструкции V = 8 дм3, площадь соприкосновения конструкции с дном через клей S = 20 см2. Плотность воды ρ = 1 г/см3, атмосферное давление P0 = 100 кПа. Ускорение свободного падения g = 10 м/с2. 1. Найдите давление P1 вблизи дна. 2. Найдите величину силы F (с указанием направления), с которой вода действует на конструкцию.","problemImage":"olympiad-assets/294.jpg"},{"id":"1.28.22","chapter":1,"chapterName":"Механика","topic":"1.28","topicName":"Статика","difficulty":"hard","score":3.73,"searchText":"(Всесиб., 2023, 9 ) Два одинаковых однородных стержня длиной L и массой m одним концом закреплены на оси (см. рис.). Их свободные концы связаны невесомой пружиной. В состоянии равновесия стержни и пружина образуют равнобедренный прямоугольный треугольник. Когда, действуя на левый стержень, треугольник повернули вправо так, что правый стержень принял горизонтальное положение, равновесный угол между стержнями составил 60◦. Определите жесткость пружины. При сжатии ось пружины не изгибается. Ускорение свободного падения g.","problemImage":"olympiad-assets/295.jpg"},{"id":"1.29.35","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"hard","score":3.74,"searchText":"(Всесиб., 2019, 9 ) Когда незадачливый рыбак устроился на плавающей льдине и пробурил в ней лунку, он обнаружил, что уровень воды в лунке на h1 ниже верхней кромки льда. Через некоторое время на льдину забрался тюлень. Когда он расположился рядом с рыбаком, глубина незаполненной водой части лунки уменьшилась до h2. Какой станет эта глубина, когда рыбака снимут с льдины, а тюлень с нее уплывет? Масса рыбака m1, масса тюленя m2. Льдина плоская, рыбак и тюлень находились в ее центре. Льдина не тает.","problemImage":"olympiad-assets/296.jpg"},{"id":"3.5.2","chapter":3,"chapterName":"Электричество","topic":"3.5","topicName":"Электронагреватель","difficulty":"hard","score":3.74,"searchText":"(«Физтех», 2023, 9 ) Воду нагревают на электроплитке. Начальная температура воды τ0 = 14 ◦ C, объем воды V = 2 л. Сопротивление спирали электроплитки R = 20 Ом, сила тока в спирали I = 5 А. Зависимость мощности P тепловых потерь от времени t представлена на графике (см. рис.). 1. Найдите мощность Pн нагревателя. 2. Через какое время T после начала нагревания температура воды станет равной τ1 = 25 ◦ C? Плотность воды ρ = 1000 кг/м3, удельная теплоемкость воды c = 4200 Дж/(кг · ◦ C).","problemImage":"olympiad-assets/297.jpg"},{"id":"2.2.5","chapter":2,"chapterName":"Тепловые явления","topic":"2.2","topicName":"Теплообмен","difficulty":"hard","score":3.75,"searchText":"(Всеросс., 2023, МЭ, 9 ) В трёх одинаковых калориметрах находятся одинаковые порции масла, которые имеют одинаковую температуру. Подвешенный на нити нагретый металлический цилиндр опускают в первый калориметр, и после установления теплового равновесия температура масла в нём увеличивается на 20 ◦ C. Затем этот цилиндр перемещают из первого калориметра во второй, и после установления теплового равновесия температура масла в нём увеличивается на 5 ◦ C. После этого указанный цилиндр переносят из второго калориметра в третий. Потерями теплоты в окружающую среду, теплоёмкостью калориметров, а также прилипанием масла к цилиндру можно пренебречь. 1. На сколько градусов Цельсия повысится температура масла в третьем калориметре после установления теплового равновесия? Ответ округлите до сотых долей. 2. На сколько градусов Цельсия повысится установившаяся температура цилиндра, если после всех проделанных процедур перелить масло из первых двух калориметров в третий, в котором уже находится цилиндр? Ответ округлите до сотых долей.","problemImage":"olympiad-assets/298.jpg"},{"id":"1.28.16","chapter":1,"chapterName":"Механика","topic":"1.28","topicName":"Статика","difficulty":"hard","score":3.76,"searchText":"(Всесиб., 2021, 9 ) Изображенная на рисунке система находится в равновесии. Массы грузов слева направо m1 = 4 кг, m2 = 5 кг и m3 = 3 кг. Блоки и нити невесомые, трения нет. Определите, под каким углом к вертикали располагаются участки нитей AB и BC. Ускорение свободного падения g = 10 м/с2. β = arctg(4/3) — между BC и вертикалью α = arctg(3/4) — между AB и вертикалью","problemImage":"olympiad-assets/299.jpg"},{"id":"1.5.2","chapter":1,"chapterName":"Механика","topic":"1.5","topicName":"Относительность движения","difficulty":"hard","score":3.77,"searchText":"(Всеросс., 2023, ШЭ, 9 ) Три тела A, B и C в некоторый момент времени располагаются на одной прямой дороге и двигаются вдоль неё. Скорость тела A относительно дороги равна 3 м/с и направлена вправо (см. рисунок). Модуль скорости тела B относительно тела A равен 2 м/с. Тело C движется влево относительно тела A и в процессе движения всегда находится в середине отрезка AB. 1. В какую сторону относительно дороги движется тело B? Если влево — укажите в качестве ответа цифру «1». Если вправо — укажите в качестве ответа цифру «2». Если покоится — укажите в качестве ответа цифру «0». 2. Каков модуль скорости тела B относительно дороги? Ответ дайте в м/с, округлив до целого числа. 3. Куда движется тело C относительно дороги? Если влево — укажите в качестве ответа цифру «1». Если вправо — укажите в качестве ответа цифру «2». Если покоится — укажите в качестве ответа цифру «0». 4. Каков модуль скорости тела C относительно дороги? Ответ дайте в м/с, округлив до целого числа.","problemImage":"olympiad-assets/300.jpg"},{"id":"1.9.19","chapter":1,"chapterName":"Механика","topic":"1.9","topicName":"Баллистика. Координаты","difficulty":"hard","score":3.78,"searchText":"(«Росатом», 2023, 9 ) На очень длинной гладкой наклонной плоскости с углом наклона α удерживают прямоугольную коробку высотой h. В некоторый момент времени коробку отпускают, и она начинает скользить по плоскости. В этот же момент от верхнего края коробки начинает падать маленький упругий шарик (см. рис.). Какой путь пройдет коробка по плоскости к моменту 6-го удара шарика о ее дно? Столкновения шарика с дном коробки упругие.","problemImage":"olympiad-assets/301.jpg"},{"id":"1.5.9","chapter":1,"chapterName":"Механика","topic":"1.5","topicName":"Относительность движения","difficulty":"hard","score":3.8,"searchText":"(«Надежда энергетики», 2015, 9 ) На кондитерской фабрике работает автомат по укладке шоколадных конфет. Он представляет собой механический манипулятор, способный перемещаться вдоль одной прямой перпендикулярно ленте транспортера, на которой лежат пустые коробки с ячейками для конфет. Конфета моментально попадает в ячейку, как только манипулятор окажется над ней. Рассмотрим движение автомата и коробок на плоскости XOY. Координаты ячеек (x, y) — это натуральные числа, причем в исходном положении 8 ⩽ 26, 2 ⩽ y ⩽ 15 (все значения координат заданы в дюймах). Лента транспортера начинает двигаться в направлении, противоположном оси OX, со скоростью v = 1 дюйм/с. Одновременно из начала координат вдоль оси OY с постоянной скоростью без остановок начинает двигаться манипулятор. Какое максимальное количество конфет сможет уложить манипулятор за время однократного пересечения транспортера и с какой скоростью он должен двигаться?","problemImage":"olympiad-assets/302.jpg"},{"id":"1.27.1","chapter":1,"chapterName":"Механика","topic":"1.27","topicName":"Неупругие взаимодействия","difficulty":"hard","score":3.8,"searchText":"(«Курчатов», 2023, 9 ) Шар массой M = 0,2 кг покоится на вертикальной колонне высотой h = 5 м. Пуля массой m = 0,01 кг, летящая горизонтально со скоростью v0 = 500 м/с, проходит горизонтально через шар и летит дальше. В результате шар достигает земли на расстоянии s = 20 м от основания колонны. На каком расстоянии от основания колонны d пуля достигнет земли? Какая часть кинетической энергии пули перешла в теплоту при прохождении пули через мяч? Сопротивлением воздуха пренебречь. Ускорение свободного падения g = 10 м/с2.","problemImage":"olympiad-assets/303.jpg"},{"id":"2.3.6","chapter":2,"chapterName":"Тепловые явления","topic":"2.3","topicName":"Фазовые переходы","difficulty":"hard","score":3.8,"searchText":"(Всеросс., 2020, МЭ, 9 ) Образец вещества в жидком состоянии помещают в охлаждающее устройство, которое отводит от образца теплоту. На рисунке приведена зависимость температуры T этого образца (температура выражена в Кельвинах) от времени t. Удельная теплоёмкость вещества образца в жидком состоянии составляет 3000 Дж/(кг· ◦ C). Один градус Цельсия равен одному Кельвину. 1. Найдите удельную теплоту плавления образца. Ответ выразите в кДж/кг и округлите до десятых долей. 2. Найдите удельную теплоёмкость образца в твёрдом состоянии. Ответ выразите в Дж/(кг · ◦ C) и округлите до целого числа.","problemImage":"olympiad-assets/304.jpg"},{"id":"1.29.39","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"hard","score":3.81,"searchText":"(«Физтех», 2022, 9 ) На горизонтальной поверхности расположены два цилиндрических сообщающихся сосуда (см. рис.), в которых налита жидкость плотности ρ. На свободных поверхностях жидкости находятся лёгкие поршни. Зазоров между стенками сосудов и поршнями нет. Левый поршень соединён пружиной жёсткости k с верхней опорой. Разность уровней жидкости в сосудах равна h. Площадь сечения левого поршня S, правого S/2. Трение поршней о стенки сосудов пренебрежимо мало. Ускорение свободного падения g. 1. Найдите деформацию x пружины. 2. Найдите массу m груза, который следует положить на правый поршень, чтобы пружина стала недеформированной.","problemImage":"olympiad-assets/305.jpg"},{"id":"1.29.37","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"hard","score":3.82,"searchText":"(Всесиб., 2023, 9 ) В ведре массой M находится тело массой m и жидкость массой mж. Вся эта система подвешена на нити (см. рис.) и находится в равновесии. Считая блоки и нить невесомыми, найти силу Архимеда, действующую на тело. Трения нет. Ускорение свободного падения g. Влиянием воздуха пренебречь.","problemImage":"olympiad-assets/306.jpg"},{"id":"1.18.3","chapter":1,"chapterName":"Механика","topic":"1.18","topicName":"Связанные тела","difficulty":"hard","score":3.83,"searchText":"(«Физтех», 2022, 9 ) На горизонтальном столе находится доска, на которой укреплён неподвижный блок, а также бруски, соединённые нитью. Массы брусков m1 = m, m2 = 2m. Коэффициент трения скольжения верхнего бруска по нижнему равен µ, трение между доской и нижним бруском отсутствует. Доску приводят в движение с постоянным ускорением, направленным вправо. Массой нити и блока, а также трением в оси блока можно пренебречь. 1. Найдите максимальное ускорение a0 доски, при котором бруски не будут проскальзывать относительно друг друга. 2. Найдите силу T натяжения нити, если доска движется с ускорением a > a0.","problemImage":"olympiad-assets/307.jpg"},{"id":"1.29.30","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"hard","score":3.83,"searchText":"(«Формула Единства» / «Третье тысячелетие», 2022, 9 ) Фигура полного объёма V = 0,01 м3 стоит на дне сосуда с водой и плотно закрывает отверстие площади S = 0,02 м2. Фигура выступает наружу на объём V1 = 0,002 м3, а вода в сосуде налита до уровня H = 0,25 м. При какой наименьшей массе фигуры она не всплывёт? Примечание. Считайте, что трение в отверстии отсутствует.","problemImage":"olympiad-assets/308.jpg"},{"id":"2.3.16","chapter":2,"chapterName":"Тепловые явления","topic":"2.3","topicName":"Фазовые переходы","difficulty":"hard","score":3.83,"searchText":"(«Курчатов», 2021, 9 ) Цилиндрический бачок высоты H содержит слой льда толщины h = 4H/5 при температуре 0 ◦ C. В бачок наливают до полного заполнения объема цилиндра воду с температурой 50 ◦ C, потом долго ждут, затем всю воду выливают. Какое минимальное число раз нужно повторить эту операцию, чтобы растопить весь лед. Считать, что теплообмена с окружающей средой нет. Теплоемкость воды cв = 4200 Дж/(кг · ◦ C), плотность воды ρв = 1000 кг/м3, плотность льда ρл = 900 кг/м3, удельная теплота плавления льда λ = 3,4 · 105 Дж/кг.","problemImage":"olympiad-assets/309.jpg"},{"id":"1.28.20","chapter":1,"chapterName":"Механика","topic":"1.28","topicName":"Статика","difficulty":"hard","score":3.84,"searchText":"(«Физтех», 2023, 9 ) Однородный шар массой m = 3 кг удерживается на шероховатой наклонной плоскости горизонтальной нитью, прикрепленной к шару в его наивысшей точке. Наклонная плоскость образует с горизонтальной плоскостью угол α такой, что sin α = 0,6. 1. Найдите силу T натяжения нити. 2. Найдите силу Fтр трения, действующую на шар. 3. При каких значениях коэффициента µ трения скольжения шар будет находиться в покое? Ускорение свободного падения g = 10 м/с2. 1) T = mg · tg α","problemImage":"olympiad-assets/310.jpg"},{"id":"1.29.36","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"hard","score":3.84,"searchText":"(Всесиб., 2021, 9 ) В цилиндрическую пробирку вставлен поршень со сквозным цилиндрическим отверстием вдоль оси, который может скользить без трения. Высота поршня H. После того, как в пробирку налили воды, он всплыл, так что его верхняя кромка относительно дна пробирки оказалась на высоте H1 > H. После того, как с помощью тонкого стержня поршень утопили, вода в пробирке поднялась до высоты H2 > H. Определите отношение радиуса отверстия в поршне к его внешнему радиусу. Плотность воды ρ0, плотность поршня ρ1. Объемом воды, вытесняемым стержнем, пренебречь.","problemImage":"olympiad-assets/311.jpg"},{"id":"1.31.4","chapter":1,"chapterName":"Механика","topic":"1.31","topicName":"Движение жидкости","difficulty":"hard","score":3.85,"searchText":"(«Формула Единства» / «Третье тысячелетие», 2020, 9 ) Экспериментатор Глюк поехал на дачу, забыв дома оборудование для экспериментов. К счастью, на даче нашлись два сосуда и две трубки. Пошёл дождь, и экспериментатор смог поставить следующий опыт: одной трубкой соединил сосуды у дна, а вторую (такую же) трубку присоединил ко второму сосуду (см. рис.). Вынеся сосуды под дождь, он дождался, пока уровень воды станет стабильным, и снял показания. В левом сосуде уровень воды был 1,5 м, в правом — 0,9 м. Вскоре дождь усилился в два раза. Глюк закрыл правый сосуд крышкой, снова дождался, пока уровень установится, но, не успев ничего померить, уронил сосуды. Чтобы пожаловаться на свою досаду, Глюк позвонил теоретику Багу. Может ли Баг успокоить Глюка и вычислить уровни воды в сосудах после усиления дождя? Багу известно, что скорость жидкости в трубке пропорциональна разности давлений на её концах.","problemImage":"olympiad-assets/312.jpg"},{"id":"2.4.4","chapter":2,"chapterName":"Тепловые явления","topic":"2.4","topicName":"Теплопроводность","difficulty":"hard","score":3.87,"searchText":"(«Шаг в будущее», 2023, 9 ) В далеком (или не очень) будущем земляне вступили в эпоху межзвездных путешествий, и в системе одного из желтых карликов Галактики (звезда, того же класса, что и Солнце) открыли планету Архе с биосферой, во многом напоминающей Землю эпохи мезозоя (примерно 70–250 млн лет назад от нашего времени). Среди обитателей Архе внимание ученых привлек вид шарозавров — травоядных гигантов, напоминающих древних земных рептилий, но обладающих уникальным и очень полезным эволюционным приспособлением: в ночное время суток, когда температура окружающей среды снижается до 20 ◦ C, животное сворачивается «шариком» (отсюда и название). Принимая шарообразную форму, «рептилия» минимизирует площадь поверхности тела и, следовательно, отток тепла из организма. В результате, ночью, длящейся 10 земных часов, температура тела шарозавра снижается лишь на 1 ◦ C по сравнению с его дневной температурой, составляющей 36 ◦ C. При этом шарозавр практически не сжигает калории, полученные днем с пищей. Теплообмен с окружающей средой происходит через кожу животного, его интенсивность пропорциональна перепаду температур между телом шарозавра и окружающей средой, и составляет 50 Вт на 1 м2 кожи при перепаде в 1 ◦ C. Каков примерно радиус «шарика»? Удельная теплоемкость тела шарозавра 4 кДж/(кг · ◦ C). Плотность тела шарозавра близка к плотности воды. Объем шара: V = πR3. Площадь сферы: S = 4πR2. Электричество","problemImage":"olympiad-assets/313.jpg"},{"id":"1.29.33","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"hard","score":3.89,"searchText":"(Всесиб., 2022, 9 ) Жарким летним днем ребята катались по озеру на плотике из легкого пластика. Когда на плотике было трое ребят, то плотик погружался в воду наполовину, когда на нем стало двенадцать — он оказался почти полностью под водой. Во сколько раз пластик плотика легче воды? Считать, что все ребята одинакового веса.","problemImage":"olympiad-assets/314.jpg"},{"id":"1.29.38","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"hard","score":3.89,"searchText":"(Всесиб., 2023, 9 ) Горизонтальный сосуд с несжимаемой жидкостью с двух сторон закрыт подвижными поршнями: слева — площадью S1, справа — S2, причем S1 < S2. Поршни соединены нитью, выдерживающей максимальное натяжение T. Какую силу и в каком направлении надо приложить к правому поршню, чтобы нить порвалась? Влиянием сил трения и тяжести пренебречь.","problemImage":"olympiad-assets/315.jpg"},{"id":"2.2.13","chapter":2,"chapterName":"Тепловые явления","topic":"2.2","topicName":"Теплообмен","difficulty":"hard","score":3.89,"searchText":"(«Физтех», 2023, 9 ) Брусок массой M = 0,1 кг изготовлен из материала, удельная теплоемкость c которого зависит от температуры t по закону, представленному на графике к задаче. 1. Какое количество Q теплоты следует подвести к бруску, чтобы увеличить температуру бруска от t0 = 0 ◦ C до t1 = 10 ◦ C? Этот брусок помещают в калориметр, содержащий глицерин при температуре t2 = 78 ◦ C. Температура бруска t1 = 10 ◦ C, масса глицерина m = 0,3 кг. В калориметре устанавливается тепловое равновесие. 2. Найдите температуру t3 в калориметре в равновесном состоянии. В рассматриваемом диапазоне температур удельная теплоемкость глицерина cг = 2,5 · 103 Дж/(кг · ◦ C). Потери теплоты и теплоемкость калориметра считайте пренебрежимо малыми.","problemImage":"olympiad-assets/316.jpg"},{"id":"3.1.17","chapter":3,"chapterName":"Электричество","topic":"3.1","topicName":"Электрические цепи","difficulty":"hard","score":3.89,"searchText":"(Олимпиада КФУ, 2023, 9 ) Три одинаковых резистора соединены как показано на рисунке (см. рис. а) и запаяны в диэлектрический куб с высокой теплопроводностью. Получившийся трехполюсник подключают с помощью соединительных проводов, сопротивление которых пренебрежимо мало по сравнению с сопротивлением резистора, во всех случаях к одинаковому идеальному источнику напряжения. При подключении к клеммам A и B через источник протекает ток I1 = 1,00 A. При подключении к клеммам A и O — ток I2 = 1,80 A. Какой ток будет протекать через источник, если подключить его к клемме A и BC (см. рис. б)? Сопротивление резисторов зависит от температуры по линейному закону. Считать, что из-за высокой интенсивности теплообмена внутри диэлектрического куба по сравнению с теплообменом куба с окружающей средой, температуры резисторов практически равны при любом варианте подключения. Температура и прочие параметры окружающей среды во всех случаях одинаковы. Радиационным теплообменом пренебречь. Все токи в задаче подразумеваются установившимися (через продолжительное время после подключения).","problemImage":"olympiad-assets/317.jpg"},{"id":"3.1.24","chapter":3,"chapterName":"Электричество","topic":"3.1","topicName":"Электрические цепи","difficulty":"hard","score":3.89,"searchText":"(«Курчатов», 2023, 9 ) Проводящее кольцо радиуса r изготовлено из двух полуколец, соединённых в точках A и B. Удельное сопротивление провода верхнего полукольца составляет ρa, а нижнего — ρb. Площади поперечных сечений полуколец одинаковы. Кольцо подключают к внешнему напряжению в точках A и B, после чего измеряют общий ток (суммарный ток в двух полукольцах) I1. Затем кольцо отключают от внешнего напряжения, поворачивают на 90◦ по часовой стрелке, снова подключают к внешнему напряжению и измеряют общий ток I2. Во втором измерении оказалось, что соотношение токов равно I2 = 0,64I1. Найдите отношение удельных сопротивлений ρa при условии, что ρa < ρb. Примечание. Сопротивление R провода длины l с площадью поперечного сечения S и удельным сопротивлением ρ рассчитывается по формуле R = ρl/S.","problemImage":"olympiad-assets/318.jpg"},{"id":"1.35.5","chapter":1,"chapterName":"Механика","topic":"1.35","topicName":"Механические колебания и волны","difficulty":"hard","score":3.91,"searchText":"(Инженерная олимпиада, 2021, 9 ) В передней части кумулятивного противотанкового снаряда во взрывчатом веществе сделана коническая выемка (см. рисунок). Детонация снаряда начинается из вершины выемки (точки O) в тот момент, когда снаряд коснется брони танка. После этого по взрывчатому веществу со скоростью 5v распространяется волна детонации (вовлечение в процесс взрыва новых участков взрывчатого вещества), а продукты взрыва разлетаются по всем направлениям со скоростью v. Максимальное поражение брони будет достигаться тогда, когда продукты взрыва от всех участков выемки достигнут брони танка одновременно. Каким для этого должен быть угол α при вершине выемки?","problemImage":"olympiad-assets/319.jpg"},{"id":"1.29.19","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"hard","score":3.92,"searchText":"(«Надежда энергетики», 2021, 9 ) Для прокладки силовых электрических кабелей и кабельных линий на дне водоёма делается специальная траншея. В местах выхода кабельной линии на берег кабель прокладывается в трубе. Для этого цилиндрическую секцию массой M, радиусом R и длиной L, герметично закрытую заглушками с двух сторон, опускают в водоем. Горизонтально опустившись на мягкий илистый грунт, труба погрузилась в него наполовину (ось симметрии цилиндра находится на уровне дна). Трубу при помощи троса поднимает плавучий кран. Определите, с какой минимальной силой должен быть натянут трос, чтобы труба начала подниматься. Глубина водоема равна H, плотность воды ρ, атмосферное давление p0. Вязкостью грунта и трением трубы о грунт пренебречь.","problemImage":"olympiad-assets/320.jpg"},{"id":"1.29.23","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"hard","score":3.93,"searchText":"(«Будущие исследователи — будущее науки», 2016, 9 ) Гирлянда состоит из связанных нитями N шаров одинакового размера. Массы всех шаров, кроме более тяжелого крайнего, одинаковы. Когда гирлянду поместили в сосуд с водой, она приняла вертикальное положение с лежащим на дне тяжелым шаром и полностью погруженными всеми шарами (см. рис.). Силы, действующие на тяжелый шар со стороны нити и дна, равны. Вода выталкивает каждый из шаров с силой, вдвое большей веса легкого шара. Найти отношение масс тяжелого и легкого шаров.","problemImage":"olympiad-assets/321.jpg"},{"id":"1.29.40","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"hard","score":3.94,"searchText":"(«Физтех», 2022, 9 ) На горизонтальной поверхности расположены два цилиндрических сообщающихся сосуда (см. рис.), в которые налита жидкость плотности ρ. На свободных поверхностях жидкости находятся лёгкие поршни. Зазоров между стенками сосудов и поршнями нет. Левый поршень соединён пружиной жёсткости к с верхней опорой. Разность уровней жидкости в сосудах равна h. Площадь сечения левого поршня S, правого 1,5S. Трение поршней о стенки сосудов пренебрежимо мало. Ускорение свободного падения g. 1. Найдите деформацию x пружины. 2. На правый поршень положили груз массой m. Найдите массу M груза, который следует положить на левый поршень, чтобы пружина стала недеформированной. Поршни при этом не достигают дна.","problemImage":"olympiad-assets/322.jpg"},{"id":"1.31.6","chapter":1,"chapterName":"Механика","topic":"1.31","topicName":"Движение жидкости","difficulty":"hard","score":3.94,"searchText":"(«Надежда энергетики», 2022, 9 ) Потребление энергии из электрической сети всегда выше в так называемые пиковые часы — утром и вечером, а в остальное время значительно снижается. Поэтому мощность электрогенераторов необходимо изменять. На ГЭС применяют специальные поворотные лопатки (см. рис.), которые направляют водяной поток на колесо гидротурбины. Определите, во сколько раз изменится мощность гидрогенератора, если площадь сечения отверстий между поворотными лопатками уменьшится на 20%. Можно считать, что поток в обоих случаях полностью попадает на лопатки колеса гидротурбины и мощность генератора не зависит от угла падения потока воды на гидротурбину. КПД гидрогенератора и уровень воды в водохранилище считать постоянным.","problemImage":"olympiad-assets/323.jpg"},{"id":"3.4.5","chapter":3,"chapterName":"Электричество","topic":"3.4","topicName":"Мощность тока","difficulty":"hard","score":3.95,"searchText":"(Всеросс., 2021, МЭ, 9 ) Школьник собрал электрическую цепь, состоящую из трёх резисторов, трёх амперметров, одного вольтметра и проводов (см. рисунок). Сопротивление R = 1 кОм, все измерительные приборы идеальные. Выводы схемы он подключил к источнику постоянного напряжения. В результате вольтметр показал 11 В. 1. Определите напряжение на резисторе 1. Ответ дайте в вольтах, округлив до целого числа. 2. Определите напряжение на резисторе 2. Ответ дайте в вольтах, округлив до целого числа. 3. Определите напряжение на резисторе 3. Ответ дайте в вольтах, округлив до целого числа. 4. Определите показания амперметра A1. Ответ дайте в мА, округлив до целого числа. 5. Определите показания амперметра A2. Ответ дайте в мА, округлив до целого числа. 6. Определите показания амперметра A3. Ответ дайте в мА, округлив до целого числа. 7. Определите полную тепловую мощность, выделяющуюся во всех трёх резисторах. Ответ дайте в мВт, округлив до целого числа.","problemImage":"olympiad-assets/324.jpg"},{"id":"1.8.3","chapter":1,"chapterName":"Механика","topic":"1.8","topicName":"Графики движения","difficulty":"hard","score":3.96,"searchText":"(Всеросс., 2022, ШЭ, 9 ) Два точечных тела A и B находятся на расстоянии 10 м друг от друга. Затем они одновременно начинают двигаться навстречу друг другу вдоль соединяющей их прямой. Зависимости путей, пройденных этими телами, от времени приведены на рисунке (синий график соответствует телу A, красный — телу B). 1. Каким было расстояние между телами через одну секунду после старта? Ответ дайте в метрах, округлив до целого числа. 2. В какой момент времени эти тела встретились? Ответ дайте в секундах, округлив до целого числа. 3. Каким было расстояние между телами за одну секунду до их встречи? Ответ дайте в метрах, округлив до целого числа. 4. На каком расстоянии от начального положения тела A произошла встреча? Ответ дайте в метрах, округлив до целого числа.","problemImage":"olympiad-assets/325.jpg"},{"id":"3.4.12","chapter":3,"chapterName":"Электричество","topic":"3.4","topicName":"Мощность тока","difficulty":"hard","score":3.96,"searchText":"(«Надежда энергетики», 2020, 9 ) При передаче электроэнергии во высоковольтной линии (ЛЭП) от гидроэлектростанции к потребителю существует понятие натуральной мощности — такой полезной мощности, при которой потери энергии в линии минимальны и сводятся только к потерям на нагревание проводов. Так, натуральная мощность для ЛЭП, работающей под напряжением U1 = 500 кВ равна P1 = 900 МВт, а для ЛЭП с напряжением U2 = 750 кВ равна P2 = 2100 МВт. Как правило, в линиях на 500 кВ энергию передают по трем параллельно соединенным проводам одинакового сечения, а в линиях на 750 кВ — по пяти проводам такого же сечения. Определите, во сколько раз уменьшатся потери энергии при переходе с ЛЭП 500 кВ на ЛЭП 750 кВ, если и в том и в другом случае по линии передается натуральная мощность на одно и то же расстояние.","problemImage":"olympiad-assets/326.jpg"},{"id":"1.29.12","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"hard","score":3.98,"searchText":"(Всеросс., 2021, МЭ, 9 ) Для того чтобы удерживать тело неподвижно висящим в воздухе, к нему необходимо приложить силу F1 = 40 Н. Для того чтобы удерживать это же тело полностью погружённым в воду, необходима сила F2 = 60 Н (тело не касается дна и стенок сосуда с водой). 1. На сколько процентов по объёму выступает над водой это же тело, плавающее свободно? Ответ дайте в процентах, округлив до целого числа. 2. Во сколько раз плотность воды больше плотности тела? Ответ округлите до десятых долей.","problemImage"
