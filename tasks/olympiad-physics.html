роткий ультразвуковой сигнал, эхо которого слышит через 120 мс. На каком расстоянии от стены находится летучая мышь? Скорость распространения ультразвука в воздухе 333 м/с. Ответ выразите в м, округлите до десятых долей.","problemImage":"olympiad-assets/107.jpg"},{"id":"3.2.2","chapter":3,"chapterName":"Электричество","topic":"3.2","topicName":"Вычисление сопротивлений","difficulty":"medium","score":2.82,"searchText":"(Всеросс., 2023, ШЭ, 9 ) Три резистора соединили в электрическую цепь, схема которой показана на рисунке, и подключили к идеальному источнику постоянного напряжения. Определите общее сопротивление этой цепи. 1. 3,6 Ом; 2. 12 Ом; 3. 15 Ом; 4. 40 Ом; 5. 54 Ом.","problemImage":"olympiad-assets/108.jpg"},{"id":"3.2.8","chapter":3,"chapterName":"Электричество","topic":"3.2","topicName":"Вычисление сопротивлений","difficulty":"medium","score":2.82,"searchText":"(«Формула Единства» / «Третье тысячелетие», 2019, 9 ) Сопротивление каждого резистора в приведённой на рисунке цепи равно 1 Ом. Найдите общее сопротивление цепи.","problemImage":"olympiad-assets/109.jpg"},{"id":"4.2.13","chapter":4,"chapterName":"Оптика","topic":"4.2","topicName":"Отражение света. Плоское зеркало","difficulty":"medium","score":2.82,"searchText":"(«Надежда энергетики», 2021, 9 ) Каждый год студенты НИУ «МЭИ», участники туристическо-поискового клуба «Горизонт», отправляются в походы по разным местам нашей страны. Свои фоторепортажи они показывают на выставках в фойе главного учебного корпуса. На этом снимке изображен лес, сфотографированный с берега озера. Как определить, где расположено отражение леса в воде: на верхней или на нижней части фотоснимка? Объясните свой ответ при помощи графических построений световых лучей. Яркость, четкость и контрастность верхней и нижней половины фотографии одинаковы.","problemImage":"olympiad-assets/110.jpg"},{"id":"1.9.9","chapter":1,"chapterName":"Механика","topic":"1.9","topicName":"Баллистика. Координаты","difficulty":"medium","score":2.83,"searchText":"(«Будущие исследователи — будущее науки», 2022, 9 ) Тело бросили под углом к горизонту в момент t = 0 так, что вектор скорости составил с горизонтом угол 45◦ в моменты времени t1 и t2. Найти дальность полета тела. Ускорение свободного падения равно g.","problemImage":"olympiad-assets/111.jpg"},{"id":"1.32.1","chapter":1,"chapterName":"Механика","topic":"1.32","topicName":"Подобие и размерность","difficulty":"medium","score":2.83,"searchText":"(Всеросс., 2022, МЭ, 9 ) Пусть некоторая физическая величина выражается формулой kxF, где k — коэффициент жёсткости, x — расстояние, F — сила. Эта физическая величина имеет размерность 1. времени; 2. скорости; 3. работы; 4. силы; 5. длины.","problemImage":"olympiad-assets/112.jpg"},{"id":"2.2.4","chapter":2,"chapterName":"Тепловые явления","topic":"2.2","topicName":"Теплообмен","difficulty":"medium","score":2.83,"searchText":"(Всеросс., 2022, МЭ, 9 ) В теплоизолированном сосуде сначала смешивают три порции воды массами 100 г, 200 г и 300 г с начальными температурами 3 ◦ C, 80 ◦ C и 60 ◦ C соответственно. После установления теплового равновесия в сосуд добавляют две новые порции воды — массой 500 г при температуре 30 ◦ C и массой 400 г при температуре 80 ◦ C. Определите конечную температуру в сосуде. Вода из сосуда не выливается, теплоёмкостью сосуда и потерями теплоты можно пренебречь. Ответ выразите в градусах Цельсия, округлите до целого числа.","problemImage":"olympiad-assets/113.jpg"},{"id":"3.1.14","chapter":3,"chapterName":"Электричество","topic":"3.1","topicName":"Электрические цепи","difficulty":"medium","score":2.83,"searchText":"(«Будущие исследователи — будущее науки», 2020, 9 ) В схеме, приведенной на рисунке, два резистора имеют сопротивления по 30 Ом и два — по 60 Ом; сопротивления амперметров пренебрежимо малы. После подключения к точкам A и B источника постоянного напряжения токи через амперметры оказались различными, меньший равен 1 А. Найти напряжение источника.","problemImage":"olympiad-assets/114.jpg"},{"id":"2.1.10","chapter":2,"chapterName":"Тепловые явления","topic":"2.1","topicName":"Количество теплоты","difficulty":"medium","score":2.84,"searchText":"(Инженерная олимпиада, 2023, 9 ) Тепловая станция нагревает воду для обеспечения небольшого микрорайона горячей водой. Для этого на станцию с помощью насосов подается вода, которая нагревается мощными нагревателями. Для обеспечения теплом самой станции часть потока нагретой воды проходит через помещения станции, охлаждается до первоначальной температуры и возвращается в поток воды, поступающий на станцию (см. рисунок). Известно, что если для обеспечения теплом самой станции используется десятая часть потока воды, то выходящая со станции вода нагревается на величину ∆T. На какую величину ∆T1 нагреется вода, выходящая со станции, если для обеспечения ее теплом будет использоваться восьмая часть потока воды, нагреваемой нагревателем? Ответ обосновать.","problemImage":"olympiad-assets/115.jpg"},{"id":"1.11.4","chapter":1,"chapterName":"Механика","topic":"1.11","topicName":"Движение по окружности","difficulty":"medium","score":2.85,"searchText":"(«Формула Единства» / «Третье тысячелетие», 2022, 9 ) В результате измерений промежутка времени между двумя последовательными затмениями Европы, спутника Юпитера, определено, что в течение года он изменяется от 84 часов 56 минут 42 секунд до 84 часов 57 минут 42 секунд. Оцените по этим данным скорость света.","problemImage":"olympiad-assets/116.jpg"},{"id":"1.29.8","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"medium","score":2.85,"searchText":"(Всеросс., 2020, МЭ, 9 ) На одной чаше рычажных весов находятся стакан с водой и деревянный шар, уравновешенные стальной гирей, которая стоит на другой чаше. Как изменится равновесие весов, если шар перенести в стакан с водой? А) перевесит чаша со стаканом Б) перевесит чаша с гирей В) равновесие не нарушится","problemImage":"olympiad-assets/117.jpg"},{"id":"2.2.6","chapter":2,"chapterName":"Тепловые явления","topic":"2.2","topicName":"Теплообмен","difficulty":"medium","score":2.85,"searchText":"(Инженерная олимпиада, 2021, 9 ) Имеется три стакана с водой массой m, 3m и 7m с разными температурами. Когда ложку воды из первого стакана перелили во второй, температура воды в нем увеличилась на величину ∆t. Затем такую же ложку воды из второго стакана перелили в третий, и температура воды в нем уменьшилась на величину ∆t/3. После этого такую же ложку воды из третьего стакана перелили в первый. На сколько изменится температура воды в первом стакане? Потерь тепла в окружающее пространство не происходит. Теплоемкостью стаканов пренебречь.","problemImage":"olympiad-assets/118.jpg"},{"id":"1.31.3","chapter":1,"chapterName":"Механика","topic":"1.31","topicName":"Движение жидкости","difficulty":"medium","score":2.86,"searchText":"(Олимпиада КФУ, 2022, 9 ) Открытый цилиндрический сосуд высотой H = 1 м и сечением S = 0,4 м2 имеет небольшое отверстие около дна. Если сосуд наполнен до краев, то из отверстия за 2 минуты выливается 4 литра воды. Над сосудом открывают кран, из которого выливается µ1 = 25 мл воды в секунду. На каком уровне установится уровень воды в сосуде при открытом кране и отверстии?","problemImage":"olympiad-assets/119.jpg"},{"id":"2.2.3","chapter":2,"chapterName":"Тепловые явления","topic":"2.2","topicName":"Теплообмен","difficulty":"medium","score":2.86,"searchText":"(Всеросс., 2021, МЭ, 9 ) В одном калориметре смешали 800 г воды при температуре 20 ◦ C и 200 г воды при температуре 80 ◦ C. Потерями теплоты и теплоёмкостью калориметра можно пренебречь. 1. Определите установившуюся температуру смеси. Ответ дайте в градусах Цельсия, округлив до целого числа. 2. Определите установившуюся температуру смеси, если перед смешиванием поменять местами процентные соотношения холодной и горячей воды. Ответ дайте в градусах Цельсия, округлив до целого числа.","problemImage":"olympiad-assets/120.jpg"},{"id":"2.2.11","chapter":2,"chapterName":"Тепловые явления","topic":"2.2","topicName":"Теплообмен","difficulty":"medium","score":2.86,"searchText":"(«Формула Единства» / «Третье тысячелетие», 2021, 9 ) Из сосуда падают одинаковые капли жидкости, нагретой до температуры 50 ◦ C. Эти капли попадают на цилиндрическую трубу, у которой начальная температура 0 ◦ C, а масса и удельная теплоёмкость равна массе и удельной теплоёмкости жидкости в сосуде. Чему равна конечная температура трубы, когда вся жидкость вытечет из сосуда, если известно, что вытекло N = 100 капель? Примечание. Капли падают настолько редко, что на трубе может находиться одновременно только одна капля; теплообмен происходит очень быстро; тепловыми потерями пренебрегите.","problemImage":"olympiad-assets/121.jpg"},{"id":"3.4.10","chapter":3,"chapterName":"Электричество","topic":"3.4","topicName":"Мощность тока","difficulty":"medium","score":2.86,"searchText":"(«Надежда энергетики», 2021, 9 ) Однородный металлический стержень постоянного поперечного сечения подключен за торцы к источнику напряжения. Определите, во сколько раз необходимо изменить длину проводника, чтобы скорость его нагрева при протекании постоянного тока возросла в 4 раза? Все выделяющееся в проводнике количество теплоты полностью расходуется на увеличение его температуры. Торцы проводника перпендикулярны его боковой поверхности.","problemImage":"olympiad-assets/122.jpg"},{"id":"1.3.5","chapter":1,"chapterName":"Механика","topic":"1.3","topicName":"Равноускоренное движение","difficulty":"medium","score":2.87,"searchText":"(«Формула Единства» / «Третье тысячелетие», 2019, 9 ) Три гоночные машины начинают движение по параллельным дорогам с одинаковым ускорением и перестают ускоряться по достижении одинаковой скорости. При этом вторая машина трогается, когда первая пройдёт некоторое расстояние l от старта, а третья — когда первая пройдёт расстояние 2l от старта. Во сколько раз дистанция между третьей и второй машиной будет отличаться от дистанции между первой и второй машиной, когда все они достигнут своих максимальных скоростей?","problemImage":"olympiad-assets/123.jpg"},{"id":"3.1.5","chapter":3,"chapterName":"Электричество","topic":"3.1","topicName":"Электрические цепи","difficulty":"medium","score":2.87,"searchText":"(Всеросс., 2020, МЭ, 9 ) Электрическая цепь, схема которой изображена на рисунке, состоит из резистора с сопротивлением R, трёх одинаковых вольтметров с сопротивлениями 10R каждый и идеальной батарейки с напряжением 3,6 В. 1. Найдите напряжение U1. Ответ выразите в вольтах, округлите до десятых долей. 2. Найдите напряжение U2. Ответ выразите в вольтах, округлите до десятых долей. 3. Найдите напряжение U3. Ответ выразите в вольтах, округлите до десятых долей.","problemImage":"olympiad-assets/124.jpg"},{"id":"1.34.1","chapter":1,"chapterName":"Механика","topic":"1.34","topicName":"Процессы и измерения","difficulty":"medium","score":2.88,"searchText":"(Инженерная олимпиада, 2022, 9 ) На некотором расстоянии от мальчика находится линия электропередач. Мальчик заметил, что если встать лицом к линии и смотреть линии на поднятый вверх большой палец вытянутой руки правым глазом, то палец закрывает один столб, а если левым глазом, то соседний. Найти расстояние от мальчика до линии электропередач, если расстояние между глазами — d = 63 мм, длина вытянутой руки — l = 50 см, расстояние между столбами линии D = 100 м.","problemImage":"olympiad-assets/125.jpg"},{"id":"3.4.11","chapter":3,"chapterName":"Электричество","topic":"3.4","topicName":"Мощность тока","difficulty":"medium","score":2.89,"searchText":"(«Надежда энергетики», 2019, 9 ) Известно, что энергопотребление в городах в утренние и вечерние часы возрастает в несколько раз по сравнению с дневными и ночными часами. Представим, что город получает электроэнергию от гидроэлектростанции, генератор которой полностью справляется с энергообеспечением города при пиковой нагрузке. Когда энергопотребление в городе на протяжении суток возросло в 3 раза, оператор на ГЭС увеличил расход воды через гидротурбину в 2 раза. Определите, как при этом изменился КПД гидрогенератора. Считать, что уровень воды в водохранилище остается неизменным.","problemImage":"olympiad-assets/126.jpg"},{"id":"1.5.5","chapter":1,"chapterName":"Механика","topic":"1.5","topicName":"Относительность движения","difficulty":"medium","score":2.9,"searchText":"(«Надежда энергетики», 2016, 9 ) Во время летних каникул девятиклассники Петя и Катя пришли на речку и решили переплыть на другой берег к дереву, которое росло прямо напротив того места, где они стояли. Петя, борясь с течением, поплыл прямо на дерево, и доплыл до него за время tП = 50 с. Катя же гребла перпендикулярно течению, и доплыла до противоположного берега всего за tК = 30 с, но её снесло вниз по течению. Известно, что Петя и Катя плыли (относительно воды) с одной и той же скоростью. На какое расстояние от дерева снесло Катю, если ширина реки h = 30 м?","problemImage":"olympiad-assets/127.jpg"},{"id":"1.16.5","chapter":1,"chapterName":"Механика","topic":"1.16","topicName":"Сила упругости","difficulty":"medium","score":2.9,"searchText":"(Всеросс., 2021, МЭ, 9 ) Если к пружине подвесить некоторый груз, её длина в равновесном состоянии увеличивается на 15 см. Пружину разрезали на две части, длины которых относятся в пропорции 1: 2. 1. На сколько растянется меньшая часть пружины, если к ней подвесить тот же самый груз? Ответ дайте в сантиметрах, округлив до целого числа. 2. На сколько растянется более длинная часть пружины, если к ней подвесить груз вдвое большей массы? Ответ дайте в сантиметрах, округлив до целого числа.","problemImage":"olympiad-assets/128.jpg"},{"id":"1.17.4","chapter":1,"chapterName":"Механика","topic":"1.17","topicName":"Сила трения","difficulty":"medium","score":2.9,"searchText":"(«Шаг в будущее», 2023, 9 ) Брусок массой m = 1 кг покоится на шероховатой горизонтальной поверхности. Коэффициент трения µ = 3/4. Какое минимальное усилие необходимо прилагать, чтобы двигать брусок прямолинейно вдоль поверхности с ускорением a = µg, где g = 10 м/с2 — ускорение свободного падения?","problemImage":"olympiad-assets/129.jpg"},{"id":"3.4.9","chapter":3,"chapterName":"Электричество","topic":"3.4","topicName":"Мощность тока","difficulty":"medium","score":2.9,"searchText":"(Инженерная олимпиада, 2023, 9 ) Нагревательный элемент нагревателя для детского питания представляет собой провод в тонкой изоляции, свернутый в плотную плоскую спираль радиуса R и большим числом витков N. Найти мощность, выделяемую в нагревателе при приложенном напряжении U. Удельное сопротивление материала проволоки ρ, площадь сечения проволоки S.","problemImage":"olympiad-assets/130.jpg"},{"id":"1.29.16","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"medium","score":2.92,"searchText":"(«Надежда энергетики», 2020, 9 ) Чашка массой m = 400 г вмещает V = 600 мл воды. В начале опыта пустая чашка плавает на поверхности воды. В чашку тонкой струйкой наливают воду. Чашка тонет, когда её заполняют на 2/3 объема. Определите плотность материала, из которого изготовлена чашка. Плотность воды равна 1000 кг/м3. В ответе приведите формулу для определения плотности материала чашки в общем виде.","problemImage":"olympiad-assets/131.jpg"},{"id":"1.7.4","chapter":1,"chapterName":"Механика","topic":"1.7","topicName":"Неравномерное движение","difficulty":"medium","score":2.93,"searchText":"(«Шаг в будущее», 2022, 9 ) Илья Муромец верхом на Бурке по ровной прямой дороге отправился из Алёшино в Добрынино. Расстояние между деревнями 50 км. Скорость движения Ильи 10 км/ч. Как только они тронулись в путь, Бурка стряхнул с себя муху-цокотуху. Муха полетела прямо в Добрынино и, долетев туда, сразу полетела обратно к Бурке, тот снова стряхнул цокотуху, она опять полетела прямо в Добрынино и т. д. пока Илья не прибыл в пункт назначения. Определить полный путь цокотухи, если во время путешествия Илье постоянно дул попутный ветер со скоростью 5 км/ч, а собственная скорость мухи 15 км/ч.","problemImage":"olympiad-assets/132.jpg"},{"id":"1.20.4","chapter":1,"chapterName":"Механика","topic":"1.20","topicName":"Движение со связями","difficulty":"medium","score":2.93,"searchText":"(«Росатом», 2022, 9 ) На горизонтальной поверхности находится гладкий клин с углом при основании α = 30◦, на нем тело. Клин двигают вправо с некоторым ускорением. Найти это ускорение, если время соскальзывания тела вдвое меньше времени соскальзывания с закрепленного клина. Ответ обосновать.","problemImage":"olympiad-assets/133.jpg"},{"id":"1.3.1","chapter":1,"chapterName":"Механика","topic":"1.3","topicName":"Равноускоренное движение","difficulty":"medium","score":2.94,"searchText":"(Всеросс., 2020, МЭ, 9 ) Автомобиль, едущий по шоссе с постоянной скоростью 54 км/ч, проезжает мимо второго автомобиля, стоящего на соседней полосе. В этот момент второй автомобиль трогается с места и начинает догонять первый, двигаясь с постоянным ускорением 5 м/с2. Автомобили можно считать материальными точками. 1. За какое время второй автомобиль догонит первый? Ответ выразите в секундах и округлите до целого числа. 2. Какую скорость будет иметь второй автомобиль в тот момент, когда он догонит первый автомобиль? Ответ выразите в км/ч и округлите до целого числа.","problemImage":"olympiad-assets/134.jpg"},{"id":"2.2.10","chapter":2,"chapterName":"Тепловые явления","topic":"2.2","topicName":"Теплообмен","difficulty":"medium","score":2.94,"searchText":"(Всесиб., 2023, 9 ) Чтобы нагреть хранившийся в холодильнике кефир массой m и температурой T1, школьник налил из-под крана полную кастрюлю тёплой воды массой M и температурой T2. Затем он аккуратно опустил в кастрюлю тетрапак с кефиром и оставил его плавать. При этом тетрапак не касался ни дна, ни стенок. После установления теплового равновесия температура кефира оказалась равна T. Определите удельную теплоёмкость кефира, если теплоёмкость воды известна и равна c. Теплообменом с окружающей средой, теплоёмкостью кастрюли и массой тетрапака пренебречь.","problemImage":"olympiad-assets/135.jpg"},{"id":"3.2.9","chapter":3,"chapterName":"Электричество","topic":"3.2","topicName":"Вычисление сопротивлений","difficulty":"medium","score":2.94,"searchText":"(Всесиб., 2015, 9 ) Квадрат сделан из проволоки с большим удельным сопротивлением. Его сопротивление между противоположными углами R. Каким оно станет, если середины противоположных сторон соединить проводом с пренебрежимо малым сопротивлением?","problemImage":"olympiad-assets/136.jpg"},{"id":"4.2.3","chapter":4,"chapterName":"Оптика","topic":"4.2","topicName":"Отражение света. Плоское зеркало","difficulty":"medium","score":2.94,"searchText":"(Всеросс., 2022, ШЭ, 9 ) Зеркало движется к точечному источнику света S со скоростью 1 м/с относительно лабораторной системы отсчёта (см. рисунок). Расстояние между источником и его изображением в зеркале уменьшается со скоростью 2 м/с. С какой скоростью и в каком направлении движется источник S относительно лабораторной системы отсчёта? 1. Источник покоится; 2. со скоростью 1 м/с от зеркала; 3. со скоростью 1 м/с к зеркалу; 4. со скоростью 0,5 м/с от зеркала; 5. со скоростью 2 м/с к зеркалу.","problemImage":"olympiad-assets/137.jpg"},{"id":"3.2.4","chapter":3,"chapterName":"Электричество","topic":"3.2","topicName":"Вычисление сопротивлений","difficulty":"medium","score":2.95,"searchText":"(Всеросс., 2020, МЭ, 9 ) Найдите общее сопротивление участка AB электрической цепи, схема которого изображена на рисунке. Сопротивление каждого резистора равно 1 кОм. Ответ выразите в Ом и округлите до целого числа.","problemImage":"olympiad-assets/138.jpg"},{"id":"1.13.3","chapter":1,"chapterName":"Механика","topic":"1.13","topicName":"Масса, плотность, давление","difficulty":"medium","score":2.96,"searchText":"(Всеросс., 2022, МЭ, 9 ) На край симметричной пустой тумбочки, стоящей на двух опорах, положили небольшой однородный брусок массой 1 кг, как показано на рисунке. Сила давления правой опоры тумбочки на пол в 1,2 раза больше силы давления левой опоры на пол. 1. Найдите массу тумбочки. Ответ выразите в кг, округлите до целого числа. 2. Какое среднее давление оказывает тумбочка на пол, если площадь сечения каждой опоры равна 40 см2? Ускорение свободного падения равно 10 м/с2. Ответ выразите в Па, округлите до целого числа. 3. Брусок какой массы нужно дополнительно положить на левый край тумбочки, чтобы сила давления правой опоры тумбочки на пол стала в 1,2 раза меньше силы давления левой опоры на пол? Ответ выразите в кг, округлите до десятых долей.","problemImage":"olympiad-assets/139.jpg"},{"id":"1.25.1","chapter":1,"chapterName":"Механика","topic":"1.25","topicName":"Упругие взаимодействия","difficulty":"medium","score":2.96,"searchText":"(Олимпиада КФУ, 2020, 9 ) Тело имеет массу m и движется поступательно со скоростью v0 и испытывает соударение со вторым телом массой αm, которое изначально покоится. α < 1 — известная постоянная. Скорость первого тела после удара равна v1. В каких пределах может варьироваться соотношение v1 /v0? Рассмотреть только одномерное движение, первое тело не может пройти сквозь второе.","problemImage":"olympiad-assets/140.jpg"},{"id":"3.2.6","chapter":3,"chapterName":"Электричество","topic":"3.2","topicName":"Вычисление сопротивлений","difficulty":"medium","score":2.96,"searchText":"(«Надежда энергетики», 2023, 9 ) Переменный резистор, включенный по схеме 1, позволяет изменять сопротивление участка цепи в пределах от 0 до 4 кОм. Определите в каких пределах будет изменяться сопротивление участка цепи, если тот же переменный резистор подключить как показано на схеме 2.","problemImage":"olympiad-assets/141.jpg"},{"id":"1.9.6","chapter":1,"chapterName":"Механика","topic":"1.9","topicName":"Баллистика. Координаты","difficulty":"medium","score":2.97,"searchText":"(«Будущие исследователи — будущее науки», 2019, 9 ) Тело, брошенное под углом к горизонту в момент t = 0 с начальной скоростью V0, находилось на одинаковом удалении от точки броска в моменты t1 и t2. Найти время полета тела. При каком условии на угол между начальной скоростью и горизонтом одинаковое удаление от точки броска достигается в ходе полета не один раз? Ускорение свободного падения равно g.","problemImage":"olympiad-assets/142.jpg"},{"id":"1.28.5","chapter":1,"chapterName":"Механика","topic":"1.28","topicName":"Статика","difficulty":"medium","score":2.97,"searchText":"(«Надежда энергетики», 2023, 9 ) Концы двух однородных стержней разной длины привязаны друг к другу двумя нитями разной длины так, что два стержня и две нити образуют четырехугольник. Один из стержней подвесили за середину. Докажите, что в подвешенном состоянии образованная стержнями и нитями фигура будет трапецией.","problemImage":"olympiad-assets/143.jpg"},{"id":"1.21.1","chapter":1,"chapterName":"Механика","topic":"1.21","topicName":"Импульс","difficulty":"medium","score":2.98,"searchText":"(«Надежда энергетики», 2019, 9 ) Тело массой 2 кг покоится на горизонтальной поверхности. На тело начинает действовать горизонтальная сила, зависимость модуля которой от времени представлена на графике. Через 4 с после начала действия силы скорость тела стала равна 12,5 м/с. Определите коэффициент трения тела о поверхность.","problemImage":"olympiad-assets/144.jpg"},{"id":"1.26.1","chapter":1,"chapterName":"Механика","topic":"1.26","topicName":"Неконсервативные системы","difficulty":"medium","score":2.98,"searchText":"(«Формула Единства» / «Третье тысячелетие», 2019, 9 ) Лежащее на шероховатом столе тело массой m = 10 кг прикреплено к стене пружиной жёсткостью k = 112,5 Н/м. Пружина не деформирована. Телу щелчком придают скорость 1 м/с. На каком расстоянии от начального положения оно остановится, если коэффициент трения µ = 0,1?","problemImage":"olympiad-assets/145.jpg"},{"id":"4.4.2","chapter":4,"chapterName":"Оптика","topic":"4.4","topicName":"Тонкие линзы","difficulty":"medium","score":3,"searchText":"(«Формула Единства» / «Третье тысячелетие», 2023, 9 ) На главной оптической оси OO0 тонкой линзы имеются три замечательные точки: A, B, C, причём AB = BC = L. Если точечный источник света поместить в одну из них, то изображение оказывается в одной из двух других. Найдите расстояние между точками L, если фокусное расстояние линзы F = 12 см.","problemImage":"olympiad-assets/146.jpg"},{"id":"3.2.5","chapter":3,"chapterName":"Электричество","topic":"3.2","topicName":"Вычисление сопротивлений","difficulty":"medium","score":3.01,"searchText":"(Всеросс., 2021, МЭ, 9 ) Найдите полное сопротивление участка цепи, если R = 1 кОм. Электрический контакт между скрещенными проводами, изображёнными в центральной части схемы, отсутствует. Ответ выразите в Ом, округлив до целого числа.","problemImage":"olympiad-assets/147.jpg"},{"id":"1.16.10","chapter":1,"chapterName":"Механика","topic":"1.16","topicName":"Сила упругости","difficulty":"medium","score":3.02,"searchText":"(«Росатом», 2023, 9 ) Три одинаковых динамометра соединены своими крючками и подвешены за один из них к потолку. К нижнему динамометру подвешен груз (см. рис.). Известно, что показания верхнего динамометра (отмечен на рисунке цифрой 1) — F1 = 16 Н, нижнего (отмечен цифрой 3) — F3 = 6 Н. Найти показания среднего динамометра (отмечен цифрой 2), массу динамометров и массу груза. Считать, что g = 10 м/с2. −F3 −F1 mдин = F12g = 0,5 кг; Mгр = 3F32g = 0,1 кг; F2 = 2mg + M g = F3 +F","problemImage":"olympiad-assets/148.jpg"},{"id":"1.29.6","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"medium","score":3.02,"searchText":"(Всеросс., 2022, ШЭ, 9 ) Кусок льда, имеющий форму кубика с длиной ребра 6 см, плавает в сосуде с водой, не касаясь дна. Плотность воды 1000 кг/м3, плотность льда 900 кг/м3. 1. Определите объём льда, не погружённого в воду. Ответ выразите в см3, округлив до десятых долей. 2. Сверху в сосуд аккуратно доливают бензин таким образом, чтобы его уровень доходил до верхней грани этого кубика. Перемешивания жидкостей не происходит. Слой бензина какой высоты при этом окажется в сосуде? Плотность бензина 700 кг/м3. Ответ выразите в см, округлив до целого числа.","problemImage":"olympiad-assets/149.jpg"},{"id":"3.4.13","chapter":3,"chapterName":"Электричество","topic":"3.4","topicName":"Мощность тока","difficulty":"medium","score":3.02,"searchText":"(Олимпиада КФУ, 2022, 9 ) В мембране нервной клетки при открытии ионных каналов по ним протекает электрический ток до I = 5 пА = 5 · 10−12 А в каждом одиночном канале. При этом каналы могут открываться синхронно и группироваться с плотностью до 10000 ионных каналов на 1 мкм (1 мкм = 10 м), т. е. n = 10000/мкм2. Найти, какой мощности должна быть электрическая лампочка, чтобы при ее включении в сеть 220 В по стандартному проводу медной электропроводки с сечением S = 2,5 мм2 в ней была бы такая же плотность тока (ток через единичное поперечное сечение). Найти также величину этого тока.","problemImage":"olympiad-assets/150.jpg"},{"id":"3.2.10","chapter":3,"chapterName":"Электричество","topic":"3.2","topicName":"Вычисление сопротивлений","difficulty":"medium","score":3.03,"searchText":"(Всесиб., 2017, 9 ) Два одинаковых равносторонних проволочных треугольника спаяли так, что получилась симметричная шестиконечная звезда. Подключённый к точкам A и B омметр показал сопротивление r. Что покажет омметр при подключении его к точкам C и D?","problemImage":"olympiad-assets/151.jpg"},{"id":"3.4.2","chapter":3,"chapterName":"Электричество","topic":"3.4","topicName":"Мощность тока","difficulty":"medium","score":3.03,"searchText":"(Всеросс., 2021, ШЭ, 9 ) Электрическая цепь, схема которой показана на рисунке, состоит из идеальной батарейки, шести одинаковых резисторов и идеального амперметра. Сопротивление R одного резистора равно 1 кОм. Напряжение на выводах батарейки равно 3 В. 1. Что показывает амперметр? Ответ выразите в миллиамперах, округлите до десятых долей. 2. Определите суммарную мощность, выделяющуюся во всех резисторах. Ответ выразите в милливаттах, округлите до десятых долей. 3. Амперметр заменили на идеальный вольтметр. Найдите показание этого вольтметра. Ответ выразите в вольтах, округлите до целого числа.","problemImage":"olympiad-assets/152.jpg"},{"id":"1.7.2","chapter":1,"chapterName":"Механика","topic":"1.7","topicName":"Неравномерное движение","difficulty":"medium","score":3.04,"searchText":"(Всесиб., 2021, 9 ) Два автомобиля одновременно отправились по одному маршруту протяженностью L и одновременно прибыли в его конечный пункт. Первый автомобиль первую треть времени двигался со скоростью в 2 раза больше, чем в остальное время. Второй автомобиль последнюю треть времени двигался в 2 раза быстрее, чем начальные две третьих. Определите наибольшее расстояние между автомобилями.","problemImage":"olympiad-assets/153.jpg"},{"id":"1.13.4","chapter":1,"chapterName":"Механика","topic":"1.13","topicName":"Масса, плотность, давление","difficulty":"medium","score":3.04,"searchText":"(Всеросс., 2023, МЭ, 9 ) На стройплощадке дачного дома складированы однородные бруски одинаковой массы, каждый из которых сделан из массива одного и того же дерева и имеет форму прямоугольного параллелепипеда. Одно ребро каждого бруска имеет длину 30 см, два других могут быть различными. Строитель выбрал горизонтальную площадку, сложил на ней четыре бруска друг на друга и пронумеровал их сверху вниз от одного до четырёх. Наверху оказался брусок в форме куба. Каждый брусок опирается всей своей нижней поверхностью на следующий по номеру брусок. Оказалось, что получившаяся башня особенная — давление, оказываемое на нижнюю грань каждого бруска, одинаково. 1. Чему равна длина самого длинного ребра второго бруска? Ответ укажите в см, округлите до целого числа. 2. Чему равна длина самого короткого ребра третьего бруска? Ответ укажите в см, округлите до целого числа. 3. Чему равен объём четвёртого бруска? Ответ укажите в дм3, округлите до целого числа.","problemImage":"olympiad-assets/154.jpg"},{"id":"4.2.7","chapter":4,"chapterName":"Оптика","topic":"4.2","topicName":"Отражение света. Плоское зеркало","difficulty":"medium","score":3.04,"searchText":"(Инженерная олимпиада, 2021, 9 ) На горизонтальном зеркале недалеко от экрана стоит шахматная фигура. Фигура освещается параллельным потоком лучей, падающих на нее наклонно (см. рисунок). Будет ли видна на экране тень фигуры? И если да, то какой она будет — увеличенной, уменьшенной, прямой, перевернутой? Ответ сопроводить построением хода лучей.","problemImage":"olympiad-assets/155.jpg"},{"id":"1.7.3","chapter":1,"chapterName":"Механика","topic":"1.7","topicName":"Неравномерное движение","difficulty":"medium","score":3.05,"searchText":"(«Курчатов», 2020, 9 ) Красная Шапочка опоздала на электричку к бабушке и теперь должна ждать следующую, которая прибудет через полчаса. Чтобы скоротать время, она решила прогуляться: в течение t1 = 15 минут она шла строго на юг с постоянной скоростью, затем повернула на восток и шла еще t2 = 8 минут с этой же скоростью. Вспомнив о времени прибытия электрички, она побежала к станции по кратчайшему пути, причём на каждый шаг, начиная со второго, она тратит на 0,1% времени меньше, чем на предыдущий. Успеет ли Красная Шапочка на электричку, если скорость красной шапочки 1 шаг/с?","problemImage":"olympiad-assets/156.jpg"},{"id":"4.2.6","chapter":4,"chapterName":"Оптика","topic":"4.2","topicName":"Отражение света. Плоское зеркало","difficulty":"medium","score":3.05,"searchText":"(«Надежда энергетики», 2015, 9 ) Учащиеся Лицея №1502 при МЭИ выступали на научной конференции школьников с докладом о результатах своей работы. Они исследовали отражательные свойства белого материала, из которого изготавливаются экраны в кинотеатрах. Учащиеся обнаружили, что свойства материала оптимизированы для минимизации потерь при отражении света. После доклада председатель жюри конференции задал лицеистам вопрос: «Что мешает сделать экран зеркальным, ведь при этом потери света будут заведомо меньше?». Учащиеся получили диплом 1 степени, потому что ответили на вопрос совершенно правильно. Что ответили школьники председателю жюри? Как вы объясните их ответ?","problemImage":"olympiad-assets/157.jpg"},{"id":"1.29.9","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"medium","score":3.07,"searchText":"(Всеросс., 2021, МЭ, 9 ) На рычаге уравновесили два сосуда с разными жидкостями. После этого аккуратно поместили в каждый из сосудов по одному маленькому шарику равной массы так, что жидкости не вылились из сосудов. В обоих сосудах шарики плавают у правой стенки. Как в результате этого изменится положение равновесия рычага? 1. Перевесит левый сосуд; 2. перевесит правый сосуд; 3. равновесие не нарушится; 4. для ответа недостаточно данных.","problemImage":"olympiad-assets/158.jpg"},{"id":"2.3.7","chapter":2,"chapterName":"Тепловые явления","topic":"2.3","topicName":"Фазовые переходы","difficulty":"medium","score":3.07,"searchText":"(Всеросс., 2021, МЭ, 9 ) Школьник хочет охладить до 0 ◦ C бутылку с водой при температуре 20 ◦ C, положив её в морозильную камеру мини-холодильника. Объём воды в бутылке равен 0,5 л. Через шесть часов школьник достал бутылку из холодильника. В стакан из неё удалось налить всего лишь 0,25 л воды. Найдите полезную мощность, с которой работает морозильная камера холодильника. Удельная теплота плавления льда 340 кДж/кг, удельная теплоёмкость воды 4200 Дж/(кг · ◦ C), плотность воды 1000 кг/м3, теплоёмкость бутылки очень мала. Ответ выразите в ваттах, округлите до десятых долей.","problemImage":"olympiad-assets/159.jpg"},{"id":"1.24.2","chapter":1,"chapterName":"Механика","topic":"1.24","topicName":"Консервативные системы","difficulty":"medium","score":3.08,"searchText":"(Всесиб., 2020, 9 ) Легкая упругая резинка длиной L одним концом прикреплена к потолку на высоте H от пола, а другим концом — к маленькому шарику. Если шарик аккуратно опустить, то в равновесии резинка удлинится на величину l. Затем шарик подняли на высоту подвеса H и из неподвижного состояния отпустили. Опускаясь, шарик порвал резинку и достиг пола со скоростью v. На какой высоте находился шарик в момент разрыва резинки? Ускорение свободного падения g.","problemImage":"olympiad-assets/160.jpg"},{"id":"2.3.8","chapter":2,"chapterName":"Тепловые явления","topic":"2.3","topicName":"Фазовые переходы","difficulty":"medium","score":3.08,"searchText":"(Всеросс., 2022, МЭ, 9 ) В два одинаковых котелка налиты одинаковые количества воды при одинаковой температуре. Один котелок расположен на уровне моря, а второй находится высоко в горах. Выберите правильное утверждение. 1. К котелку, находящемуся на уровне моря, необходимо подвести большее количество теплоты, чем к находящемуся в горах, чтобы довести воду до кипения. 2. К котелку, находящемуся в горах, необходимо подвести большее количество теплоты, чем к находящемуся на уровне моря, чтобы довести воду до кипения. 3. К обоим котелкам необходимо подвести одинаковое количество теплоты, чтобы довести воду до кипения.","problemImage":"olympiad-assets/161.jpg"},{"id":"2.4.1","chapter":2,"chapterName":"Тепловые явления","topic":"2.4","topicName":"Теплопроводность","difficulty":"medium","score":3.08,"searchText":"(Олимпиада КФУ, 2023, 9 ) Сруб окружен со всех сторон остекленной верандой. Сруб отапливается батареей с постоянной температурой (батарея находится внутри сруба). При температуре на улице Te = −15 ◦ C, температура в срубе Ti = 24 ◦ C. Температура на веранде при этом равна Tm = −5 ◦ C. Найдите температуру батареи Tr, если после открытия окон на веранде (температура на веранде выровнялась с улицей), температура в срубе упала до Ti0 = 19 ◦ C. Теплообменом через пол и потолок для простоты пренебречь.","problemImage":"olympiad-assets/162.jpg"},{"id":"3.1.20","chapter":3,"chapterName":"Электричество","topic":"3.1","topicName":"Электрические цепи","difficulty":"medium","score":3.08,"searchText":"(«Росатом», 2021, 9 ) В цепи, схема которой приведена на рисунке, сопротивления трех резисторов известны, четвертого — нет. Найти его сопротивление, если отношение показаний идеальных амперметров равно n = 0,25. Известные сопротивления приведены на рисунке. r1 = 1−2n","problemImage":"olympiad-assets/163.jpg"},{"id":"1.29.17","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"medium","score":3.09,"searchText":"(Олимпиада КФУ, 2019, 9 ) Два бруска одинакового объема V и плотностями ρ1, ρ2 (ρ1 < ρ0 < ρ2, где ρ0 — плотность воды) скреплены пружиной. На столе сжатие пружины равно x1 (более лёгкий брусок расположен сверху). Найти деформацию пружины, если эта система будет плавать в воде, и объем погруженной части верхнего бруска.","problemImage":"olympiad-assets/164.jpg"},{"id":"3.2.14","chapter":3,"chapterName":"Электричество","topic":"3.2","topicName":"Вычисление сопротивлений","difficulty":"medium","score":3.09,"searchText":"(«Надежда энергетики», 2016, 9 ) В деревянную доску забито 2016 гвоздей. Каждый гвоздь соединён с каждым из оставшихся 2015 гвоздей проводниками с одинаковыми сопротивлениями. Сопротивление электрической цепи между любыми двумя гвоздями равно 1 Ом. Клеммы идеального источника с напряжением 20,16 В подключают к первому и 2016-му гвоздям. Какое количество теплоты выделится в проводнике, соединяющем эти гвозди, за 100 секунд? Сопротивление гвоздей не учитывать.","problemImage":"olympiad-assets/165.jpg"},{"id":"1.11.2","chapter":1,"chapterName":"Механика","topic":"1.11","topicName":"Движение по окружности","difficulty":"medium","score":3.1,"searchText":"(Инженерная олимпиада, 2023, 9 ) Стержень вращается с постоянной угловой скоростью ω вокруг оси, проходящей через крайнюю точку сделанного из проволоки полукольца (точка O на рисунке). Стержень соединен с полукольцом колечком, которое может без трения скользить по стержню и полукольцу. Найти мгновенную угловую скорость колечка в тот момент времени, когда угол α между стержнем и диаметром, замыкающим полукольцо, равен 30◦ (см. рисунок; диаметр, замыкающий полукольцо обозначен OA). При каких углах α больше угловая скорость колечка: при α → 0 или при α → 90◦ и почему?","problemImage":"olympiad-assets/166.jpg"},{"id":"2.2.9","chapter":2,"chapterName":"Тепловые явления","topic":"2.2","topicName":"Теплообмен","difficulty":"medium","score":3.1,"searchText":"(«Надежда энергетики», 2019, 9 ) Вал турбины на гидроэлектростанциях закрепляется в специальных устройствах — опорных подшипниках, которые уменьшают трение при вращении. Через подшипники для их охлаждения и смазки непрерывно прокачивается вода, температура которой до и после подшипника отличается в 2 раза. Определите, во сколько раз будет отличаться температура воды до и после подшипника, если расход воды через подшипник будет увеличен в два раза. Температура воды на входе в подшипник во всех случаях одинакова.","problemImage":"olympiad-assets/167.jpg"},{"id":"3.4.14","chapter":3,"chapterName":"Электричество","topic":"3.4","topicName":"Мощность тока","difficulty":"medium","score":3.1,"searchText":"(«Шаг в будущее», 2021, 9 ) Имеется два резистора с одинаковым сопротивлением и один резистор с сопротивлением в 2 раза большим, чем у двух других. Если подключить эти резисторы последовательно к источнику электрической энергии, в цепи будет выделяться мощность 2 Вт. Какая мощность выделится в цепи, если подключить к этому же источнику первые два резистора (с одинаковым сопротивлением) параллельно? Напряжение источника постоянно (внутреннее сопротивление равно нулю).","problemImage":"olympiad-assets/168.jpg"},{"id":"1.4.4","chapter":1,"chapterName":"Механика","topic":"1.4","topicName":"Вертикальное движение","difficulty":"medium","score":3.11,"searchText":"(«Физтех», 2022, 9 ) Школьник бросает камень вертикально вверх с начальной скоростью V0 = 12 м/с. 1. Через какое время t после старта скорость камня будет равна по величине V0 /3? 2. На какой высоте h, отсчитанной от точки старта, скорость камня будет равна по величине V0 /3? Ускорение свободного падения g = 10 м/с2. Сопротивление воздуха не учитывать.","problemImage":"olympiad-assets/169.jpg"},{"id":"1.17.3","chapter":1,"chapterName":"Механика","topic":"1.17","topicName":"Сила трения","difficulty":"medium","score":3.11,"searchText":"(«Надежда энергетики», 2017, 9 ) Гоночный автомобиль совершает заезд по кольцевой трассе по часовой (см. рис). Автомобиль двигается с максимально возможной скоростью (на грани заноса). Пройдя последние 5 кругов за 5 мин 14 с, автомобиль пересекает финиша в точке Ф, выезжает на прямолинейную дорогу ФО. Гонщик сразу резко тормозить (на грани проскальзывания колёс о дорогу) и останавливается в точке O. Найдите время торможения τ. Кольцевая и прямолинейная дороги лежат в горизонтальной плоскости; свойства дорожного покрытия везде одинаковы.","problemImage":"olympiad-assets/170.jpg"},{"id":"3.1.19","chapter":3,"chapterName":"Электричество","topic":"3.1","topicName":"Электрические цепи","difficulty":"medium","score":3.11,"searchText":"(Всесиб., 2021, 9 ) Изображенная на рисунке цепь содержит гальванический элемент, создающий независимо от тока напряжение U, и три резистора. Включенный параллельно среднему резистору идеальный вольтметр показывает напряжение V. Если его заменить на идеальный амперметр, то последний будет показывать ток J. Определите сопротивление среднего резистора.","problemImage":"olympiad-assets/171.jpg"},{"id":"1.28.12","chapter":1,"chapterName":"Механика","topic":"1.28","topicName":"Статика","difficulty":"medium","score":3.12,"searchText":"(Всесиб., 2016, 9 ) К легкому шнуру, прикрепленному к потолку, привязали два груза. Найдите отношение их масс M/m по приведенному рисунку.","problemImage":"olympiad-assets/172.jpg"},{"id":"1.35.7","chapter":1,"chapterName":"Механика","topic":"1.35","topicName":"Механические колебания и волны","difficulty":"medium","score":3.13,"searchText":"(«Росатом», 2021, 9 ) Около берега текущей со скоростью v реки бросили камень (в точке A), и по поверхности воды стала распространяться волна (см. рис.). Через какое время волна достигнет точки B на другом берегу реки, расположенной напротив точки A, если ширина реки l, скорость волны в стоячей воде составляет 4v? Тепловые явления","problemImage":"olympiad-assets/173.jpg"},{"id":"1.9.1","chapter":1,"chapterName":"Механика","topic":"1.9","topicName":"Баллистика. Координаты","difficulty":"medium","score":3.14,"searchText":"(Всеросс., 2022, МЭ, 9 ) Камешек бросили с балкона дома. Может ли он за последовательные равные промежутки времени пройти пути, равные 1 м, 1 м, 3 м, 5 м? Сопротивление воздуха отсутствует. 1. Может, если его бросили вертикально вверх. 2. Может, если его бросили вертикально вниз. 3. Может, если его бросили в горизонтальном направлении. 4. Нет, такое невозможно.","problemImage":"olympiad-assets/174.jpg"},{"id":"1.10.1","chapter":1,"chapterName":"Механика","topic":"1.10","topicName":"Баллистика. Отражения","difficulty":"medium","score":3.14,"searchText":"(«Формула Единства» / «Третье тысячелетие», 2022, 9 ) Тяжёлая вертикальная стенка движется горизонтально со скоростью 2 м/с. В сторону стенки в том же направлении брошен упругий мяч со скоростью 10 м/с, начальной высотой 5 м и начальным расстоянием от стенки 4 м. Определите, на каком расстоянии от точки бросания упадёт мяч после отскока от стенки. Ответ дайте с точностью до 1 см. Примечание. Ускорение свободного падения считайте равным 10 м/с2.","problemImage":"olympiad-assets/175.jpg"},{"id":"1.29.10","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"medium","score":3.14,"searchText":"(Всеросс., 2021, МЭ, 9 ) В сосуды 1 и 2 налито масло плотностью 0,9 г/см3. Уровни масла в сосудах одинаковы, сосуды соединены друг с другом с помощью Г-образной трубки. Эта трубка закрыта с обоих концов кранами К1 и К2 и полностью заполнена водой плотностью 1 г/см3. Как изменятся уровни жидкости в сосудах, если открыть краны К1 и К2? 1. 1 — понизится; 2 — повысится; 2. не изменятся; 3. 2 — понизится; 1 — повысится; 4. зависит от того, какой кран открывать вначале; 5. для ответа недостаточно данных.","problemImage":"olympiad-assets/176.jpg"},{"id":"3.4.6","chapter":3,"chapterName":"Электричество","topic":"3.4","topicName":"Мощность тока","difficulty":"medium","score":3.14,"searchText":"(Всеросс., 2022, МЭ, 9 ) Экспериментатор собрал электрическую цепь (см. рисунок), в которой один из контактов лампочки Л был подключён к отрицательному полюсу батарейки. После этого он переставил лампочку таким образом, что один из её контактов оказался соединённым с положительным полюсом батарейки. Как изменится яркость свечения лампочки Л? 1. увеличится; 2. уменьшится; 3. не изменится; 4. ответ зависит от сопротивления резистора R.","problemImage":"olympiad-assets/177.jpg"},{"id":"3.4.4","chapter":3,"chapterName":"Электричество","topic":"3.4","topicName":"Мощность тока","difficulty":"medium","score":3.15,"searchText":"(Всеросс., 2023, ШЭ, 9 ) Резистор подключили к идеальному источнику постоянного напряжения 120 В, при этом в резисторе выделялась мощность 60 Вт. Затем из трёх таких резисторов и такого же источника собрали цепь, схема которой показана на рисунке. 1. Найдите сопротивление одного резистора. Ответ дайте в Ом, округлив до целого числа. 2. Найдите общую мощность, выделяющуюся в цепи при разомкнутом ключе. Ответ дайте в ваттах, округлив до целого числа. 3. Найдите общую мощность, выделяющуюся в цепи при замкнутом ключе. Ответ дайте в ваттах, округлив до целого числа.","problemImage":"olympiad-assets/178.jpg"},{"id":"1.28.1","chapter":1,"chapterName":"Механика","topic":"1.28","topicName":"Статика","difficulty":"medium","score":3.16,"searchText":"(Всеросс., 2020, ШЭ, 9 ) В системе, изображённой на рисунке, один конец нерастяжимой верёвки прицепили к оси O подвижного блока II, а к другому концу (точке A) приложили силу F. Верёвки и блоки I и II невесомые, трение отсутствует. Прикладывая силу F к точке A, тело m равномерно поднимают вверх. Чему равна масса тела m? А) m = 4F g Б) m = 3F g В) m = 2F g Г) m = Fg Д) m = 2g F","problemImage":"olympiad-assets/179.jpg"},{"id":"1.32.2","chapter":1,"chapterName":"Механика","topic":"1.32","topicName":"Подобие и размерность","difficulty":"medium","score":3.16,"searchText":"(«Надежда энергетики», 2022, 9 ) Школьники, изучающие термодинамику и тепловые явления, решили провести любопытный эксперимент. Они заморозили воду в виде ледяного куба с ребром 10 см и 1000 кубиков с длиной ребра 1 см. В распоряжении школьников было два одинаковых идеальных термостата, в которых постоянно поддерживалась температура 0 ◦ C. Школьники поместили куб в один термостат, а все кубики аккуратно разложили в один слой во втором так, что они не касались друг друга. Время таяния льда в каждом термостате измерялось секундомером, который включался, когда в термостате появлялись первые капли воды, и выключался, когда лед полностью превращался в воду. Сравните показания секундомера по окончании опыта. Объясните свои выводы.","problemImage":"olympiad-assets/180.jpg"},{"id":"1.33.3","chapter":1,"chapterName":"Механика","topic":"1.33","topicName":"Сопротивление среды","difficulty":"medium","score":3.16,"searchText":"(«Шаг в будущее», 2021, 9 ) Парашютист выполняет прыжок. Через некоторое время после открытия парашюта установившаяся скорость снижения парашютиста становится в n = 4 раза меньше, чем его скорость перед раскрытием парашюта. Сила сопротивления, действующая на парашютиста, пропорциональна квадрату его скорости. Чему равно ускорение парашютиста в момент, когда его скорость составляет 50% от скорости, которую он имел при снижении без парашюта?","problemImage":"olympiad-assets/181.jpg"},{"id":"1.26.2","chapter":1,"chapterName":"Механика","topic":"1.26","topicName":"Неконсервативные системы","difficulty":"medium","score":3.18,"searchText":"(«Формула Единства» / «Третье тысячелетие», 2021, 9 ) Теплоизолированная цилиндрическая бочка высоты H = 1 м наполовину заполнена водой, а к верхней крышке изнутри приклеен лёгкий кубик. По крышке несильно ударили, из-за чего кубик отклеился и упал в воду. Найдите, сколько выделилось в системе тепла, после того как колебания воды прекратятся. Примечание. Плотность воды — 1 г/см3, средняя плотность кубика — 0,5 г/см3, сторона кубика a = 4 см; считайте, что бочка настолько широкая, что уровень воды после падения кубика практически не изменился.","problemImage":"olympiad-assets/182.jpg"},{"id":"1.12.1","chapter":1,"chapterName":"Механика","topic":"1.12","topicName":"Кривизна траектории","difficulty":"medium","score":3.19,"searchText":"(«Шаг в будущее», 2022, 9 ) Тело, брошенное с поверхности земли со скоростью v0 = 10 м/с, перелетает через трубу диаметра d = 2 м. В высшей точке тело почти касается трубы, обладая минимальной для дальнейшего свободного полета скоростью. Определить максимальную высоту подъема тела. Ускорение свободного падения g = 10 м/с2.","problemImage":"olympiad-assets/183.jpg"},{"id":"3.4.1","chapter":3,"chapterName":"Электричество","topic":"3.4","topicName":"Мощность тока","difficulty":"medium","score":3.19,"searchText":"(Всеросс., 2020, ШЭ, 9 ) Есть два нагревателя, рассчитанных на подключение к бытовой электрической сети. Мощность первого нагревателя 300 Вт, а второго 600 Вт. Электрические сопротивления нагревателей не зависят от протекающего через них тока. 1. Найдите отношение сопротивлений R R2 до целого числа. 2. Нагреватели включают в электрическую сеть, соединив их последовательно. Какая суммарная мощность выделяется в нагревателях? Ответ укажите в Вт, округлив до целого числа. 3. Нагреватели соединяют параллельно. Какая суммарная мощность теперь выделяется в нагревателях? Ответ укажите в Вт, округлив до целого числа.","problemImage":"olympiad-assets/184.jpg"},{"id":"4.2.12","chapter":4,"chapterName":"Оптика","topic":"4.2","topicName":"Отражение света. Плоское зеркало","difficulty":"medium","score":3.19,"searchText":"(«Курчатов», 2022, 9 ) На стене большой комнаты висит зеркало шириной 2,0 м. Первоначально человек A стоит лицом к стене на расстоянии 2,0 м справа от правого края зеркала и 1,0 м от стены и начинает двигаться параллельно стене со скоростью 1,0 м/с в левую сторону. В этот же момент человек B начинает двигаться со скоростью 1,0 м/с в сторону центра зеркала под прямым углом к плоскости зеркала. Изначально человек B стоит на расстоянии 3,5 м от центра зеркала. Через какое время они увидят друг друга в зеркале? Закон отражения гласит, что угол падения равен углу отражения.","problemImage":"olympiad-assets/185.jpg"},{"id":"1.28.9","chapter":1,"chapterName":"Механика","topic":"1.28","topicName":"Статика","difficulty":"medium","score":3.2,"searchText":"(Олимпиада КФУ, 2022, 9 ) Система представляет собой однородную доску массы M, два маленьких груза массы m, идеальные блоки и невесомые нерастяжимые нити. Правый груз лежит на краю доски (см. рис.). Найдите силу натяжения нити, прикрепленной к правому грузу T. При каких значениях n и отношения m/M в системе будет достигаться равновесие для горизонтального положения доски?","problemImage":"olympiad-assets/186.jpg"},{"id":"3.1.9","chapter":3,"chapterName":"Электричество","topic":"3.1","topicName":"Электрические цепи","difficulty":"medium","score":3.2,"searchText":"(Олимпиада КФУ, 2020, 9 ) При подключении трех параллельно соединенных резисторов к идеальному источнику напряжения идеальный амперметр показывает I2 = 8 А (а). При последовательном подключении тех же резисторов в тех же условиях I1 = 1 A (б). Какой ток будет показывать амперметр в цепи на рис. (в), если в ней содержатся те же резисторы и источник? Все токи указаны в установившемся режиме, зависимость сопротивления резисторов от температуры считать линейной, термодинамические свойства внешней среды во всех случаях идентичны.","problemImage":"olympiad-assets/187.jpg"},{"id":"3.1.21","chapter":3,"chapterName":"Электричество","topic":"3.1","topicName":"Электрические цепи","difficulty":"medium","score":3.2,"searchText":"(«Росатом», 2023, 9 ) Имеется электрическая цепь, схема которой приведена на рисунке. В цепи все резисторы одинаковы и равны R = 1 кОм, сопротивление амперметра пренебрежимо мало. Когда к цепи прикладывают напряжение U = 120 В, амперметр показывает силу тока IA = 3 мА. Найти показания вольтметра.","problemImage":"olympiad-assets/188.jpg"},{"id":"1.8.4","chapter":1,"chapterName":"Механика","topic":"1.8","topicName":"Графики движения","difficulty":"medium","score":3.21,"searchText":"(Всеросс., 2020, МЭ, 9 ) На рисунке схематично изображены графики зависимостей координат для трёх тел, движущихся вдоль оси OX, от времени. Какое из тел в процессе движения: а) — останавливалось; б) — меняло направление движения? А) а — 1, б — 2, 3 Б) а — 1, 2, б — 3 В) а — 2, 3, б — 3 Г) а — 3, б — 3","problemImage":"olympiad-assets/189.jpg"},{"id":"1.23.2","chapter":1,"chapterName":"Механика","topic":"1.23","topicName":"Работа и энергия","difficulty":"medium","score":3.21,"searchText":"(«Формула Единства» / «Третье тысячелетие», 2022, 9 ) Сизиф катит камень в форме куба с ребром a = 0,5 м и массой 250 кг по наклонной дороге в гору, перекатывая камень вокруг ребра. Высота горы равна H = 400 м, а угол наклона дороги равен α = 30◦. Определите минимальную выполненную Сизифом работу. Примечание. Коэффициент трения достаточно велик, чтобы камень не скользил; при этом камень при перекатывании не отскакивает от поверхности дороги. Ответ дайте с точностью до кДж. Ускорение свободного падения 9,8 м/с2.","problemImage":"olympiad-assets/190.jpg"},{"id":"1.5.4","chapter":1,"chapterName":"Механика","topic":"1.5","topicName":"Относительность движения","difficulty":"medium","score":3.22,"searchText":"(Всеросс., 2022, МЭ, 9 ) Вася и Маша, находясь в аэропорту, становятся на траволатор (горизонтальная «дорожка»-транспортёр), который движется со скоростью 0,8 м/с. Поскольку Васе скучно, он сразу же начинает бежать вперёд, в направлении к концу траволатора и, достигнув его за 40 с, тут же разворачивается и бежит обратно к Маше. 1. В течение какого времени Вася приближался к Маше? Ответ выразите в секундах, округлите до целого числа. 2. На каком расстоянии от начала траволатора встретятся школьники? Ответ выразите в метрах, округлите до целого числа.","problemImage":"olympiad-assets/191.jpg"},{"id":"1.20.2","chapter":1,"chapterName":"Механика","topic":"1.20","topicName":"Движение со связями","difficulty":"medium","score":3.22,"searchText":"(Всесиб., 2019, 9 ) Клин с сечением в форме равнобедренного треугольника опирается своими одинаковыми гранями на две одинаковые плиты (см. рисунок). Верхние поверхности плит находятся в одной горизонтальной плоскости. Левая плита неподвижна, а правая движется горизонтально со скоростью u. Определите величину скорости, с которой движется клин. Угол между боковыми гранями клина 2α. Верхняя грань во время движения остается горизонтальной.","problemImage":"olympiad-assets/192.jpg"},{"id":"1.21.7","chapter":1,"chapterName":"Механика","topic":"1.21","topicName":"Импульс","difficulty":"medium","score":3.22,"searchText":"(«Шаг в будущее», 2023, 9 ) Ситуационная задача. В качестве двигательной установки легких беспилотных летательных аппаратов применяется электродвигатель с импеллером, как альтернатива традиционному воздушному винту (пропеллеру). Электродвигатель — 1 с импеллером — 2 представляет собой вентилятор в кольцевом канале (трубе) — 3. С помощью импеллеров можно проводить имитацию воздушно-реактивных двигателей. В этом случае для увеличения тяги в канал — 3 после вентилятора может добавляться горючее, при сжигании которого поток воздуха за счёт уменьшения плотности (при допущении постоянного расхода воздуха) дополнительно разгоняется. Вентилятор имеет диаметр 120 мм и КПД 60%. Определите необходимую мощность электродвигателя, позволяющего обеспечить номинальную тягу после вентилятора в 10 Н. В расчётах площалью сечения электродвигателя — 1 и втулки — 4 вентилятора пренебречь. Плотность воздуха примите равной 1,2 кг/м3. Площадь круга рассчитывается по формуле S =, где d — диаметр.","problemImage":"olympiad-assets/193.jpg"},{"id":"1.9.12","chapter":1,"chapterName":"Механика","topic":"1.9","topicName":"Баллистика. Координаты","difficulty":"medium","score":3.23,"searchText":"(Олимпиада КФУ, 2021, 9 ) Тело брошено под углом к горизонту и движется в плоскости xy. Вектор ускорения свободного падения направлен против оси y. В таблице приведены координаты тела в различные моменты времени. Трением о воздух можно пренебречь. Определить начальную скорость и угол между начальной скоростью и горизонталью. Ускорение свободного падения принять равным 10 м/c2. x, м 0 0,30 0,60 0,90 1,20 1,50 y, м 0 0,35 0,60 0,75 0,80 0,75","problemImage":"olympiad-assets/194.jpg"},{"id":"1.28.7","chapter":1,"chapterName":"Механика","topic":"1.28","topicName":"Статика","difficulty":"medium","score":3.23,"searchText":"(«Надежда энергетики», 2015, 9 ) Тяжёлый цилиндр подвешен за прикреплённую к нему нить к вертикальной стене. При каком наименьшем коэффициенте трения µ цилиндр не будет скользить по стене? Радиус цилиндра R = 3 см, длина нити L = 4 см.","problemImage":"olympiad-assets/195.jpg"},{"id":"1.30.2","chapter":1,"chapterName":"Механика","topic":"1.30","topicName":"Трубка с жидкостью","difficulty":"medium","score":3.23,"searchText":"(«Физтех», 2022, 9 ) Тонкая изогнутая трубка состоит из горизонтального участка, запаянного с одного конца, и вертикального участка, открытого в атмосферу. Трубка заполнена двумя несмешивающимися жидкостями: плотности ρ1 в горизонтальном участке, и плотности ρ2 в горизонтальном и вертикальном участках (см. рис.). Трубка движется с ускорением a = g/8, направленным горизонтально. Геометрические размеры указаны на рисунке, H = L, L1 = 3L, L2 = 2L. Атмосферное давление P0. 1. Найдите давление P1 в жидкости в месте изгиба трубки. 2. Найдите давление P2 в жидкости у запаянного конца трубки.","problemImage":"olympiad-assets/196.jpg"},{"id":"2.2.7","chapter":2,"chapterName":"Тепловые явления","topic":"2.2","topicName":"Теплообмен","difficulty":"medium","score":3.23,"searchText":"(«Надежда энергетики», 2015, 9 ) В калориметре находятся металлический брусок, некоторое количество песка и некоторое количество воды. Если содержимому калориметра сообщить некоторое количество тепла и выждать достаточно большое время, то температура в калориметре изменится на некоторое число градусов. Если повторить тот же опыт, но с массой песка в n раз меньшей, то изменение температуры оказывается в m раз больше. Во сколько раз больше будет изменение температуры по сравнению с первым опытом, если опыт провести вообще без песка? Теплоёмкостью калориметра и утечками тепла за время опытов пренебрегите; примите n > m > 1.","problemImage":"olympiad-assets/197.jpg"},{"id":"4.2.8","chapter":4,"chapterName":"Оптика","topic":"4.2","topicName":"Отражение света. Плоское зеркало","difficulty":"medium","score":3.23,"searchText":"(Инженерная олимпиада, 2023, 9 ) Для предотвращения столкновений судов с землей в ночное время суток на берегу моря ставят маяки, которые должны предупредить корабли об опасном приближении к суше. Наиболее эффективно такие маяки работают, если они дают прерывистый световой сигнал. Рассмотрите следующую модель источника света для такого маяка. Неподвижный точечный источник света S находится на расстоянии d = 50 см от зеркала AB (см. рисунок). Зеркало вращается с угловой скоростью ω = 1 рад/с вокруг оси, перпендикулярной плоскости рисунка и проходящей через середину зеркала (через точку O на рисунке). Найти скорость и ускорение изображения источника в зеркале.","problemImage":"olympiad-assets/198.jpg"},{"id":"4.2.9","chapter":4,"chapterName":"Оптика","topic":"4.2","topicName":"Отражение света. Плоское зеркало","difficulty":"medium","score":3.23,"searchText":"(Олимпиада КФУ, 2021, 9 ) Два бесконечных плоских зеркала образуют двугранный угол α0 \u001c 1. Параллельно биссектрисе линейного угла* данного двугранного угла на одно из зеркал падает луч лазера. Оцените количество отражений луча в зеркалах, после которых луч «выйдет» из системы. *Угол между двумя перпендикулярами к ребру двугранного угла, проведенными в его гранях из одной точки ребра, называется линейным углом двугранного угла.","problemImage":"olympiad-assets/199.jpg"},{"id":"1.16.9","chapter":1,"chapterName":"Механика","topic":"1.16","topicName":"Сила упругости","difficulty":"medium","score":3.25,"searchText":"(Всесиб., 2022, 9 ) В закрепленной конусообразной воронке с углом 2α при вершине расположены два шарика малого размера, соединенных пружиной жесткостью k. К шарикам прикреплена нить, которая проходит через отверстие в вершине конуса и серединой прикреплена к такой же пружине, зафиксированной снизу и расположенной вертикально (см. рис.). Нить не провисает. Массы шариков m. Система находится в равновесии. На верхний конец нижней пружины прикрепляют шарик массой m. Насколько сожмется нижняя пружина в состоянии нового равновесия? Ускорение свободного падения g. Ось воронки вертикальна, а шарики расположены горизонтально, нить невесомая и нерастяжимая. Трения нет.","problemImage":"olympiad-assets/200.jpg"},{"id":"1.9.14","chapter":1,"chapterName":"Механика","topic":"1.9","topicName":"Баллистика. Координаты","difficulty":"medium","score":3.26,"searchText":"(Всесиб., 2017, 9 ) Мяч, брошенный вертикально вверх с высоты h, упал на пол через время t. На каком расстоянии L по горизонтали он ударится об пол, если его бросить с той же высоты и с той же начальной скоростью, но направленной горизонтально? Ускорение свободного падения g. Влиянием воздуха пренебречь.","problemImage":"olympiad-assets/201.jpg"},{"id":"1.17.5","chapter":1,"chapterName":"Механика","topic":"1.17","topicName":"Сила трения","difficulty":"medium","score":3.26,"searchText":"(«Росатом», 2021, 9 ) На горизонтальной поверхности находятся 20 тел массой m каждое, связанные пружинами с жесткостью k и длиной в недеформированном состоянии l0. Тела аккуратно двигают по поверхности, растягивая пружины. Найти максимальную длину цепочки тел, при которой все тела будут находиться в покое. Коэффициент трения между телами и поверхностью µ. Для любых растяжений пружин выполняется закон Гука. Размерами тел пренебречь.","problemImage":"olympiad-assets/202.jpg"},{"id":"1.29.28","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"medium","score":3.26,"searchText":"(«Будущие исследователи — будущее науки», 2021, 9 ) На дне цилиндрического сосуда лежит шар радиуса R. Когда в сосуд налили объем V воды, сила давления шара на дно уменьшилась до 4/9 от первоначального значения. После доливания такого же объема масла с плотностью 0,8 плотности воды сила давления шара на дно обратилась в нуль. Найти площадь дна сосуда. Указание. Объем шара Vш связан с его радиусом формулой Vш = 43 πR3.","problemImage":"olympiad-assets/203.jpg"},{"id":"3.5.3","chapter":3,"chapterName":"Электричество","topic":"3.5","topicName":"Электронагреватель","difficulty":"medium","score":3.26,"searchText":"(«Формула Единства» / «Третье тысячелетие», 2020, 9 ) Развлекаясь с набором «Юный электрик», Вася собрал следующую схему: кипятильник, помещённый в чайник, подключил к двум длинным тонким проводам, каждый из которых намотал на катушку. Решив, что схема слишком проста, Вася подвесил чайник к потолку на пружине, а провода подключил к скользящим клеммам источника тока, размещённым на одной высоте (см. рис.). Налив воду в чайник и замкнув цепь, он начал наблюдать за процессом кипения. Когда в чайнике было 2 л, она выкипала со скоростью 1 мл/с. Когда в нём остался 1 л — со скоростью 2,25 мл/с. С какой скоростью вода будет выкипать, когда останется 0,5 л?","problemImage":"olympiad-assets/204.jpg"},{"id":"2.3.14","chapter":2,"chapterName":"Тепловые явления","topic":"2.3","topicName":"Фазовые переходы","difficulty":"medium","score":3.27,"searchText":"(«Шаг в будущее», 2022, 9 ) В теплоизолированный сосуд налит некоторый объем воды при температуре 20 ◦ C. В воду погрузили закрытую пробирку с шариком льда при температуре 0 ◦ C. Как только лед растаял пробирку вынули, а воду быстро перемешали. При этом оказалось, что температура воды понизилась на 1 ◦ C. Затем талую воду из пробирки добавили в сосуд. Какая температура воды установится в сосуде, если взять еще 5 таких же шариков и друг за другом бросить их прямо в сосуд? Теплоемкостью сосуда и пробирки пренебречь.","problemImage":"olympiad-assets/205.jpg"},{"id":"1.29.21","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"medium","score":3.28,"searchText":"(«Будущие исследователи — будущее науки», 2015, 9 ) В сосуде с водой плавает, погрузившись наполовину, шар объема V с полостью внутри и небольшим отверстием в верхней части его оболочки. Воду из сосуда наливают через отверстие в полость, и после заполнения 2/3 объема полости шар оказывается полностью погруженным в воду. Найти объем полости и плотность материала оболочки шара. Понизится или повысится уровень воды в сосуде по сравнению с первоначальным после того, как шар утонет и вода заполнит всю полость? Плотность воды 1000 кг/м3.","problemImage":"olympiad-assets/206.jpg"},{"id":"1.28.13","chapter":1,"chapterName":"Механика","topic":"1.28","topicName":"Статика","difficulty":"medium","score":3.29,"searchText":"(Инженерная олимпиада, 2022, 9 ) Концы невесомой веревки закреплены в точках A и B (см. рисунок). К веревке привязали два груза массами m1 и m2. По приведенному рисунку найти отношение масс грузов m1 /m2.","problemImage":"olympiad-assets/207.jpg"},{"id":"1.35.2","chapter":1,"chapterName":"Механика","topic":"1.35","topicName":"Механические колебания и волны","difficulty":"medium","score":3.29,"searchText":"(Всеросс., 2023, МЭ, 9 ) Груз массой m, прикреплённый к лёгкой пружине жёсткостью k, совершает колебания на гладком горизонтальном столе. Какая из следующих величин является модулем максимальной скорости груза в процессе его движения, если амплитуда (максимальное смещение от положения равновесия) равна A? kA 1.; m kA2 2.; m r kA 3.; m r kA2 4.; m √ 5. mkA2.","problemImage":"olympiad-assets/208.jpg"},{"id":"1.8.5","chapter":1,"chapterName":"Механика","topic":"1.8","topicName":"Графики движения","difficulty":"medium","score":3.3,"searchText":"(Всеросс., 2021, МЭ, 9 ) Три точечных тела движутся вдоль оси X. На рисунке показаны графики зависимостей проекции скорости Vx этих тел от времени t, прошедшего с момента начала движения. Расположите номера тел в порядке возрастания пути, пройденного ими за первые 5 с движения (начиная с того тела, которое прошло наименьший путь). 1. 1, 2, 3; 2. 3, 1, 2; 3. 3, 2, 1; 4. 2, 1, 3; 5. 2, 3,1.","problemImage":"olympiad-assets/209.jpg"},{"id":"1.9.7","chapter":1,"chapterName":"Механика","topic":"1.9","topicName":"Баллистика. Координаты","difficulty":"medium","score":3.3,"searchText":"(«Будущие исследователи — будущее науки», 2020, 9 ) При разрыве снаряда на поверхности земли осколки полетели во все стороны с одинаковой скоростью. В точку, находящуюся на расстоянии 250 м от места разрыва, упали два осколка с интервалом 10 с. Под какими углами к горизонту вылетели эти осколки? Чему равен радиус круга всех упавших осколков? Ускорение свободного падения считать равным 10 м/с2.","problemImage":"olympiad-assets/210.jpg"},{"id":"1.31.5","chapter":1,"chapterName":"Механика","topic":"1.31","topicName":"Движение жидкости","difficulty":"medium","score":3.3,"searchText":"(«Надежда энергетики», 2021, 9 ) В плотинах гидроэлектростанций отверстия для подвода воды к гидротурбине имеют специальные заслонки, которые опускаются во время технических работ или аварийных ситуаций. Оцените объем воды, который пройдет через водозаборное отверстие квадратного сечения со стороной a = 5 м после начала опускания заслонки. Заслонка опускается равномерно со скоростью U = 10 см/с. Водозаборное отверстие находится на глубине H = 60 м. Изменением гидростатического давления в пределах отверстия пренебречь. Воду считать идеальной жидкостью.","problemImage":"olympiad-assets/211.jpg"},{"id":"1.23.1","chapter":1,"chapterName":"Механика","topic":"1.23","topicName":"Работа и энергия","difficulty":"medium","score":3.31,"searchText":"(Олимпиада КФУ, 2019, 9 ) Найти минимальную работу, которую нужно совершить для перемещения одного из концов каната массой m и длины L из точки C в точку B, прикладывая силу к одному из концов (см. рис). Расстояние AO и OB равно 1,5L. В точке O имеется закругление, радиус которого много больше толщины каната, но при этом пренебрежимо мал по сравнению с L. Коэффициент трения везде одинаков и равен µ < 1, угол между наклонной поверхностью и горизонталью равен α.","problemImage":"olympiad-assets/212.jpg"},{"id":"1.29.27","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"medium","score":3.31,"searchText":"(«Будущие исследователи — будущее науки», 2021, 9 ) В откачанном от воздуха помещении стоят две заполненные S жидкостью колбы в виде усеченных конусов (см. рис.). На сколько отличаются силы, действующие на жидкость со стороны боковых стенок в этих сосудах? Плотность √ жидкости равна ρ, ускорение свободного падения g. Указание. Объем колбы V = hS(1 + 2/3) ≈ 1,47hS.","problemImage":"olympiad-assets/213.jpg"},{"id":"1.4.1","chapter":1,"chapterName":"Механика","topic":"1.4","topicName":"Вертикальное движение","difficulty":"medium","score":3.32,"searchText":"(Всеросс., 2021, МЭ, 9 ) Камень начинает падать с некоторой высоты без начальной скорости. За последние две секунды полёта средняя скорость камня составила 20 м/с. Ускорение свободного падения равно 10 м/с2. Сопротивлением воздуха можно пренебречь. 1. Чему была равна средняя скорость камня за всё время его падения? Ответ дайте в м/с, округлив до целого числа. 2. С какой высоты падал камень? Ответ дайте в метрах, округлив до целого числа. 3. Чему была равна средняя скорость камня к середине пройденного им пути? Ответ дайте в м/с, округлив до целого числа.","problemImage":"olympiad-assets/214.jpg"},{"id":"2.2.1","chapter":2,"chapterName":"Тепловые явления","topic":"2.2","topicName":"Теплообмен","difficulty":"medium","score":3.32,"searchText":"(Всеросс., 2023, ШЭ, 9 ) В калориметре находилось пол-литра воды при температуре 10 ◦ C. В эту воду поместили алюминиевую деталь массой 200 г, имеющую температуру 90 ◦ C. После установления теплового равновесия температура содержимого калориметра стала равна 14 ◦ C. Удельная теплоёмкость воды 4200 Дж/(кг · ◦ C), алюминия — 920 Дж/(кг · ◦ C), теплоёмкостью калориметра можно пренебречь. 1. Какое количество теплоты получила вода? Ответ дайте в килоджоулях, округлив до десятых долей. 2. Какое количество теплоты отдала деталь? Ответ дайте в килоджоулях, округлив до целого числа. 3. Какое количество теплоты было отдано системой в окружающую среду? Ответ дайте в килоджоулях, округлив до десятых долей.","problemImage":"olympiad-assets/215.jpg"},{"id":"1.7.1","chapter":1,"chapterName":"Механика","topic":"1.7","topicName":"Неравномерное движение","difficulty":"medium","score":3.33,"searchText":"(«Надежда энергетики», 2018, 9 ) Каждый год в НИУ МЭИ проходит «Ночь техники», на которую приезжают старшеклассники. В этом году в учебной лаборатории кафедры физики они наблюдали траекторию движения электронного пучка в электровакуумном приборе под действием электрического и магнитного полей. Школьники поняли, что действие электрического поля приводит к изменению скорости заряженной частицы. После опытов преподаватель предложил им решить следующую задачу: «Тонкое закреплённое металлическое кольцо радиусом R заряжено положительным зарядом. На оси кольца на одинаковых расстояниях R от плоскости кольца располагаются точки А и В. Из точки А в точку В начинает двигаться со скоростью vA отрицательно заряженная частица. Как изменится время движения частицы из точки А в точку В, если заряд частицы изменить на противоположный?» Ответьте на вопрос задачи и объясните ответ.","problemImage":"olympiad-assets/216.jpg"},{"id":"1.9.5","chapter":1,"chapterName":"Механика","topic":"1.9","topicName":"Баллистика. Координаты","difficulty":"medium","score":3.34,"searchText":"(«Будущие исследователи — будущее науки», 2018, 9 ) При взрыве гранаты на поверхности земли осколки полетели во все стороны с одинаковой скоростью V0. Граница области поражения осколками движется по поверхности земли вначале от точки взрыва, затем в обратном направлении. Во сколько раз средняя скорость границы на этапе ее удаления от точки взрыва меньше средней скорости границы на этапе приближения к этой точке?","problemImage":"olympiad-assets/217.jpg"},{"id":"3.1.18","chapter":3,"chapterName":"Электричество","topic":"3.1","topicName":"Электрические цепи","difficulty":"medium","score":3.34,"searchText":"(Всесиб., 2018, 9 ) Цепь, состоящая из последовательно соединенных неидеальных амперметра и вольтметра, подключена к сети. При этом приборы цепи показывают некоторые значения тока J0 и напряжения U0, соответственно. Для определения внутреннего сопротивления амперметра цепь модифицируют, подключая резистор с известным сопротивлением R (см. рисунок). Далее регулируют внешнее напряжение сети так, что в результате показание вольтметра уменьшилось до U0 /3, а амперметра уменьшилось до J0 /5. Чему равно сопротивление амперметра RA?","problemImage":"olympiad-assets/218.jpg"},{"id":"4.4.1","chapter":4,"chapterName":"Оптика","topic":"4.4","topicName":"Тонкие линзы","difficulty":"medium","score":3.34,"searchText":"(Олимпиада КФУ, 2022, 9 ) Точечный источник света находится на главной оптической оси собирающей линзы на расстоянии d > F от линзы, где F — фокусное расстояние линзы (известно). Где за линзой нужно разместить перпендикулярное оптической оси плоское зеркало, чтобы 1. действительное изображение источника совпало с самим источником? 2. отразившиеся от зеркала и повторно прошедшие через линзу лучи образовали параллельный пучок?","problemImage":"olympiad-assets/219.jpg"},{"id":"1.20.3","chapter":1,"chapterName":"Механика","topic":"1.20","topicName":"Движение со связями","difficulty":"hard","score":3.35,"searchText":"(Всесиб., 2017, 9 ) Грузы массой m и 3m связаны лёгкой нерастяжимой нитью, переброшенной через блок массой 2m. Блок тянут вверх с вертикальной силой F. Найдите наибольшее значение F, при котором нить не оборвётся, если разрыв происходит при натяжении нити T. Трения нет.","problemImage":"olympiad-assets/220.jpg"},{"id":"4.4.3","chapter":4,"chapterName":"Оптика","topic":"4.4","topicName":"Тонкие линзы","difficulty":"medium","score":3.35,"searchText":"(«Надежда энергетики», 2015, 9 ) Из куска стекла изготовлены три тонкие линзы одного и того же диаметра. Если сложить линзы вплотную друг к другу без воздушных зазоров, то они образуют плоскопараллельную пластину. Диаметр получившейся пластины равен диаметру линз, оптические оси линз совпадают. Известно, что фокусное расстояние линз 1 и 2, сложенных вместе, равно F12 = −2,5 см, а линз 2 и 3, сложенных вместе, равно F23 = −10 см. Определите фокусное расстояние каждой линзы; нарисуйте эту систему линз и укажите, какие из этих линз собирающие, а какие рассеивающие.","problemImage":"olympiad-assets/221.jpg"},{"id":"2.3.11","chapter":2,"chapterName":"Тепловые явления","topic":"2.3","topicName":"Фазовые переходы","difficulty":"hard","score":3.36,"searchText":"(Олимпиада КФУ, 2020, 9 ) В комнату внесли кусок льда в воде, общей массой 2 кг. И начали записывать температуру этой смеси. Зависимость температуры от времени получилась как на рисунке. Найдите массу куска льда, если cв = 4200 Дж/(кг · ◦ C), λ = 330 кДж/кг.","problemImage":"olympiad-assets/222.jpg"},{"id":"1.4.5","chapter":1,"chapterName":"Механика","topic":"1.4","topicName":"Вертикальное движение","difficulty":"hard","score":3.38,"searchText":"(«Физтех», 2022, 9 ) С высокой башни экспериментатор бросает камень вертикально вверх с начальной скоростью V0 = 10 м/с. После достижения максимальной высоты камень пролетает рядом с экспериментатором и падает вниз на землю. 1. Через какое время t после броска величина скорости камня будет равна 2V0? 2. Найдите путь S, пройденный камнем от момента броска до момента достижения камнем скорости 2V0. Ускорение свободного падения g = 10 м/с2. Сопротивление воздуха не учитывать.","problemImage":"olympiad-assets/223.jpg"},{"id":"1.5.6","chapter":1,"chapterName":"Механика","topic":"1.5","topicName":"Относительность движения","difficulty":"hard","score":3.38,"searchText":"(«Надежда энергетики», 2023, 9 ) Студенческий летний лагерь НИУ «МЭИ» расположен в Крыму недалеко от города Алушта. Однажды студенты отправились на морскую экскурсию на теплоходе. Теплоход двигался с постоянной скоростью v1 = 15 узлов прямолинейным курсом. Студенты увидели в трех милях к югу от теплохода катер, идущий постоянным курсом со скоростью v2 = 26 узлов. Через некоторое время студенты заметили этот катер точно за кормой теплохода, причем в этот момент расстояние между судами стало наименьшим (всего 1,5 мили). Определите курс теплохода. Замечания. 1) 1 узел = 1 миля/час. 2) Курсом судна называется угол между плоскостью меридиана и направлением движения судна.","problemImage":"olympiad-assets/224.jpg"},{"id":"1.28.14","chapter":1,"chapterName":"Механика","topic":"1.28","topicName":"Статика","difficulty":"hard","score":3.38,"searchText":"(Всесиб., 2015, 9 ) Стол веса P0 = 40 Н с квадратной столешницей L×L (L = 1 м) стоит на полу. Его ножки вертикальны и прикреплены к углам столешницы (на рис. они пронумерованы). На стол поставили банку весом P = 30 Н. Расстояние от центра дна банки до одной стороны x = 0,2 м, а до другой y = 0,4 м. При этом между четвёртой ножкой и полом возник небольшой просвет. Найдите силы, с которыми давят на пол остальные ножки.","problemImage":"olympiad-assets/225.jpg"},{"id":"1.28.23","chapter":1,"chapterName":"Механика","topic":"1.28","topicName":"Статика","difficulty":"hard","score":3.38,"searchText":"(«Курчатов», 2023, 9 ) Из тонкой однородной проволоки согнут равнобедренный треугольник ABC. Углы при основании AB равны α = 15◦. Треугольник подвешен на тонкой нити за вершину A и находится в равновесии. Найдите угол β между направлением нити и основанием AB. Числовой ответ выразите в градусах и округлите до десятых.","problemImage":"olympiad-assets/226.jpg"},{"id":"1.29.34","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"hard","score":3.38,"searchText":"(Всесиб., 2015, 9 ) Стакан с малым отверстием сбоку погружён на глубину H в холодную воду. Отверстие ниже уровня воды на h = H/3. Вес воды в стакане P, а сила натяжения нити, на которой подвешен стакан, F = P/75. Воду в стакане начинают нагревать. На какую долю уменьшилась плотность воды в нём, в момент, когда стакан стал всплывать? Уровень и температура воды снаружи неизменны.","problemImage":"olympiad-assets/227.jpg"},{"id":"1.33.4","chapter":1,"chapterName":"Механика","topic":"1.33","topicName":"Сопротивление среды","difficulty":"hard","score":3.38,"searchText":"(Олимпиада КФУ, 2019, 9 ) Однажды у Карлсона, совершавшего дальний перелёт, заглох моторчик и Карлсон стал падать вертикально вниз с постоянной скоростью v1 = 4 м/с. После серьёзного ремонта моторчик опять стал развивать ту же самую постоянную силу тяги и Карлсон совершал вертикальный взлёт со скоростью v2 = 2 м/с. С какой постоянной скоростью он двигался в горизонтальном направлении? Указание: силу сопротивления воздуха считать пропорциональной квадрату скорости Карлсона; Карлсон, будучи в меру упитанным, одинаково обтекаем во всех направлениях.","problemImage":"olympiad-assets/228.jpg"},{"id":"2.4.2","chapter":2,"chapterName":"Тепловые явления","topic":"2.4","topicName":"Теплопроводность","difficulty":"hard","score":3.38,"searchText":"(«Росатом», 2022, 9 ) На столе стоят три цилиндрических сосуда с одинаковой площадью дна. Объемы сосудов V1 = V, V2 = 2V, V3 = 4V. Сосуды до краев заполнены водой. Воду в сосудах нагревают с помощью кипятильника, мощности которого не хватает для того, чтобы ее вскипятить. В первом сосуде воду удается нагреть до температуры t1 = 80 ◦ C, во втором — до температуры t2 = 60 ◦ C. До какой температуры удастся нагреть воду в третьем сосуде с помощью данного кипятильника? Считать, что теплоотдача пропорциональна разности температур воды и окружающей среды и площади кон
