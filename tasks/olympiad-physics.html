<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Олимпиадные задачи по физике для 9 класса в картинках.">
  <title>Олимпиадная физика</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%233b82f6'/%3E%3Cpath d='M18 15v20c0 19 28 19 28 0V15H35v20c0 7-6 7-6 0V15z' fill='white'/%3E%3Cpath d='M18 15h11v9H18zm17 0h11v9H35z' fill='%23f97316'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg:#f3f3ef; --surface:#fff; --surface2:#fafaf8; --text:#1f2030;
      --text2:#52526a; --muted:#8a8a9e; --line:rgba(31,32,48,.11);
      --blue:#3b82f6; --blue-soft:#eff6ff; --orange:#f97316; --orange-soft:#fff7ed;
      --violet:#8b5cf6; --violet-soft:#f5f3ff; --green:#16a34a; --green-soft:#f0fdf4;
      --shadow:0 12px 38px rgba(31,32,48,.08); --shadow-lg:0 28px 90px rgba(31,32,48,.2);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:radial-gradient(circle at 90% 2%,rgba(59,130,246,.1),transparent 29rem),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.55}
    button,input,select{font:inherit}
    button,a{-webkit-tap-highlight-color:transparent}
    :focus-visible{outline:3px solid rgba(59,130,246,.3);outline-offset:2px}
    .topbar{position:sticky;top:0;z-index:40;height:62px;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:0 1.1rem;border-bottom:1px solid var(--line);background:rgba(243,243,239,.92);backdrop-filter:blur(18px)}
    .brand{display:flex;align-items:center;gap:.7rem;font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
    .brand-mark{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:var(--blue);color:#fff;box-shadow:0 8px 20px rgba(59,130,246,.25)}
    .nav-actions{display:flex;align-items:center;gap:.55rem}
    .nav-link,.board-open{min-height:38px;display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .8rem;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.86);color:var(--text2);text-decoration:none;cursor:pointer}
    .nav-link{color:#1d4ed8}
    main{width:min(1160px,calc(100% - 1.5rem));margin:0 auto;padding:2rem 0 5rem}
    .head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1.6rem;align-items:end;margin-bottom:1.4rem}
    .eyebrow{margin-bottom:.55rem;color:var(--blue);font-size:.68rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(2rem,5vw,4rem);line-height:1;letter-spacing:-.05em}
    .intro{max-width:760px;margin:.9rem 0 0;color:var(--text2)}
    .stats{display:grid;grid-template-columns:repeat(3,105px);gap:.5rem}
    .stat{padding:.75rem;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.82);box-shadow:0 6px 18px rgba(31,32,48,.04)}
    .stat span{display:block;color:var(--muted);font-size:.7rem}
    .stat strong{display:block;margin-top:.08rem;font-size:1.25rem}
    .stat.easy strong{color:var(--green)} .stat.medium strong{color:var(--orange)} .stat.hard strong{color:var(--violet)}
    .filters{position:sticky;top:72px;z-index:30;padding:.85rem;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.94);box-shadow:var(--shadow);backdrop-filter:blur(18px)}
    .filter-grid{display:grid;grid-template-columns:minmax(220px,1.5fr) repeat(3,minmax(140px,.65fr));gap:.65rem}
    .field{position:relative}
    .field label{position:absolute;left:.8rem;top:.34rem;color:var(--muted);font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;pointer-events:none}
    .field input,.field select{width:100%;height:52px;padding:1.18rem .8rem .25rem;border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--text);outline:0}
    .field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.09)}
    .filter-foot{display:flex;justify-content:space-between;gap:1rem;margin-top:.65rem;color:var(--muted);font-size:.76rem}
    .reset{border:0;background:transparent;color:var(--blue);font-weight:700;cursor:pointer}
    .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin:1.55rem 0 .8rem}
    .section-head h2{margin:0;font-size:1rem}
    .section-head p{margin:0;color:var(--muted);font-size:.75rem}
    .list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;align-items:start}
    .card{position:relative;overflow:hidden;padding:1rem;border:1px solid var(--line);border-radius:19px;background:var(--surface);box-shadow:0 5px 20px rgba(31,32,48,.045)}
    .card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--green)}
    .card[data-level="medium"]::before{background:var(--orange)} .card[data-level="hard"]::before{background:var(--violet)}
    .card.solved{opacity:.67}
    .card-top{display:flex;align-items:center;flex-wrap:wrap;gap:.45rem;margin-bottom:.75rem}
    .rank,.pid{font-size:.68rem;font-weight:800}.rank{color:var(--muted)}
    .badge{padding:.18rem .55rem;border-radius:999px;font-size:.65rem;font-weight:700}
    .badge.easy{color:#166534;background:var(--green-soft)} .badge.medium{color:#c2410c;background:var(--orange-soft)} .badge.hard{color:#6d28d9;background:var(--violet-soft)}
    .topic{margin-left:auto;color:#2563eb;font-size:.7rem;font-weight:650;text-align:right}
    .problem-image{width:100%;height:auto;display:block;border:1px solid rgba(31,32,48,.08);border-radius:12px;background:#fff}
    .answer-zone{margin-top:.8rem;padding:.9rem;border:1px solid #c7d2fe;border-radius:12px;background:linear-gradient(135deg,var(--violet-soft),#fff)}
    .answer-label{margin-bottom:.55rem;color:#6d28d9;font-size:.67rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
    .answer-image{display:block;max-width:100%;max-height:170px;margin:auto;border-radius:8px;background:#fff;image-rendering:auto}
    .answer-missing{color:var(--muted);font-size:.78rem}
    .card-foot{display:flex;align-items:center;justify-content:space-between;gap:.65rem;margin-top:.8rem;padding-top:.75rem;border-top:1px solid var(--line)}
    .meta{color:var(--muted);font-size:.68rem}
    .done{min-height:34px;padding:.38rem .7rem;border:1px solid var(--line);border-radius:9px;background:var(--surface2);color:var(--text2);font-size:.74rem;cursor:pointer}
    .done.active{border-color:var(--green);background:var(--green-soft);color:#166534}
    .more{width:100%;margin-top:1rem;padding:.85rem;border:1px solid rgba(59,130,246,.25);border-radius:13px;background:var(--blue-soft);color:#1d4ed8;font-weight:700;cursor:pointer}
    .more[hidden],.empty[hidden]{display:none}
    .empty{padding:3rem 1rem;border:1px dashed var(--line);border-radius:18px;background:rgba(255,255,255,.55);color:var(--muted);text-align:center}
    .source-note{margin-top:1rem;padding:.9rem 1rem;border-radius:12px;background:rgba(255,255,255,.6);color:var(--text2);font-size:.77rem}
    #board-fab{position:fixed;right:20px;bottom:20px;z-index:70;width:58px;height:58px;border:0;border-radius:18px;background:var(--blue);color:#fff;box-shadow:0 14px 34px rgba(59,130,246,.35);font-size:1.4rem;cursor:pointer}
    #board{position:fixed;right:20px;bottom:90px;z-index:80;width:min(540px,calc(100vw - 24px));height:min(620px,calc(100vh - 110px));min-width:310px;min-height:300px;display:none;flex-direction:column;overflow:hidden;resize:both;border:1px solid var(--line);border-radius:19px;background:#fff;box-shadow:var(--shadow-lg)}
    #board.show{display:flex} #board.expanded{inset:10px!important;width:auto!important;height:auto!important;resize:none}
    .board-head{display:flex;align-items:center;justify-content:space-between;padding:.7rem .85rem;border-bottom:1px solid var(--line);background:var(--surface2);font-size:.76rem;font-weight:800;cursor:move;user-select:none}
    .board-head div{display:flex;gap:.3rem}.icon{width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:var(--text2);cursor:pointer}.icon:hover{background:var(--blue-soft);color:var(--blue)}
    .tools{display:flex;align-items:center;flex-wrap:wrap;gap:.45rem;padding:.6rem .75rem;border-bottom:1px solid var(--line);background:var(--surface2)}
    .tool,.size,.colour{height:34px;min-width:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}.tool.active,.size.active{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
    .colour{width:25px;min-width:25px;height:25px;border-radius:50%;background:var(--c)}.colour.active{box-shadow:0 0 0 3px white,0 0 0 5px var(--blue)}
    .sep{width:1px;height:22px;background:var(--line)}
    #canvas{width:100%;height:100%;min-height:170px;flex:1;background:#fff;cursor:crosshair;touch-action:none}
    @media(max-width:900px){.head{grid-template-columns:1fr}.filter-grid{grid-template-columns:1fr 1fr}.field.search{grid-column:1/-1}.list{grid-template-columns:1fr}.topic{max-width:65%}}
    @media(max-width:620px){.brand span:last-child{display:none}.nav-link span{display:none}main{width:calc(100% - .8rem);padding-top:1.2rem}.stats{grid-template-columns:repeat(3,1fr);gap:.35rem}.stat{text-align:center;padding:.55rem .35rem}.filters{position:static}.filter-grid{grid-template-columns:1fr}.field.search{grid-column:auto}.card{padding:.8rem}.topic{width:100%;max-width:none;margin-left:0;text-align:left}.board-open{display:none}#board{right:6px;bottom:82px;width:calc(100vw - 12px);height:72vh;resize:none}}
    .portal-access{width:min(1160px,calc(100% - 1.5rem));margin:1rem auto 0;padding:.85rem 1rem;border-left:4px solid var(--orange);border-radius:10px;background:var(--orange-soft);color:#9a3412;font-weight:750}
    .portal-access.closed{margin-top:2rem;padding:1.2rem;border-left-color:#dc2626;background:#fef2f2;color:#991b1b}
    .portal-access a{color:#1d4ed8}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">Φ</span><span>Физика · 9 класс</span></div>
    <nav class="nav-actions">
      <a class="nav-link" id="other-page" href="#"><span>Перейти:</span> <strong id="other-label"></strong></a>
      <button class="board-open" type="button" onclick="openBoard()">✏️ Доска</button>
    </nav>
  </header>
  <main>
    <section class="head">
      <div><div class="eyebrow">Олимпиадная физика · 365 задач</div><h1 id="heading"></h1><p class="intro" id="intro"></p></div>
      <div class="stats"><div class="stat easy"><span>Легко</span><strong id="easy">0</strong></div><div class="stat medium"><span>Средне</span><strong id="medium">0</strong></div><div class="stat hard"><span>Сложно</span><strong id="hard">0</strong></div></div>
    </section>
    <section class="filters" aria-label="Фильтры">
      <div class="filter-grid">
        <div class="field search"><label for="search">Поиск</label><input id="search" type="search" placeholder="Номер или тема"></div>
        <div class="field"><label for="level">Сложность</label><select id="level"><option value="all">Все уровни</option><option value="easy">Легко</option><option value="medium">Средне</option><option value="hard">Сложно</option></select></div>
        <div class="field"><label for="chapter">Раздел</label><select id="chapter"><option value="all">Все разделы</option><option value="1">Механика</option><option value="2">Тепловые явления</option><option value="3">Электричество</option><option value="4">Оптика</option></select></div>
        <div class="field"><label for="order">Порядок</label><select id="order"><option value="difficulty">Сначала лёгкие</option><option value="source">Как в сборнике</option><option value="topic">По темам</option></select></div>
      </div>
      <div class="filter-foot"><span id="summary"></span><button class="reset" id="reset" type="button">Сбросить</button></div>
    </section>
    <section>
      <div class="section-head"><h2 id="section-title"></h2><p>Изображения загружаются по мере просмотра</p></div>
      <div class="list" id="list"></div>
      <div class="empty" id="empty" hidden>По этим фильтрам ничего не найдено.</div>
      <button class="more" id="more" type="button">Показать ещё</button>
      <p class="source-note" id="note"></p>
    </section>
  </main>
  <button id="board-fab" type="button" onclick="toggleBoard()" title="Открыть доску">✏️</button>
  <aside id="board" aria-label="Доска">
    <div class="board-head" id="board-head"><span>✏️ Доска</span><div><button class="icon" id="expand" type="button" onclick="toggleExpand()" title="Развернуть">⤢</button><button class="icon" type="button" onclick="closeBoard()" title="Закрыть">✕</button></div></div>
    <div class="tools">
      <button class="tool active" data-tool="pen" type="button" onclick="setTool(this)" title="Карандаш">✎</button><button class="tool" data-tool="marker" type="button" onclick="setTool(this)" title="Маркер">▰</button><button class="tool" data-tool="eraser" type="button" onclick="setTool(this)" title="Ластик">⌫</button><span class="sep"></span>
      <button class="colour active" data-colour="#1f2030" style="--c:#1f2030" type="button" onclick="setColour(this)" aria-label="Чёрный"></button><button class="colour" data-colour="#2563eb" style="--c:#2563eb" type="button" onclick="setColour(this)" aria-label="Синий"></button><button class="colour" data-colour="#dc2626" style="--c:#dc2626" type="button" onclick="setColour(this)" aria-label="Красный"></button><button class="colour" data-colour="#16a34a" style="--c:#16a34a" type="button" onclick="setColour(this)" aria-label="Зелёный"></button><span class="sep"></span>
      <button class="size active" data-size="3" type="button" onclick="setSize(this)" title="Тонко">·</button><button class="size" data-size="7" type="button" onclick="setSize(this)" title="Толсто">●</button><span class="sep"></span><button class="tool" type="button" onclick="undoBoard()" title="Отменить">↶</button><button class="tool" type="button" onclick="clearBoard()" title="Очистить">🗑</button>
    </div>
    <canvas id="canvas"></canvas>
  </aside>
  <script>
    var CONFIG={"mode": "problems", "title": "Олимпиадная физика — задачи в картинках", "heading": "Задачи в картинках", "intro": "365 задач с формулами, схемами и рисунками. По умолчанию — от простых к сложным.", "otherPage": "../index.html", "otherLabel": "К порталу"};
    var PROBLEMS=[{"id":"1.1.2","chapter":1,"chapterName":"Механика","topic":"1.1","topicName":"Равномерное движение","difficulty":"easy","score":1.33,"searchText":"(Всесиб., 2015, 9 ) Велосипедисты движутся один за другим со скоростью v = 30 км/час. Они проезжают мимо фонарного столба с интервалом времени T0 = 1 минута, а мимо идущего вдоль дороги пешехода с интервалом времени T = 50 секунд. В какую сторону идёт пешеход и с какой скоростью?","problemImage":"olympiad-assets/001.jpg"},{"id":"1.2.1","chapter":1,"chapterName":"Механика","topic":"1.2","topicName":"Средняя скорость","difficulty":"easy","score":1.44,"searchText":"(Всеросс., 2022, ШЭ, 9 ) Материальная точка двигалась вдоль прямой в одном направлении. Точка прошла 1/3 пути со скоростью 10 м/с, а оставшийся путь — со скоростью 5 м/с. Найдите среднюю скорость точки на всём пути. 1. 4 м/c; 2. 6 м/c; 3. 6,7 м/c; 4. 7,5 м/c; 5. 12 м/c.","problemImage":"olympiad-assets/002.jpg"},{"id":"1.2.2","chapter":1,"chapterName":"Механика","topic":"1.2","topicName":"Средняя скорость","difficulty":"easy","score":1.47,"searchText":"(Всеросс., 2023, ШЭ, 9 ) Тело двигалось 2/5 времени с постоянной скоростью 7 м/с, а остальное время с другой постоянной скоростью V. Средняя скорость тела за всё время движения составила 10 м/с. Определите значение скорости V. 1. 5 м/с; 2. 8,5 м/с; 3. 12 м/с; 4. 13 м/с; 5. 15,2 м/с.","problemImage":"olympiad-assets/003.jpg"},{"id":"1.1.8","chapter":1,"chapterName":"Механика","topic":"1.1","topicName":"Равномерное движение","difficulty":"easy","score":1.51,"searchText":"(«Шаг в будущее», 2021, 9 ) На прямолинейной дороге расположены два небольших поселка. Расстояние между поселками L = 12 км. Дорога прямолинейно же продолжается в обе стороны от поселков. Из поселков в противоположные стороны выехали два автомобиля, которые двигались равномерно. Второй автомобиль выехал на τ1 = 30 минут позже первого. Скорость первого из них V1 = 70 км/час. Определите скорость второго автомобиля, если через τ2 = 30 минут от начала его движения расстояние между автомобилями было S = 112 км.","problemImage":"olympiad-assets/004.jpg"},{"id":"1.1.1","chapter":1,"chapterName":"Механика","topic":"1.1","topicName":"Равномерное движение","difficulty":"easy","score":1.53,"searchText":"(«Надежда энергетики», 2017, 9 ) Однажды ранним утром друзья Петя, Катя и Вася пришли на станцию метро, имевшую три одинаковых эскалатора. Первый эскалатор работал на подъём, второй – на спуск, а третий стоял. Ребята спустились на платформу бегом, каждый по своему эскалатору: Петя — по первому, Катя — по второму, Вася — по третьему. Спускаясь, ребята считали пройденные ступеньки. Петя насчитал N1 = 80 ступенек, а Катя — N2 = 48. Сколько ступенек насчитал Вася, если скорости бега Пети и Кати (относительно их эскалаторов) относились как 5: 3?","problemImage":"olympiad-assets/005.jpg"},{"id":"1.13.7","chapter":1,"chapterName":"Механика","topic":"1.13","topicName":"Масса, плотность, давление","difficulty":"easy","score":1.57,"searchText":"(Инженерная олимпиада, 2023, 9 ) Если в пластине объема V просверлить несколько отверстий, масса пластины станет равной m1. Если увеличить количество отверстий в 2 раза, масса пластины станет равной m2. Найти плотность пластины. Все отверстия сквозные, имеют одинаковый диаметр и просверлены перпендикулярно плоскости пластины.","problemImage":"olympiad-assets/006.jpg"},{"id":"1.13.1","chapter":1,"chapterName":"Механика","topic":"1.13","topicName":"Масса, плотность, давление","difficulty":"easy","score":1.63,"searchText":"(Всеросс., 2023, МЭ, 9 ) Школьник нарисовал мелом на горизонтальном асфальте квадрат площадью 9 м2. Чему равна масса «столба» воздуха, расположенного над этим квадратом? Атмосфера простирается вверх на несколько десятков километров, дальше плотность воздуха совсем мала. Барометр на «умных часах» школьника показывает величину атмосферного давления 101320 Па. Ускорение свободного падения равно 10 м/с2. 1. приблизительно 910 т; 2. приблизительно 91 т; 3. приблизительно 9,1 т; 4. приблизительно 910 кг.","problemImage":"olympiad-assets/007.jpg"},{"id":"1.1.4","chapter":1,"chapterName":"Механика","topic":"1.1","topicName":"Равномерное движение","difficulty":"easy","score":1.76,"searchText":"(«Будущие исследователи — будущее науки», 2021, 9 ) Два жучка одновременно начинают движение с равными скоростями по сторонам правильного треугольника: один из вершины, другой с середины стороны (см. рис.). Каким будет минимальное расстояние между жучками, если сторона треугольника равна a?","problemImage":"olympiad-assets/008.jpg"},{"id":"1.1.5","chapter":1,"chapterName":"Механика","topic":"1.1","topicName":"Равномерное движение","difficulty":"easy","score":1.77,"searchText":"(«Будущие исследователи — будущее науки», 2022, 9 ) Два жучка одновременно начинают бежать с равными скоростями из точки A в точку B: один по прямой, другой по полуокружности радиуса R (см. рис.). Каким будет максимальное расстояние между жучками?","problemImage":"olympiad-assets/009.jpg"},{"id":"2.1.3","chapter":2,"chapterName":"Тепловые явления","topic":"2.1","topicName":"Количество теплоты","difficulty":"easy","score":1.79,"searchText":"(Всеросс., 2023, ШЭ, 9 ) На сколько градусов нагреется стальной кубик, если для его нагревания использовать такую же энергию, которая необходима для медленного подъёма этого кубика на высоту 80 м? Удельная теплоёмкость стали 400 Дж/(кг · ◦ C), ускорение свободного падения 10 м/с2. 1. 2 ◦ C; 2. 4 ◦ C; 3. 1 ◦ C; 4. 8 ◦ C.","problemImage":"olympiad-assets/010.jpg"},{"id":"2.1.2","chapter":2,"chapterName":"Тепловые явления","topic":"2.1","topicName":"Количество теплоты","difficulty":"easy","score":1.85,"searchText":"(Всеросс., 2022, ШЭ, 9 ) В чайник налили 2 л воды при комнатной температуре и поставили его на электрическую плиту. Когда через 10 мин вода закипела, в чайник добавили ещё некоторое количество такой же воды. После этого вода вновь закипела через 5 мин. Какой объём воды добавили в чайник? Мощность электрической плиты постоянна, теплопотерями можно пренебречь. 1. 2 л; 2. 4 л; 3. 1 л; 4. 3 л.","problemImage":"olympiad-assets/011.jpg"},{"id":"2.1.1","chapter":2,"chapterName":"Тепловые явления","topic":"2.1","topicName":"Количество теплоты","difficulty":"easy","score":1.87,"searchText":"(Всеросс., 2020, ШЭ, 9 ) Кипятильником подогрели 1 литр воды. На рисунке изображены показания термометра, погружённого в воду, в начале и в конце нагревания. Какое количество теплоты получила вода? Тепловыми потерями пренебречь. Удельная теплоемкость воды cв = 4200 Дж/(кг ·◦ C). А) 4200 Дж Б) 8400 Дж В) 29400 Дж Г) 42000 Дж Д) 63000 Дж","problemImage":"olympiad-assets/012.jpg"},{"id":"4.1.2","chapter":4,"chapterName":"Оптика","topic":"4.1","topicName":"Световые лучи","difficulty":"easy","score":1.92,"searchText":"(«Будущие исследователи — будущее науки», 2016, 9 ) Камень брошен со скоростью V0 под углом 30◦ к горизонту навстречу солнечным лучам (см. рис.). Найти ускорение, с которым тень от камня движется по земле. Через какое время скорость тени окажется равной скорости камня? Ускорение свободного падения g считать известным.","problemImage":"olympiad-assets/013.jpg"},{"id":"1.2.3","chapter":1,"chapterName":"Механика","topic":"1.2","topicName":"Средняя скорость","difficulty":"easy","score":1.97,"searchText":"(Всеросс., 2020, ШЭ, 9 ) Автомобиль двигался в одну сторону по прямой дороге и первую половину времени ехал со скоростью 80 км/ч, затем четверть всего времени движения — со скоростью 50 км/ч и оставшееся время — со скоростью 70 км/ч. 1. Найдите среднюю скорость автомобиля на первой половине пути. Ответ укажите в км/ч, округлив до целого числа. 2. Найдите среднюю скорость всего движения. Ответ укажите в км/ч, округлив до целого числа. 3. Определите пройденный автомобилем путь, если со скоростью 80 км/ч он двигался в течение 45 мин. Ответ укажите в км, округлив до целого числа.","problemImage":"olympiad-assets/014.jpg"},{"id":"1.13.2","chapter":1,"chapterName":"Механика","topic":"1.13","topicName":"Масса, плотность, давление","difficulty":"easy","score":2.01,"searchText":"(Всеросс., 2022, МЭ, 9 ) Однажды Скрудж Макдак нашёл необычное сокровище, которое снаружи выглядело как куб, сделанный из чистого золота. Но оказалось, что внутри золотого куба есть полость, тоже в форме куба, заполненная серебром. Средняя плотность сокровища оказалась равной 12000 кг/м3, тогда как плотность золота равна 19300 кг/м3, а плотность серебра 10500 кг/м3. Стенки золотой части сокровища имеют везде одинаковую толщину h. Найдите отношение толщины стенок h к длине ребра L всего сокровища. Ответ округлите до сотых долей.","problemImage":"olympiad-assets/015.jpg"},{"id":"1.13.8","chapter":1,"chapterName":"Механика","topic":"1.13","topicName":"Масса, плотность, давление","difficulty":"easy","score":2.01,"searchText":"(«Будущие исследователи — будущее науки», 2020, 9 ) В цилиндрический сосуд, на дне которого лежит куб, начинают наливать воду. График зависимости высоты h уровня воды в сосуде от объема V налитой воды приведен на рисунке. Найти плотность материала куба.","problemImage":"olympiad-assets/016.jpg"},{"id":"4.1.1","chapter":4,"chapterName":"Оптика","topic":"4.1","topicName":"Световые лучи","difficulty":"easy","score":2.03,"searchText":"(Всеросс., 2023, ШЭ, 9 ) Вдоль двух сторон улицы шириной 20 м, идущей строго с запада на восток, стоят два вертикальных забора. Один забор — каменный — имеет высоту 3 м, а другой забор — плетень — имеет высоту 1,5 м. В момент, когда солнце находится строго на юге, каменный забор отбрасывает тень длиной 2 м. Тень какой длины в этот момент отбрасывает плетень? 1. 33 см; 2. 50 см; 3. 75 см; 4. 100 см; 5. 200 см.","problemImage":"olympiad-assets/017.jpg"},{"id":"1.13.6","chapter":1,"chapterName":"Механика","topic":"1.13","topicName":"Масса, плотность, давление","difficulty":"easy","score":2.04,"searchText":"(Инженерная олимпиада, 2022, 9 ) Известно, что при приготовлении смеси некоторых жидкостей объем смеси не равен сумме объемов отдельных компонент. В частности, при смешивании воды и спирта объем смеси меньше суммы объемов воды и спирта. Смешали два одинаковых объема воды и спирта так, что получился 1 литр смеси, который весит 936 г. При этом 1 литр чистого спирта весит 729 г, а 1 литр чистой воды — 1 кг. Какие массы воды и спирта смешали?","problemImage":"olympiad-assets/018.jpg"},{"id":"1.15.4","chapter":1,"chapterName":"Механика","topic":"1.15","topicName":"Гравитация","difficulty":"easy","score":2.04,"searchText":"(«Физтех», 2022, 9 ) Спутник обращается по круговой орбите вокруг планеты. Высота орбиты h = 0,5R, здесь R — радиус планеты. Плотность планеты ρ. Гравитационная постоянная G. Объём шара V = 43 πR3. 1. Найдите ускорение g свободного падения на расстоянии 2R от центра планеты. 2. Найдите период T обращения спутника.","problemImage":"olympiad-assets/019.jpg"},{"id":"1.3.2","chapter":1,"chapterName":"Механика","topic":"1.3","topicName":"Равноускоренное движение","difficulty":"easy","score":2.05,"searchText":"(«Шаг в будущее», 2021, 9 ) Самолет Ан-2, производя равноускоренный разбег от нулевой начальной скорости до взлетной, прошел расстояние s = 180 м за время t = 4,5 с. Определите время одного оборота колеса основного шасси, когда самолет прошел четверть пути разбега. Диаметр колеса равен D = 0,86 м.","problemImage":"olympiad-assets/020.jpg"},{"id":"1.14.2","chapter":1,"chapterName":"Механика","topic":"1.14","topicName":"Законы Ньютона","difficulty":"easy","score":2.05,"searchText":"(«Надежда энергетики», 2015, 9 ) Два истребителя совершают полёт над океаном вдоль экватора с одной и той же скоростью v = 1296 км/час: первый — с запада на восток, а второй — с востока на запад. На сколько отличается вес пластиковой бутылки с водой массой m = 1 кг на первом самолёте от её веса на втором? При расчёте примите, что ветер отсутствует, а высота полёта обоих самолётов постоянна и пренебрежимо мала по сравнению с радиусом Земли.","problemImage":"olympiad-assets/021.jpg"},{"id":"1.2.4","chapter":1,"chapterName":"Механика","topic":"1.2","topicName":"Средняя скорость","difficulty":"easy","score":2.06,"searchText":"(Всеросс., 2022, МЭ, 9 ) Первую четверть пути тело прошло со скоростью в 1000 раз меньшей, чем оставшиеся 3/4 пути. Во сколько раз больше средняя скорость на всём пути, чем скорость на первой четверти пути? Ответ округлите до целого числа.","problemImage":"olympiad-assets/022.jpg"},{"id":"4.1.4","chapter":4,"chapterName":"Оптика","topic":"4.1","topicName":"Световые лучи","difficulty":"easy","score":2.06,"searchText":"(«Формула Единства» / «Третье тысячелетие», 2022, 9 ) В городах А и Б расположены телевизионные вышки высотой соответственно hA = 100 м и hБ = 170 м. Широты городов ΦА = 40,5◦ и ΦБ = 33,5◦ северной широты. Проводятся многочисленные (с точностью до 1 см) измерения длины тени каждой из вышек. Определите, самая короткая тень от какой из вышек будет короче. Примечание. Напомним, что наклон экватора к орбите составляет Φ = 23,5◦.","problemImage":"olympiad-assets/023.jpg"},{"id":"1.14.1","chapter":1,"chapterName":"Механика","topic":"1.14","topicName":"Законы Ньютона","difficulty":"easy","score":2.13,"searchText":"(«Надежда энергетики», 2020, 9 ) На Открытой московской инженерной конференции школьников «Потенциал», которая ежегодно проходит в НИУ «МЭИ», учащиеся 9-го класса демонстрировали экспериментальную установку для изучения законов идеального газа. В вертикальном сосуде они поместили тяжёлый поршень, который мог перемещаться практически без трения. Под поршнем в сосуде находился воздух, давление которого отличалось от атмосферного. В начальный момент поршень был закреплён. После освобождения поршня он начинал перемещаться с некоторым ускорением. Школьники пытались определить, изменится ли величина этого ускорения, если на поршень положить груз. Какой результат они получили? Объясните свой ответ.","problemImage":"olympiad-assets/024.jpg"},{"id":"2.1.7","chapter":2,"chapterName":"Тепловые явления","topic":"2.1","topicName":"Количество теплоты","difficulty":"easy","score":2.14,"searchText":"(«Шаг в будущее», 2021, 9 ) Имеются два электрических кипятильника и одинаковые калориметры с водой одинаковой начальной температуры. Первый кипятильник нагревает некоторое количество воды до начала кипения за t1 = 6 мин, а второй кипятильник нагревает вдвое большее количество воды до начала кипения за t2 = 18 мин. За какое время удастся довести воду в калориметре до кипения, если нагревание проводить, используя оба кипятильника одновременно, а масса воды в три раза больше, чем в первом опыте? Потерями энергии пренебречь.","problemImage":"olympiad-assets/025.jpg"},{"id":"1.16.2","chapter":1,"chapterName":"Механика","topic":"1.16","topicName":"Сила упругости","difficulty":"easy","score":2.15,"searchText":"(Всеросс., 2021, ШЭ, 9 ) В лаборатории есть две одинаковые невесомые пружины. Первую пружину приклеили левым концом к стене, а к правому концу приложили силу 2F, направленную вдоль пружины. Вторую пружину растянули с двух концов, действуя на них в противоположные стороны одинаковыми силами F. Сила упругости: 1. больше у первой пружины; 2. больше у второй пружины; 3. одинакова у обеих пружин; 4. недостаточно данных для сравнения сил упругости.","problemImage":"olympiad-assets/026.jpg"},{"id":"2.1.8","chapter":2,"chapterName":"Тепловые явления","topic":"2.1","topicName":"Количество теплоты","difficulty":"easy","score":2.15,"searchText":"(«Росатом», 2023, 9 ) Если в сосуд с очень горячей водой поместить работающий нагреватель, то температура воды повышается на ∆T = 1 ◦ C за время t. Если мощность нагревателя увеличить вдвое, за то же время t вода нагревается на 2,1∆T. На сколько нагреется вода в сосуде за время t, если мощность нагревателя увеличить втрое по сравнению с первоначальной?","problemImage":"olympiad-assets/027.jpg"},{"id":"3.1.2","chapter":3,"chapterName":"Электричество","topic":"3.1","topicName":"Электрические цепи","difficulty":"easy","score":2.17,"searchText":"(Всеросс., 2020, ШЭ, 9 ) В электрической цепи, схема которой изображена на рисунке, напряжение источника U = 10 В, а показание первого вольтметра (V1 ) составляет U1 = 4 В. Определите показание второго вольтметра (V2 ). Все вольтметры одинаковые. А) 10 В Б) 6 В В) 3 В Г) 1,5 В Д) 0","problemImage":"olympiad-assets/028.jpg"},{"id":"4.2.1","chapter":4,"chapterName":"Оптика","topic":"4.2","topicName":"Отражение света. Плоское зеркало","difficulty":"easy","score":2.17,"searchText":"(«Надежда энергетики», 2020, 9 ) Через небольшое окно в южной стене в темную комнату проходит пучок солнечного света, параллельный восточной и западной стенам, и попадает на большое горизонтальное плоское зеркало, лежащее на столе. На зеркале вертикально укреплён непрозрачный квадрат, который отбрасывает тень на северную стену. Определите площадь тени, если длина стороны квадрата 9 см.","problemImage":"olympiad-assets/029.jpg"},{"id":"2.1.5","chapter":2,"chapterName":"Тепловые явления","topic":"2.1","topicName":"Количество теплоты","difficulty":"easy","score":2.19,"searchText":"(Инженерная олимпиада, 2021, 9 ) В лабораторный стакан (допускающий кипячение воды) налили воду из резервуара и включили нагреватель. Через время t1 = 5 минут вода закипела. Тогда в стакан из резервуара добавили еще ложку воды, и температура воды в стакане уменьшилась на ∆T = 5 ◦ C, но через t2 = 20 секунд вода в стакане закипела снова. Найти температуру воды в резервуаре. Теплопотерями пренебречь. Температура кипения воды Tк = 100 ◦ C.","problemImage":"olympiad-assets/030.jpg"},{"id":"2.1.6","chapter":2,"chapterName":"Тепловые явления","topic":"2.1","topicName":"Количество теплоты","difficulty":"easy","score":2.21,"searchText":"(«Надежда энергетики», 2016, 9 ) При нагревании на примусе кастрюли с некоторым количеством воды и одним яйцом на ∆t градусов расходуется m = 40 г топлива. В k = 5/4 раз больше топлива расходуется при нагреве на те же ∆t градусов той же кастрюли на том же примусе с тем же количеством воды и двумя яйцами. Сколько граммов топлива потребуется для нагрева на те же ∆t градусов на том же примусе той же кастрюли с тем же количеством воды без яиц? Во всех трёх процессах кипение воды не происходит.","problemImage":"olympiad-assets/031.jpg"},{"id":"1.1.6","chapter":1,"chapterName":"Механика","topic":"1.1","topicName":"Равномерное движение","difficulty":"easy","score":2.24,"searchText":"(«Будущие исследователи — будущее науки», 2023, 9 ) Два жучка одновременно начинают движение со скоростью V по сторонам квадрата: один из вершины, другой с середины стороны (см. рис.). Через какое время расстояние между жучками достигнет минимального значения? Чему равно это значение? Длина стороны квадрата равна a.","problemImage":"olympiad-assets/032.jpg"},{"id":"1.4.2","chapter":1,"chapterName":"Механика","topic":"1.4","topicName":"Вертикальное движение","difficulty":"easy","score":2.24,"searchText":"(Всесиб., 2016, 9 ) Шарики, находящиеся на одной вертикали, одновременно отпустили с высоты h и 10h. Нижний после упругих столкновений с полом столкнулся с верхним шариком. Через какое время от момента, когда шарики отпустили, это произошло? Ускорение свободного падения g.","problemImage":"olympiad-assets/033.jpg"},{"id":"1.1.9","chapter":1,"chapterName":"Механика","topic":"1.1","topicName":"Равномерное движение","difficulty":"easy","score":2.25,"searchText":"(Всесиб., 2022, 9 ) Круглый участок с периметром длиной L = 90 м окружен забором, который состоял из 9 одинаковых секций. Каждую четную секцию удалили. Однажды хозяин стал выгуливать собаку вдоль забора. У столба, находящегося между первой и последней секциями забора, он спустил собаку с поводка. Она пролезла через небольшую дыру в секции и побежала вдоль забора (с внутренней стороны) против часовой стрелки со скоростью u = 4,8 км/ч. Хозяин пошел (с внешней стороны забора) по часовой стрелке со скоростью v = 4,2 км/ч. Через какое время после старта хозяин впервые повстречается со своей собакой и возьмет ее на поводок? Разницей длины замкнутого пути внутри и вне забора пренебречь. Ответ привести в минутах.","problemImage":"olympiad-assets/034.jpg"},{"id":"1.15.3","chapter":1,"chapterName":"Механика","topic":"1.15","topicName":"Гравитация","difficulty":"easy","score":2.25,"searchText":"(Олимпиада КФУ, 2019, 9 ) Инженер Левшов изобрел машину, способную двигаться с постоянной скоростью V = 36 км/ч в вертикальном направлении, если стартовать с экватора. В машину встроена система безопасности, которая остановит её, если перестанет ощущать притяжение к Земле. Через сколько времени это произойдет? Радиус Земли R = 6400 км.","problemImage":"olympiad-assets/035.jpg"},{"id":"3.1.3","chapter":3,"chapterName":"Электричество","topic":"3.1","topicName":"Электрические цепи","difficulty":"easy","score":2.25,"searchText":"(Всеросс., 2020, МЭ, 9 ) На рисунке изображена схема электрической цепи. Какие лампочки в этой цепи не будут гореть? А) только 4 Б) только 2 В) 1, 3 и 5 Г) 2 и 4 Д) ни одна не будет гореть","problemImage":"olympiad-assets/036.jpg"},{"id":"1.13.10","chapter":1,"chapterName":"Механика","topic":"1.13","topicName":"Масса, плотность, давление","difficulty":"easy","score":2.26,"searchText":"(Всесиб., 2017, 9 ) Цилиндрический сосуд закрыт подвижным поршнем, который находится на расстоянии 2h от его дна. На расстоянии h от дна сосуд перегорожен закрепленной мембраной, которая свободно пропускает молекулы водорода и непроницаема для молекул кислорода. В сосуде находится 1 г газообразного водорода, а объем между мембраной и дном содержит 1 г газообразного кислорода. Между мембраной и поршнем кислорода нет. На сколько нужно сместить поршень вправо, чтобы в объёме между дном сосуда и мембраной число молекул водорода стало вдвое больше числа молекул кислорода? Масса молекулы кислорода в 16 раз больше массы молекулы водорода. Газ равномерно заполняет доступный ему объём.","problemImage":"olympiad-assets/037.jpg"},{"id":"4.2.5","chapter":4,"chapterName":"Оптика","topic":"4.2","topicName":"Отражение света. Плоское зеркало","difficulty":"easy","score":2.29,"searchText":"(Всеросс., 2023, МЭ, 9 ) Как изменится угол между падающим и отражённым лучами света, если угол падения уменьшится на 10◦? 1. уменьшится на 5◦; 2. уменьшится на 10◦; 3. уменьшится на 20◦; 4. не изменится.","problemImage":"olympiad-assets/038.jpg"},{"id":"4.2.4","chapter":4,"chapterName":"Оптика","topic":"4.2","topicName":"Отражение света. Плоское зеркало","difficulty":"easy","score":2.3,"searchText":"(Всеросс., 2020, МЭ, 9 ) Под каким углом α к горизонту нужно расположить плоское зеркало для того, чтобы горизонтальный пучок света после отражения от этого зеркала стал вертикальным? А) 30 Б) 45 В) 60 Г) 90 Д) невозможно определить","problemImage":"olympiad-assets/039.jpg"},{"id":"1.13.9","chapter":1,"chapterName":"Механика","topic":"1.13","topicName":"Масса, плотность, давление","difficulty":"easy","score":2.31,"searchText":"(Олимпиада КФУ, 2019, 9 ) Согласно закону Дюлонга и Пти теплоемкость большинства твердых тел (при не очень низких температурах) на 1 атом составляет приблизительно 3k, где k = 1,38 · 10−23 Дж/K — постоянная Больцмана. Рассчитайте плотность и оцените удельную теплоемкость кристаллической поваренной соли, если расстояние между соседними атомами хлора равно a = 0,5639 нм (см. рис.). Молярная масса натрия 22,99 г/моль, хлора 35,45 г/моль.","problemImage":"olympiad-assets/040.jpg"},{"id":"1.1.10","chapter":1,"chapterName":"Механика","topic":"1.1","topicName":"Равномерное движение","difficulty":"easy","score":2.32,"searchText":"(Всесиб., 2023, 9 ) Когда на кольцевой транспортер выгрузили чемодан прибывшего c самолета пассажира, пассажир направился вдоль транспортера против его движения. Пройдя таким образом некоторый путь за время t1, он поравнялся со своим чемоданом, но не успел его ухватить, и с прежней скоростью направился в противоположную сторону, пытаясь догнать чемодан. Через время t2 чемодан второй раз оказался напротив пассажира, и он его взял. Какой путь проделал пассажир и его чемодан? Длина транспортера L, время его полного обращения T. Пассажир двигался вперед и назад с одинаковой постоянной скоростью. Отличием траектории пассажира и чемодана пренебречь.","problemImage":"olympiad-assets/041.jpg"},{"id":"1.5.1","chapter":1,"chapterName":"Механика","topic":"1.5","topicName":"Относительность движения","difficulty":"easy","score":2.32,"searchText":"(Всеросс., 2020, ШЭ, 9 ) Эскалатор метро движется вверх со скоростью 0,75 м/с. Параллельно ему движется вниз с такой же скоростью другой эскалатор. С какой скоростью относительно эскалатора, едущего вверх, должен идти человек, чтобы быть неподвижным относительно пассажиров, стоящих на эскалаторе, который движется вниз? А) 0 м/с Б) 0,375 м/с В) 0,75 м/с Г) 1,5 м/с Д) 2,25 м/с","problemImage":"olympiad-assets/042.jpg"},{"id":"1.29.1","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"easy","score":2.32,"searchText":"(Всеросс., 2021, ШЭ, 9 ) В сосуде с ртутью плавает стальной шарик. Как изменится глубина погружения шарика в ртуть, если сверху на ртуть налить воду? Ртуть и вода не смешиваются друг с другом. 1. Увеличится; 2. уменьшится; 3. не изменится.","problemImage":"olympiad-assets/043.jpg"},{"id":"3.1.1","chapter":3,"chapterName":"Электричество","topic":"3.1","topicName":"Электрические цепи","difficulty":"easy","score":2.32,"searchText":"(Всеросс., 2021, ШЭ, 9 ) Сопротивления всех резисторов в цепи, схема которой показана на рисунке, одинаковы. Напряжение идеальной батарейки равно 3 В, а идеальный амперметр показывает силу тока 10 мА. Чему равно сопротивление одного резистора? 1. 50 Ом; 2. 100 Ом; 3. 150 Ом; 4. 200 Ом.","problemImage":"olympiad-assets/044.jpg"},{"id":"1.2.5","chapter":1,"chapterName":"Механика","topic":"1.2","topicName":"Средняя скорость","difficulty":"easy","score":2.34,"searchText":"(«Шаг в будущее», 2023, 9 ) Водитель находится в точке A шоссейного кольца вокруг города (КАД). Ему надо попасть в противоположную точку диаметра КАД. Но так как диаметр закрыт на ремонт, навигатор предложил ехать по кольцу (в любую сторону). Также в точке C можно свернуть на хорду, длина которой составляет 2/3 диаметра, однако время в пути, при этом, окажется тем же. Во сколько раз средняя скорость движения по кольцу выше средней скорости движения по хорде? Движение по кольцу можно считать равномерным.","problemImage":"olympiad-assets/045.jpg"},{"id":"1.14.4","chapter":1,"chapterName":"Механика","topic":"1.14","topicName":"Законы Ньютона","difficulty":"easy","score":2.36,"searchText":"(«Курчатов», 2021, 9 ) Пассажирский поезд движется по дугообразному участку железной дороги, равномерно замедляя скорость. Длина участка равна S, а время, необходимое поезду, чтобы проехать по нему, равно t. После прохождения участка направление поезда изменилось на угол ϕ, в начале участка скорость поезда была в α раз больше, чем в конце участка. Найдите связь между массой пассажира m, сидящего в поезде, и весом пассажира P в момент, когда поезд находится в середине участка. Найдите массу пассажира, если P = 840 Н, S = 1,5 км, t = 60 с, α = 1,5, ϕ = 60◦ и g = 9,8 м/с2.","problemImage":"olympiad-assets/046.jpg"},{"id":"1.29.3","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"easy","score":2.36,"searchText":"(Всеросс., 2023, ШЭ, 9 ) В аквариуме плавает игрушечная лодочка с оловянным солдатиком в качестве пассажира. Как изменится уровень воды в аквариуме, если солдатик упадёт в аквариум? Лодка не переворачивается. 1. уменьшится; 2. увеличится; 3. не изменится.","problemImage":"olympiad-assets/047.jpg"},{"id":"1.1.7","chapter":1,"chapterName":"Механика","topic":"1.1","topicName":"Равномерное движение","difficulty":"easy","score":2.37,"searchText":"(Всесиб., 2020, 9 ) Два поезда движутся в одном направлении по одним рельсам, с одинаковой и постоянной скоростью. Между ними находится дрезина. В некоторый момент времени оказалось, что поезд сзади приблизился к дрезине на опасно короткую дистанцию, и она увеличила скорость до v1. Затем, через время t1, обнаружилось, что дрезина опасно сблизилась с поездом впереди, и она уменьшила скорость до v2. После этого через время t2 дрезина снова сблизилась с поездом, идущим сзади. С какой скоростью двигались поезда? Дистанцией между дрезиной и поездом при их максимальном сближении пренебречь.","problemImage":"olympiad-assets/048.jpg"},{"id":"1.3.3","chapter":1,"chapterName":"Механика","topic":"1.3","topicName":"Равноускоренное движение","difficulty":"easy","score":2.37,"searchText":"(Всесиб., 2018, 9 ) Перед входом в длинный тоннель стоит электропоезд, длина которого меньше длины тоннеля. На светофоре загорелся зеленый свет, и электропоезд начал равноускоренно двигаться в течение всего времени наблюдения. Через время t1 он полностью вошел в тоннель. Определите время τ, в течение которого электропоезд полностью находился в тоннеле, если из тоннеля он выходил в течение времени t2.","problemImage":"olympiad-assets/049.jpg"},{"id":"1.23.3","chapter":1,"chapterName":"Механика","topic":"1.23","topicName":"Работа и энергия","difficulty":"easy","score":2.39,"searchText":"(«Формула Единства» / «Третье тысячелетие», 2020, 9 ) В струбцине зажата пружина жёсткостью 500 Н/м. Пружина не деформирована. Прикладывая к концу рычага винта силу 0,8 Н, его повернули 5 раз. Каков КПД струбцины в этом процессе? Примечание. Потенциальная энергия пружины ищется по формуле E = k · x2 /2, где k — жёсткость пружины, а x — изменение её длины. Масштаб чертежа — в 1 клетке 4 см.","problemImage":"olympiad-assets/050.jpg"},{"id":"1.1.3","chapter":1,"chapterName":"Механика","topic":"1.1","topicName":"Равномерное движение","difficulty":"easy","score":2.4,"searchText":"(«Надежда энергетики», 2022, 9 ) Горизонтальный стол с идеально гладкой поверхностью имеет размеры 182×387 см. Стол со всех сторон огорожен вертикальными идеально упругими бортиками. По столу могут прямолинейно и равномерно двигаться шайбы диаметром 2 см. Первая шайба в начальный момент времени располагается в положении A (касаясь двух бортиков стола одновременно) и начинает движение со скоростью 5 м/с под углом 45◦ к бортику (см. рис). Вторая шайба стартует из того же положения A через 1 с в том же направлении. Определите минимальную скорость второй шайбы, при которой она успеет догнать первую шайбу до того момента, когда первая шайба коснется двух бортиков одновременно. Считать, что столкновения шайб с бортиками происходят по принципу «угол падения равен углу отражения», а модуль скорости при этом не изменяется.","problemImage":"olympiad-assets/051.jpg"},{"id":"2.1.11","chapter":2,"chapterName":"Тепловые явления","topic":"2.1","topicName":"Количество теплоты","difficulty":"easy","score":2.4,"searchText":"(Всесиб., 2019, 9 ) Из водопроводного крана с небольшим постоянным расходом течет вода с температурой T0. Электрический чайник наполняется этой водой за время t1. Если наполненный доверху чайник включить, он нагревает воду до температуры T1 за время t2. Какая температура установится в полном чайнике, если его включить и поставить под кран, позволяя лишней воде перетекать через край? Вода в чайнике перемешивается. Мощность чайника постоянная и потери его энергии во внешнюю среду пренебрежимо малы.","problemImage":"olympiad-assets/052.jpg"},{"id":"1.14.3","chapter":1,"chapterName":"Механика","topic":"1.14","topicName":"Законы Ньютона","difficulty":"easy","score":2.42,"searchText":"(«Формула Единства» / «Третье тысячелетие», 2023, 9 ) Два пиратских корабля, находящиеся на экваторе, поделив добычу, стали двигаться один строго на запад, а второй строго на восток с одинаковыми по модулю скоростями v = 20 км/час относительно Земли. Каждому кораблю досталось ровно по m = 100 килограммов золота (взвешивание производилось с помощью рычажных весов на покоящихся относительно Земли кораблях). По прошествии некоторого времени взвешивание повторили уже на движущихся судах, используя точные электронные весы. Определите, на сколько показания весов будут отличаться на корабле, идущем на запад, от показаний весов, движущихся с кораблём на восток. Примечание. Считайте Землю шаром с продолжительностью суток T = 24 часа, g = = 10 м/с2.","problemImage":"olympiad-assets/053.jpg"},{"id":"1.4.3","chapter":1,"chapterName":"Механика","topic":"1.4","topicName":"Вертикальное движение","difficulty":"easy","score":2.43,"searchText":"(Всесиб., 2020, 9 ) Мяч радиуса R бросают с некоторой скоростью вертикально вверх. Затем из той же точки с той же скоростью вертикально вверх бросают второй такой же мяч, и мячи, двигаясь в противоположных направлениях, сталкиваются с относительной скоростью v. Определите разницу модулей скоростей второго и первого мяча непосредственно перед столкновением. Ускорение свободного падения g.","problemImage":"olympiad-assets/054.jpg"},{"id":"1.16.3","chapter":1,"chapterName":"Механика","topic":"1.16","topicName":"Сила упругости","difficulty":"easy","score":2.43,"searchText":"(Всеросс., 2022, ШЭ, 9 ) Три пружины длиной 10 см каждая соединили параллельно. Жёсткости пружин равны 100 Н/м, 100 Н/м и 200 Н/м соответственно. 1. Определите жёсткость такой системы пружин. Ответ выразите в Н/м, округлив до целого числа. 2. Чему будет равно удлинение каждой из пружин, если их левые концы закрепить, а к правым концам прикладывать силу 10 Н? Ответ выразите в сантиметрах, округлив до десятых долей.","problemImage":"olympiad-assets/055.jpg"},{"id":"3.1.13","chapter":3,"chapterName":"Электричество","topic":"3.1","topicName":"Электрические цепи","difficulty":"easy","score":2.43,"searchText":"(«Будущие исследователи — будущее науки», 2019, 9 ) При поочередном подключении двух вольтметров к одному и тому же источнику напряжения стрелка одного отклонилась на полную шкалу, а другого — на треть шкалы. При подключении к тому же источнику этих вольтметров, соединенных последовательно, стрелка одного из них отклонилась на треть шкалы. На какую часть шкалы отклонилась стрелка другого вольтметра?","problemImage":"olympiad-assets/056.jpg"},{"id":"1.21.4","chapter":1,"chapterName":"Механика","topic":"1.21","topicName":"Импульс","difficulty":"medium","score":2.45,"searchText":"(«Надежда энергетики», 2023, 9 ) Для активного отдыха придумано много развлечений. Самые смелые могут испытать себя в полетах над морем на флайборде. Определите, какую мощность развивает двигатель флайборда по выбросу воды в тот момент, когда человек неподвижно зависает над поверхностью воды. Скорость истечения воды v. Масса человека вместе с водометом равна M.","problemImage":"olympiad-assets/057.jpg"},{"id":"1.9.2","chapter":1,"chapterName":"Механика","topic":"1.9","topicName":"Баллистика. Координаты","difficulty":"medium","score":2.46,"searchText":"(Олимпиада КФУ, 2019, 9 ) С самолета, летящего на высоте h0 со скоростью v0, выпал предмет. На какой высоте его скорость будет направлена под углом α к горизонту? Трение не учитывать.","problemImage":"olympiad-assets/058.jpg"},{"id":"2.1.12","chapter":2,"chapterName":"Тепловые явления","topic":"2.1","topicName":"Количество теплоты","difficulty":"medium","score":2.46,"searchText":"(«Надежда энергетики», 2018, 9 ) На какую максимальную высоту можно c помощью тепловой машины поднять груз массой 10 кг, если охладить его на ∆T = 0,1 K и использовать отданное им тепло для нагревания рабочего тела этой машины? Количество теплоты, отданное рабочим телом машины окружающей среде, составляет 3/4 от количества теплоты, полученного им от нагревателя. Теплоемкость груза C = 4000 Дж/К. • Теплообмен. 8 • Теплообмен. 9–11","problemImage":"olympiad-assets/059.jpg"},{"id":"1.11.3","chapter":1,"chapterName":"Механика","topic":"1.11","topicName":"Движение по окружности","difficulty":"medium","score":2.47,"searchText":"(«Надежда энергетики», 2020, 9 ) Внутреннее кольцо шарикоподшипника радиусом R = 4 см закреплено на оси O токарного станка. Внешнее кольцо подшипника закреплено неподвижно на корпусе станка. Шарики подшипника имеют радиус r = 1 см и катятся по внутреннему и внешнему кольцам без проскальзывания. Сколько оборотов вокруг оси O сделают шарики за время одного оборота внутреннего кольца?","problemImage":"olympiad-assets/060.jpg"},{"id":"1.17.2","chapter":1,"chapterName":"Механика","topic":"1.17","topicName":"Сила трения","difficulty":"medium","score":2.47,"searchText":"(Всесиб., 2015, 9 ) Ящик с массой m = 100 кг стоит на расстоянии L = 164 см от стены. В течении времени T = 4 с его толкают к стене горизонтальной силой F = 420 Н. Сила трения, действующая на ящик, f = 400 Н. Достигнет ли ящик стены, а если достигнет, то какую скорость будет иметь перед ударом о неё?","problemImage":"olympiad-assets/061.jpg"},{"id":"3.1.6","chapter":3,"chapterName":"Электричество","topic":"3.1","topicName":"Электрические цепи","difficulty":"medium","score":2.47,"searchText":"(Всеросс., 2022, МЭ, 9 ) В электрической цепи, схема которой изображена на рисунке, R = 3 кОм, показание амперметра I = 1 мА. Чему равна цена деления идеального вольтметра, если его стрелка отклонилась на 30 делений? 1. 10 мВ/дел; 2. 100 мВ/дел; 3. 1 В/дел; 4. 10 В/дел; 5. 90 В/дел.","problemImage":"olympiad-assets/062.jpg"},{"id":"1.17.1","chapter":1,"chapterName":"Механика","topic":"1.17","topicName":"Сила трения","difficulty":"medium","score":2.49,"searchText":"(«Надежда энергетики», 2015, 9 ) На горизонтальном столе лежат кубик и чертёжный прямоугольный треугольник. Треугольник своей гипотенузой касается одной из боковых граней кубика. Треугольник начинают двигать поступательно по столу с постоянной скоростью u, перпендикулярной катету, образующему с гипотенузой угол α √ = 45, толкая кубик. Коэффициент трения между кубиком и треугольником равен µ = 1/ 3. Найдите скорость движения кубика v.","problemImage":"olympiad-assets/063.jpg"},{"id":"1.15.2","chapter":1,"chapterName":"Механика","topic":"1.15","topicName":"Гравитация","difficulty":"medium","score":2.5,"searchText":"(Олимпиада КФУ, 2019, 9 ) Пользуясь данными о размерах планет и давлении атмосферы у поверхности, вычислить массы атмосфер Венеры, Земли и Марса. Средний радиус R Венеры 6052 км, Земли — 6371 км, Марса — 3390 км. Давление у поверхности Венеры в 92 раза больше земного, давление у поверхности Марса — в 160 раз меньше земного. Атмосферное давление на Земле PЗ = 105 Па. 2 /g = 5,2 · 1018 кг; M 2 20 кг; M 2 16 кг MАЗ = PЗ 4πRЗ з АВ = PВ 4πRВ /gВ = 4,8 · 10 АМ = PМ 4πRМ /gМ = 2,4 · 10","problemImage":"olympiad-assets/064.jpg"},{"id":"4.1.3","chapter":4,"chapterName":"Оптика","topic":"4.1","topicName":"Световые лучи","difficulty":"medium","score":2.51,"searchText":"(«Росатом», 2021, 9 ) Тело бросают с поверхности земли под углом α к горизонту со скоростью v. Светит Солнце, и солнечные лучи падают под углом β к горизонту (β < α), причем солнечные лучи лежат в плоскости траектории тела (см. рис.). Какой путь пройдет тень от тела на земле к моменту его падения? Сопротивлением воздуха и угловыми размерами Солнца пренебречь.","problemImage":"olympiad-assets/065.jpg"},{"id":"4.2.10","chapter":4,"chapterName":"Оптика","topic":"4.2","topicName":"Отражение света. Плоское зеркало","difficulty":"medium","score":2.54,"searchText":"(«Надежда энергетики», 2018, 9 ) Два плоских зеркала, расположенных вертикально, образуют прямой угол. Муха летит горизонтально так, что ее скорость v направлена в ребро угла и образует угол α = 30◦ с одним из зеркал. Сколько своих отражений видит муха и с какими скоростями относительно неё они движутся? 3v 3 изображения; v1 = v; v2 = 2v; v3 =","problemImage":"olympiad-assets/066.jpg"},{"id":"1.31.2","chapter":1,"chapterName":"Механика","topic":"1.31","topicName":"Движение жидкости","difficulty":"medium","score":2.55,"searchText":"(«Надежда энергетики», 2023, 9 ) В плотине ГЭС на глубине h ниже уровня воды в водохранилище сделан водоотводный канал, площадь поперечного сечения которого равна S. Определите, на сколько изменится сила давления воды на плотину ГЭС, если водоотвод перекрыть заслонкой.","problemImage":"olympiad-assets/067.jpg"},{"id":"1.16.8","chapter":1,"chapterName":"Механика","topic":"1.16","topicName":"Сила упругости","difficulty":"medium","score":2.56,"searchText":"(Всесиб., 2018, 9 ) Две надетых на легкую незакрепленную спицу бусинки с одинаковой массой m связаны нитью и недеформированной пружиной одинаковой длины 2L и лежат на горизонтальном столе (на рисунке вид сверху). С какой горизонтальной силой нужно тянуть за середину нити, чтобы нить и пружина образовали правильный треугольник? Жесткость пружины k, трения нет.","problemImage":"olympiad-assets/068.jpg"},{"id":"1.9.4","chapter":1,"chapterName":"Механика","topic":"1.9","topicName":"Баллистика. Координаты","difficulty":"medium","score":2.57,"searchText":"(«Будущие исследователи — будущее науки», 2017, 9 ) Под каким углом к горизонту было брошено тело, если бросок произошел в момент t = 0 и в моменты t1 и t2 скорость тела равнялась половине начальной?","problemImage":"olympiad-assets/069.jpg"},{"id":"1.11.1","chapter":1,"chapterName":"Механика","topic":"1.11","topicName":"Движение по окружности","difficulty":"medium","score":2.57,"searchText":"(Олимпиада КФУ, 2021, 9 ) Машина едет по плоской круговой траектории с постоянной скоростью таким образом, что внутреннее колесо движется по окружности радиусом R = 10 м. Расстояние между левым и правым колесом d = 1,75 м. Найдите отношение угловых скоростей внутреннего и внешнего передних колес. Колеса не проскальзывают.","problemImage":"olympiad-assets/070.jpg"},{"id":"3.1.10","chapter":3,"chapterName":"Электричество","topic":"3.1","topicName":"Электрические цепи","difficulty":"medium","score":2.57,"searchText":"(«Будущие исследователи — будущее науки», 2016, 9 ) Цепь из четырех одинаковых резисторов с сопротивлением R, амперметра с пренебрежимо малым сопротивлением и вольтметра с очень большим сопротивлением подключена к источнику с напряжением U (см. рис.). Найти показания амперметра и вольтметра.","problemImage":"olympiad-assets/071.jpg"},{"id":"1.3.4","chapter":1,"chapterName":"Механика","topic":"1.3","topicName":"Равноускоренное движение","difficulty":"medium","score":2.58,"searchText":"(Всесиб., 2022, 9 ) Автомобиль вначале разгонялся из неподвижного состояния с постоянным ускорением, а затем двигался с достигнутой максимальной скоростью V. Средняя скорость при этом равна u. Какую часть времени автомобиль двигался равноускоренно?","problemImage":"olympiad-assets/072.jpg"},{"id":"1.15.5","chapter":1,"chapterName":"Механика","topic":"1.15","topicName":"Гравитация","difficulty":"medium","score":2.58,"searchText":"(«Физтех», 2022, 9 ) У двух планет Альфа-1 и Альфа-2 одинаковые радиусы R, а плотности планет равны, соответственно, ρ1 = ρ и ρ2 = 2ρ. Гравитационная постоянная G. Объём шара V = 34 πR3. 1. Найдите ускорение g свободного падения на расстоянии 4R от центра планеты Альфа-1. 2. Найдите отношение T2 /T1 периодов обращения спутников, которые движутся по круговым орбитам вокруг данных планет. Высоты орбит спутников равны, соответственно h1 = 0,5R и h2 = 1,5R.","problemImage":"olympiad-assets/073.jpg"},{"id":"2.3.1","chapter":2,"chapterName":"Тепловые явления","topic":"2.3","topicName":"Фазовые переходы","difficulty":"medium","score":2.59,"searchText":"(Всеросс., 2021, ШЭ, 9 ) В калориметр, содержащий 200 г льда при температуре −15 ◦ C, налили 1 литр воды при температуре +85 ◦ C. Удельная теплоёмкость льда 2100 Дж/(кг · ◦ C), удельная теплоёмкость воды 4200 Дж/(кг · ◦ C), удельная теплота плавления льда 340 кДж/кг. После установления теплового равновесия в калориметре будет находиться: 1. только вода; 2. только лёд; 3. смесь воды со льдом.","problemImage":"olympiad-assets/074.jpg"},{"id":"4.3.1","chapter":4,"chapterName":"Оптика","topic":"4.3","topicName":"Преломление света","difficulty":"medium","score":2.6,"searchText":"(Олимпиада КФУ, 2019, 9 ) В водоем на некоторую глубину помещают источник белого света. Показатель преломления воды для красных лучей nкр = 1,328, для фиолетовых nф = 1,335. Вычислите отношение радиусов кругов, в пределах которых возможен выход красных и фиолетовых лучей в воздух.","problemImage":"olympiad-assets/075.jpg"},{"id":"2.1.9","chapter":2,"chapterName":"Тепловые явления","topic":"2.1","topicName":"Количество теплоты","difficulty":"medium","score":2.61,"searchText":"(Инженерная олимпиада, 2022, 9 ) В бензиновом двигателе каждую минуту сгорает ∆m = 20 г бензина. Одна четверть выделившейся теплоты идет на совершение двигателем работы, три четверти выделяются в виде тепла. Охлаждение двигателя осуществляется водой, текущей по трубке с площадью поперечного сечения ∆S = 1 см2, опоясывающей двигатель. В установившемся режиме разность температур воды на входе и выходе из трубки равна ∆t = 20 ◦ C. Считая, что все выделяющееся тепло поглощается охлаждающей водой, найти скорость воды в трубке. Удельная теплота сгорания бензина q = 4,6 · 107 Дж/кг, удельная теплоемкость воды c = 4,2 · 103 Дж/(кг · К).","problemImage":"olympiad-assets/076.jpg"},{"id":"1.18.1","chapter":1,"chapterName":"Механика","topic":"1.18","topicName":"Связанные тела","difficulty":"medium","score":2.63,"searchText":"(Всесиб., 2016, 9 ) Грузы масс m и 3m находятся на горизонтальном столе. Они связаны нерастяжимой нитью, проходящей через блоки на краях отверстия в столе и блок, на котором подвешен груз массы 2m. Найдите ускорение груза массы 2m, если трения нет, блоки и нить невесома, ускорение свободного падения g. Влиянием воздуха пренебречь.","problemImage":"olympiad-assets/077.jpg"},{"id":"1.33.2","chapter":1,"chapterName":"Механика","topic":"1.33","topicName":"Сопротивление среды","difficulty":"medium","score":2.66,"searchText":"(«Будущие исследователи — будущее науки», 2022, 9 ) Один шар массы m равномерно всплывает в вязкой жидкости, а другой, имеющий равный с ним радиус и массу 2m, равномерно погружается в этой жидкости с той же скоростью. Какой будет сила натяжения нити, если скрепить ею шары и поместить их в ту же жидкость? Ускорение свободного падения равно g.","problemImage":"olympiad-assets/078.jpg"},{"id":"3.1.12","chapter":3,"chapterName":"Электричество","topic":"3.1","topicName":"Электрические цепи","difficulty":"medium","score":2.66,"searchText":"(«Будущие исследователи — будущее науки», 2018, 9 ) В приведенной на рисунке 1 схеме сопротивления резисторов одинаковы, напряжение источника равно 24 В и каждый из вольтметров показывает 6 В. Какими будут показания вольтметров, если их включить так, как показано на рисунке 2?","problemImage":"olympiad-assets/079.jpg"},{"id":"1.29.2","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"medium","score":2.67,"searchText":"(Всеросс., 2022, ШЭ, 9 ) В пустую симметричную вертикальную U -образную трубку наливают ртуть. Затем в правое колено трубки аккуратно наливают керосин, высота столба которого оказывается равной 62,5 см. Найдите массу воды, которую необходимо добавить в левое колено, чтобы уровень ртути вернулся в первоначальное положение. Площадь поперечного сечения трубки 15 см2, плотность керосина 800 кг/м3. 1. 750 г; 2. 150 г; 3. 15 г; 4. 45 г; 5. 125 г.","problemImage":"olympiad-assets/080.jpg"},{"id":"3.1.15","chapter":3,"chapterName":"Электричество","topic":"3.1","topicName":"Электрические цепи","difficulty":"medium","score":2.67,"searchText":"(«Будущие исследователи — будущее науки», 2022, 9 ) В приведенной на рисунке цепи известны сопротивления четырех резисторов и токи в двух из них. Найти сопротивление пятого резистора и полный ток, проходящий через цепь.","problemImage":"olympiad-assets/081.jpg"},{"id":"1.16.1","chapter":1,"chapterName":"Механика","topic":"1.16","topicName":"Сила упругости","difficulty":"medium","score":2.69,"searchText":"(Всеросс., 2020, ШЭ, 9 ) На рисунке изображён график зависимости силы упругости пружины Fпр от её деформации ∆x. Чему равен коэффициент жёсткости этой пружины? А) 1 Н/м Б) 4 Н/м В) 8 Н/м Г) 25 Н/м Д) 50 Н/м","problemImage":"olympiad-assets/082.jpg"},{"id":"2.3.10","chapter":2,"chapterName":"Тепловые явления","topic":"2.3","topicName":"Фазовые переходы","difficulty":"medium","score":2.69,"searchText":"(Всесиб., 2020, 9 ) В воду с температурой T0 = 0 ◦ C опускают небольшое холодное тело с плотностью ρ и удельной теплоемкостью C. Какой должна быть начальная температура тела, чтобы оно всплыло? Теплота плавления льда λ, плотность воды ρ0, плотность льда ρ = 0,9ρ0.","problemImage":"olympiad-assets/083.jpg"},{"id":"2.2.2","chapter":2,"chapterName":"Тепловые явления","topic":"2.2","topicName":"Теплообмен","difficulty":"medium","score":2.7,"searchText":"(Всеросс., 2020, МЭ, 9 ) В первом стакане находилась холодная вода, а во втором — вдвое большая масса горячей воды. Когда из первого стакана перелили некоторую массу воды во второй стакан, то установившаяся температура воды в нём оказалась на 1 ◦ C меньше исходной. После этого из второго стакана такую же массу воды вернули обратно в первый стакан. На сколько градусов Цельсия повысилась температура воды в первом стакане после установления теплового равновесия? Теплообменом воды с окружающими телами можно пренебречь. Ответ округлите до целого числа.","problemImage":"olympiad-assets/084.jpg"},{"id":"1.8.1","chapter":1,"chapterName":"Механика","topic":"1.8","topicName":"Графики движения","difficulty":"medium","score":2.71,"searchText":"(Всеросс., 2021, ШЭ, 9 ) Точечное тело движется вдоль оси X. На рисунке представлен график зависимости координаты X этого тела от времени t. Какой путь прошло тело за 6 с движения? 1. 2 м; 2. 8 м; 3. 16 м; 4. 26 м; 5. 30 м.","problemImage":"olympiad-assets/085.jpg"},{"id":"1.15.1","chapter":1,"chapterName":"Механика","topic":"1.15","topicName":"Гравитация","difficulty":"medium","score":2.71,"searchText":"(«Надежда энергетики», 2016, 9 ) В НИУ «МЭИ» проводятся «университетские субботы» — научно-познавательные лекции и занятия со школьниками. Одна из таких встреч состоялась на кафедре физики и была посвящена законам механики. При обсуждении закона всемирного тяготения школьникам задали вопрос: «Как известно, на все тела на Земле действует сила притяжения со стороны Солнца. Днём эта сила вычитается из силы притяжения тел к Земле, а ночью складывается с ней. Означает ли это, что ночью все тела на Земле весят больше, чем днём?» Сможете ли вы повторить правильный ответ, который дали будущие студенты МЭИ?","problemImage":"olympiad-assets/086.jpg"},{"id":"3.1.16","chapter":3,"chapterName":"Электричество","topic":"3.1","topicName":"Электрические цепи","difficulty":"medium","score":2.71,"searchText":"(«Будущие исследователи — будущее науки», 2023, 9 ) Цепь, составленная из резисторов с сопротивлениями R и 2R и амперметров с пренебрежимо малыми сопротивлениями, подключена к источнику с напряжением U (см. рис.). Найти показания амперметров.","problemImage":"olympiad-assets/087.jpg"},{"id":"1.12.2","chapter":1,"chapterName":"Механика","topic":"1.12","topicName":"Кривизна траектории","difficulty":"medium","score":2.72,"searchText":"(«Шаг в будущее», 2023, 9 ) Диаметр колеса обозрения 16 м. Из какой точки C на прямой AB нужно бросить мячик, чтобы он сдул пылинку с крыши кабинки в верхней точке колеса, обладая наименышей необходимой для этого начальной скоростью? В качестве ответа найдите длину отрезка CM.","problemImage":"olympiad-assets/088.jpg"},{"id":"3.1.11","chapter":3,"chapterName":"Электричество","topic":"3.1","topicName":"Электрические цепи","difficulty":"medium","score":2.72,"searchText":"(«Будущие исследователи — будущее науки», 2017, 9 ) В схеме, приведенной на рисунке, все резисторы имеют одинаковое сопротивление 70 Ом и к точкам B и C подведено постоянное напряжение. Амперметр с пренебрежимо малым сопротивлением показывает ток 1 А. Какое напряжение покажет вольтметр с очень большим сопротивлением, если его включить вместо амперметра?","problemImage":"olympiad-assets/089.jpg"},{"id":"1.1.12","chapter":1,"chapterName":"Механика","topic":"1.1","topicName":"Равномерное движение","difficulty":"medium","score":2.73,"searchText":"(«Надежда энергетики», 2019, 9 ) Основной объект любой железнодорожной сортировочной станции — «сортировочная горка». Для формирования различных поездов локомотив толкает на горку состав из требуемых вагонов. Вагоны на вершине горки отцепляются по одному и затем скатываются с горки самостоятельно, распределяясь по разным путям с помощью стрелочных переводов. На свой сортировочный путь вагон попадает, двигаясь по инерции. Каждый такой путь закачивается тупиковой призмой с расположенным на ней пружинным упором. Пусть по одному сортировочному пути в какой-то момент едут в направлении тупика N = 5 одинаковых вагонов. Расстояние от тупика до ближайшего вагона 200 м, до второго 500 м, до следующих 800 м, 900 м и 1500 м соответственно. Скорости вагонов в этот момент равны 9 км/ч; 21,6 км/ч; 28,8 км/ч; 32,4 км/ч; 54 км/ч соответственно. Определите, на каком расстоянии от тупика будут находиться вагоны и какие у них будут скорости, когда самый дальний от тупика вагон будет на том же месте, что и в начальный момент (1500 м от тупика), но будет удаляться от тупика. Считать столкновения вагонов с тупиковым упором и между собой абсолютно упругими, сопротивлением движению и размерами вагонов пренебречь. При абсолютно упругом лобовом соударении тел одинаковой массы они обмениваются своими скоростями, причем и по модулю, и по направлению. При взаимодействии с пружинным упором вагон меняет направление своего движения на противоположное, сохраняя модуль скорости. Расстояния: 300, 700, 800, 900, 1500 метров; скорости: 9 км/ч; 21,6 км/ч; 28,8 км/ч; 32,4 км/ч; 54 км/ч","problemImage":"olympiad-assets/090.jpg"},{"id":"1.6.1","chapter":1,"chapterName":"Механика","topic":"1.6","topicName":"Упругое отражение","difficulty":"medium","score":2.73,"searchText":"(«Надежда энергетики», 2021, 9 ) На стадионе НИУ «МЭИ» «Энергия» есть площадки для игры в бадминтон. Одноклассники Петя и Катя ходят по вечерам в безветренную погоду заниматься любимым видом спорта. Обычно игру начинает Катя. После её подачи волан приближается к Пете со скоростью v = 10 м/с. Петя бьёт по волану ракеткой, расположенной перпендикулярно его движению, со скоростью u = 30 м/с. Найдите скорость волана сразу после удара Пети.","problemImage":"olympiad-assets/091.jpg"},{"id":"2.1.4","chapter":2,"chapterName":"Тепловые явления","topic":"2.1","topicName":"Количество теплоты","difficulty":"medium","score":2.73,"searchText":"(Всеросс., 2020, МЭ, 9 ) Три тела одинаковой массы, изготовленные из разных материалов, греются нагревателями одинаковой мощности. Графики зависимости температуры t этих тел от времени t показаны на рисунке. Удельная теплоёмкость первого тела равна c. Потери теплоты пренебрежимо малы. Чему равны удельные теплоёмкости второго и третьего тел соответственно? А) 2c и 2c/3 Б) 3c и 0,5c В) 0,5c и 1,5c Г) 1,5c и 0,5c Д) 2c/3 и 2c/3","problemImage":"olympiad-assets/092.jpg"},{"id":"1.21.2","chapter":1,"chapterName":"Механика","topic":"1.21","topicName":"Импульс","difficulty":"medium","score":2.74,"searchText":"(«Надежда энергетики», 2018, 9 ) Два мячика брошены из одной точки так, что их импульсы p~1 и p~2 перпендикулярны друг другу. В некоторый момент времени импульс первого мячика становится равным p~01 = −~p1, а модуль импульса второго становится равным p02 = 5p1. Определите отношение модулей начальных импульсов, если масса второго мячика в два раза больше массы первого. Силой сопротивления воздуха можно пренебречь.","problemImage":"olympiad-assets/093.jpg"},{"id":"1.21.5","chapter":1,"chapterName":"Механика","topic":"1.21","topicName":"Импульс","difficulty":"medium","score":2.75,"searchText":"(Олимпиада КФУ, 2019, 9 ) Снаряд разлетелся в середине большой комнаты на 3 осколка с одинаковыми массами и скоростями. Один осколок продолжил движение в том же направлении, два других разлетелись в вертикальной плоскости под углом 60 градусов друг к другу. Осколок летевший прямо ударился в стену через время t1, а время между приземлением двух других осколков равно τ. Когда один из осколков коснулся потолка, скорость его была направлена горизонтально. Все удары упругие. Найти длину и высоту комнаты.","problemImage":"olympiad-assets/094.jpg"},{"id":"1.35.1","chapter":1,"chapterName":"Механика","topic":"1.35","topicName":"Механические колебания и волны","difficulty":"medium","score":2.76,"searchText":"(Всеросс., 2020, МЭ, 9 ) Скорый поезд приближается к станции, двигаясь прямолинейно с неизменной скоростью. Машинист дал свисток продолжительностью 10 с, но стоящий на станции пассажир слышал этот свисток в течение 9 с. Найдите скорость движения поезда, если скорость звука в воздухе 340 м/с, ветра нет. Ответ выразите в м/с и округлите до целого числа.","problemImage":"olympiad-assets/095.jpg"},{"id":"1.14.5","chapter":1,"chapterName":"Механика","topic":"1.14","topicName":"Законы Ньютона","difficulty":"medium","score":2.77,"searchText":"(«Курчатов», 2022, 9 ) На концах трех жестких невесомых стержней длиной L = 12 см каждый закреплены три одинаковых по размеру маленьких шарика массами m, 2m и 3m, где m = 110 г. Противоположные концы стержней соединены между собой в одной точке, вокруг которой они могут свободно вращаться. Первоначально вся система неподвижно лежит на гладкой горизонтальной поверхности; все углы между соседними стержнями равны 2π/3. Коротким ударом шарику массой 3m сообщают скорость v0 = 4 м/c, направленную перпендикулярно соответствующему стержню и параллельно поверхности. Найдите ускорения всех трех шариков сразу после удара, считая их отличными от нуля.","problemImage":"olympiad-assets/096.jpg"},{"id":"1.31.1","chapter":1,"chapterName":"Механика","topic":"1.31","topicName":"Движение жидкости","difficulty":"medium","score":2.78,"searchText":"(«Надежда энергетики», 2017, 9 ) Совсем скоро наступит весна, и замёрзшие зимой реки начнут освобождаться от льда — на реках наступит ледоход. Если с берега вы будете наблюдать ледоход на прямом участке достаточно широкой реки, то обнаружите удивительное явление: отколовшиеся друг от друга большие льдины плывут по течению и медленно вращаются на поверхности воды, хотя не сталкиваются друг с другом. Как вы объясните этот эффект?","problemImage":"olympiad-assets/097.jpg"},{"id":"3.2.1","chapter":3,"chapterName":"Электричество","topic":"3.2","topicName":"Вычисление сопротивлений","difficulty":"medium","score":2.78,"searchText":"(Всеросс., 2022, ШЭ, 9 ) Три резистора соединили в электрическую цепь, схема которой показана на рисунке, и подключили к идеальному источнику постоянного напряжения. Определите общее сопротивление этой цепи. 1. 1 Ом; 2. 1,2 Ом; 3. 4 Ом; 4. 6 Ом; 5. 18 Ом.","problemImage":"olympiad-assets/098.jpg"},{"id":"4.2.11","chapter":4,"chapterName":"Оптика","topic":"4.2","topicName":"Отражение света. Плоское зеркало","difficulty":"medium","score":2.78,"searchText":"(Олимпиада КФУ, 2023, 9 ) Луч лазера, проходящий в плоскости рисунка, падает на двугранный угол, образованный двумя зеркалами, под углом α к горизонтали. Изначально зеркала образуют прямой угол: первое зеркало вертикально, второе горизонтально. В момент t = 0 первое зеркало начинает поворачиваться относительно ребра двугранного угла с постоянной угловой скоростью ω. Через какое время луч лазера впервые дважды отразится от первого зеркала?","problemImage":"olympiad-assets/099.jpg"},{"id":"1.1.11","chapter":1,"chapterName":"Механика","topic":"1.1","topicName":"Равномерное движение","difficulty":"medium","score":2.79,"searchText":"(«Росатом», 2023, 9 ) Два тела одновременно начинают двигаться из одной точки с постоянными (и одинаковыми) скоростями v: одно — по окружности радиуса R, проходящей через эту точку, второе — по диаметру этой окружности (см. рис.). Через какое время после начала движения расстояние между телами будет максимальным? Чему равно максимальное расстояние между телами? Ограничиться рассмотрением промежутка времени, в течение которого второе тело прошло вдоль диаметра.","problemImage":"olympiad-assets/100.jpg"},{"id":"1.21.3","chapter":1,"chapterName":"Механика","topic":"1.21","topicName":"Импульс","difficulty":"medium","score":2.79,"searchText":"(«Надежда энергетики», 2022, 9 ) Два тела, массы которых равны m1 и m2 = 2m1, начинают двигаться в поле силы тяжести. В начальный момент времени их скорости взаимно перпендикулярны и равны, соответственно, v1 = 3 м/с и v2 = 4 м/с. Через некоторый промежуток времени скорость первого тела стала равна нулю. Найдите скорость второго тела через тот же промежуток времени. Сила сопротивления движению отсутствует.","problemImage":"olympiad-assets/101.jpg"},{"id":"3.1.4","chapter":3,"chapterName":"Электричество","topic":"3.1","topicName":"Электрические цепи","difficulty":"medium","score":2.79,"searchText":"(Всеросс., 2021, МЭ, 9 ) В состав электрической цепи входят идеальный амперметр A, неидеальный вольтметр V, реостат R и источник напряжения U (см. рис.). Стрелкой ↑ обозначается увеличение показаний прибора, а стрелкой ↓ — уменьшение. Как изменятся показания приборов, если в этой цепи заменить идеальный амперметр на неидеальный, а неидеальный вольтметр — на идеальный? 1. A — ↑, V — ↑; 2. A — ↓, V — ↓; 3. A — ↑, V — ↓; 4. A — ↓, V — ↑; 5. показания обоих приборов не изменятся.","problemImage":"olympiad-assets/102.jpg"},{"id":"1.13.5","chapter":1,"chapterName":"Механика","topic":"1.13","topicName":"Масса, плотность, давление","difficulty":"medium","score":2.8,"searchText":"(Инженерная олимпиада, 2021, 9 ) В атомных реакторах на быстрых нейтронах выгодно обеспечить максимальную объемную долю топлива. Топливо загружается в реактор в виде вертикальных цилиндрических стержней (см. рисунок, вид сверху; показано сечение одной ячейки активной зоны реактора — или треугольной (слева) или квадратной (справа), круги — сечения топливных стержней). Какая из компоновок реактора — с ячейкой в виде квадрата или равностороннего треугольника — лучше удовлетворяет этому требованию? Найдите объемную долю топлива в реакторах с треугольной или квадратной ячейкой, если диаметр топливных стержней d, сторона ячейки (и треугольной, и квадратной) a.","problemImage":"olympiad-assets/103.jpg"},{"id":"1.24.1","chapter":1,"chapterName":"Механика","topic":"1.24","topicName":"Консервативные системы","difficulty":"medium","score":2.8,"searchText":"(«Шаг в будущее», 2023, 9 ) Длинный тонкий рулон раскатан в лист и лежит на ровном горизонтальном полу. Длина рулона x, ширина l, толщина h, плотность ρ. К концу рулона приклеили трубку массы M. К трубке приложили резкое усилие, в результате чего она покатилась. В итоге весь рулон плотно намотался на трубку и в этот момент движение прекратилось. Чему равна начальная кинетическая энергия трубки? Внешний диаметр трубки ничтожен по сравнению с диаметром намотавшегося на нее рулона, а сам рулон нерастяжим, но изгибается без усилия.","problemImage":"olympiad-assets/104.jpg"},{"id":"1.25.2","chapter":1,"chapterName":"Механика","topic":"1.25","topicName":"Упругие взаимодействия","difficulty":"medium","score":2.8,"searchText":"(«Формула Единства» / «Третье тысячелетие», 2021, 9 ) Железное ядро массы m налетает со скоростью v0 на торец полого цилиндра, внутри которого находится мягкий пластилиновый шарик. Масса цилиндра равна M, а шарика — M/2. Найдите скорость цилиндра после соударения с ядром, когда движение пластилинового шарика относительно цилиндра прекратится. Примечание. Соударение ядра с цилиндром абсолютно упругое; поверхность стола, на которой находится цилиндр, абсолютно гладкая.","problemImage":"olympiad-assets/105.jpg"},{"id":"1.28.10","chapter":1,"chapterName":"Механика","topic":"1.28","topicName":"Статика","difficulty":"medium","score":2.82,"searchText":"(Олимпиада КФУ, 2023, 9 ) Однородная балка длины L и массы M подвешена на трех идентичных невесомых пружинах, как показано на рисунке. На каком расстоянии l от левого конца балки нужно подвесить груз массой m, чтобы балка была строго горизонтальной?","problemImage":"olympiad-assets/106.jpg"},{"id":"1.35.3","chapter":1,"chapterName":"Механика","topic":"1.35","topicName":"Механические колебания и волны","difficulty":"medium","score":2.82,"searchText":"(Всеросс., 2023, МЭ, 9 ) Летучая мышь летит параллельно вертикальной стене широкого и глубокого горного ущелья со скоростью 45 м/с. Она издаёт ко
