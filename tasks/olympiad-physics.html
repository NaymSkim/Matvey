:"olympiad-assets/327.jpg"},{"id":"1.28.19","chapter":1,"chapterName":"Механика","topic":"1.28","topicName":"Статика","difficulty":"hard","score":3.99,"searchText":"(«Курчатов», 2021, 9 ) Тонкий стержень длины a = 1 м лежит в неподвижной сфере радиуса R = 2 м так, что один конец находится в нижней точке сферы P. Сфера гладкая за исключением окрестности точки P много меньшей длины стержня. Найдите минимальный коэффициент трения в окрестности точки P, при котором такое положение стержня возможно.","problemImage":"olympiad-assets/328.jpg"},{"id":"3.4.8","chapter":3,"chapterName":"Электричество","topic":"3.4","topicName":"Мощность тока","difficulty":"hard","score":4,"searchText":"(Инженерная олимпиада, 2022, 9 ) При фотографировании в помещении с двумя фотолампами с ограниченным ресурсом работы используется следующая методика работы. При наводке на резкость, выборе экспозиции и т. д. лампы включают не на полную мощность (последовательно), а при фотографировании лампы включают параллельно, обеспечивая максимальную освещенность фотографируемого объекта. Предложите такую схему соединения двух ламп, чтобы лампы были подключены к источнику последовательно, но при включении одного выключателя их соединение с источником менялось на параллельное. Во сколько раз возрастает освещенность объекта при таком переключении? Считать, что вся энергия, выделяющаяся в лампочках, превращается в свет. В распоряжении имеются один идеальный источник электрического напряжения, две одинаковых электрических лампы, один двухполюсный выключатель и провода. Двухполюсный выключатель одновременно замыкает или размыкает два провода (см. рисунок).","problemImage":"olympiad-assets/329.jpg"},{"id":"1.9.18","chapter":1,"chapterName":"Механика","topic":"1.9","topicName":"Баллистика. Координаты","difficulty":"hard","score":4.01,"searchText":"(«Курчатов», 2022, 9 ) Вова участвует в соревнованиях по стрельбе из лука, где ему нужно поразить цель на расстоянии L = 200 м. Под каким углом α к горизонту Вова должен стрелять из лука, чтобы попасть точно в середину мишени? При натяжении лука работа Вовы равна A = 500 Дж, КПД лука η = 0,17. Масса стрелы m = 54 г. В момент выстрела стрела находится на h = 70 см выше центра мишени. Сопротивлением воздуха пренебречь. Ускорение свободного падения g = 9,8 м/с2.","problemImage":"olympiad-assets/330.jpg"},{"id":"1.28.21","chapter":1,"chapterName":"Механика","topic":"1.28","topicName":"Статика","difficulty":"hard","score":4.01,"searchText":"(«Физтех», 2023, 9 ) Однородный стержень опирается на шероховатый горизонтальный пол и гладкую ступеньку (см. рис.). Стержень находится в покое. Масса стержня m = 10 кг. Точка B, где стержень касается ступеньки, делит длину стержня в отношении AB/BC = 2, угол α = 60◦. 1. Найдите модуль P силы, с которой стержень действует на гладкую ступеньку. 2. При каких значениях коэффициента µ трения скольжения стержень будет находиться в покое? Ускорение свободного падения g = 10 м/с2.","problemImage":"olympiad-assets/331.jpg"},{"id":"2.3.9","chapter":2,"chapterName":"Тепловые явления","topic":"2.3","topicName":"Фазовые переходы","difficulty":"hard","score":4.01,"searchText":"(Всеросс., 2023, МЭ, 9 ) В калориметр со ртутью при температуре t1 = −39 ◦ C положили лёд, температура которого равна t2 = −10 ◦ C. Графики зависимостей температур этих веществ от времени τ изображены на рисунке. Потерями теплоты можно пренебречь. Выберите все правильные утверждения. 1. t1 = −39 ◦ C — это температура плавления ртути. 2. t1 = −39 ◦ C — это температура кипения ртути. 3. Конечная температура содержимого калориметра равна t1 = −39 ◦ C. 4. В конце теплообмена в калориметре есть ртуть в жидком состоянии. 5. В начальном состоянии вся ртуть была жидкостью.","problemImage":"olympiad-assets/332.jpg"},{"id":"1.9.16","chapter":1,"chapterName":"Механика","topic":"1.9","topicName":"Баллистика. Координаты","difficulty":"hard","score":4.02,"searchText":"(«Росатом», 2022, 9 ) Скорость тела, брошенного с земли под некоторым углом к горизонту, оказалась направленной под углом α = 30◦ к горизонту в моменты времени t1 и t2, отсчитанные от момента броска. Найти дальность полета тела и максимальную высоту подъема. Ускорение свободного падения равно g. Сопротивлением воздуха пренебречь.","problemImage":"olympiad-assets/333.jpg"},{"id":"1.9.10","chapter":1,"chapterName":"Механика","topic":"1.9","topicName":"Баллистика. Координаты","difficulty":"hard","score":4.03,"searchText":"(«Будущие исследователи — будущее науки», 2023, 9 ) Тело бросили с начальной скоростью V0 под углом α к горизонту. Через время τ бросили второе тело так, что оно полетело по той же траектории. Каким будет минимальное расстояние между телами во время их полета? Через какое время расстояние станет минимальным? Ускорение свободного падения равно g.","problemImage":"olympiad-assets/334.jpg"},{"id":"1.29.26","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"hard","score":4.04,"searchText":"(«Будущие исследователи — будущее науки», 2020, 9 ) Тонкостенный шар плавает в воде, погрузившись на треть своего объема. Через образовавшуюся течь в шар начинает поступать вода. Разница уровней воды снаружи и внутри шара сначала уменьшается, а затем растет. Считая объем шара равным V, найти объем воды, поступившей в шар к моменту, когда разница уровней воды снаружи и внутри шара становится минимальной. Найти объем поступившей воды, при котором шар утонет. объем поступившей в шар воды равен V /3; шар утонет при заполнении водой объема 2V /3","problemImage":"olympiad-assets/335.jpg"},{"id":"1.34.2","chapter":1,"chapterName":"Механика","topic":"1.34","topicName":"Процессы и измерения","difficulty":"hard","score":4.04,"searchText":"(Инженерная олимпиада, 2023, 9 ) Лазеры для научноинженерных исследований, нуждаются в очень точной установке расстояния между зеркалами оптического резонатора, которое не должно меняться при изменении температуры. Предлагается следующая конструкция температурного компенсатора расстояния между зеркалами. Зеркала (З1 и З2 на рисунке) крепятся к концам пластин из иридия длиной l = 10 см. Между этими пластинами вставляется пластина из никеля AB (см. рис.), концы которой соединены с правым концом нижней пластины, и с левым концом верхней. По чертежу объясните, как работает компенсатор расстояний. При какой длине пластины из никеля расстояние между зеркалами не будет меняться при тепловом расширении? Коэффициенты линейного теплового расширения иридия — α1 = 6,5 · 10−6 1/град, никеля — α2 = 13,4 · 10−6 1/град. Указание. При изменении температуры размеры твёрдых тел изменяются по закону: ∆L = αL∆t, где ∆L — изменение длины тела, α — коэффициент линейного теплового расширения, L — первоначальная длина, ∆t — изменение температуры.","problemImage":"olympiad-assets/336.jpg"},{"id":"2.3.4","chapter":2,"chapterName":"Тепловые явления","topic":"2.3","topicName":"Фазовые переходы","difficulty":"hard","score":4.04,"searchText":"(Всеросс., 2022, ШЭ, 9 ) Вода при температуре 7 ◦ C находится в измерительном цилиндре, как показано на рисунке. 1. Пользуясь рисунком, определите цену деления измерительного цилиндра. Ответ приведите в кубических сантиметрах, округлив до целого числа. 2. Определите массу воды, находящейся в измерительном цилиндре. Ответ приведите в граммах, округлив до целого числа. Плотность воды 1000 кг/м3. 3. В цилиндр поместили льдинку массой 10 г, взятую при температуре её плавления. Какая температура установится в цилиндре через продолжительное время? Ответ дайте в градусах Цельсия, округлив до целого числа. Удельная теплоёмкость воды равна 4200 Дж/(кг · ◦ C), удельная теплоёмкость льда 2100 Дж/(кг · ◦ C), удельная теплота плавления льда 340 кДж/кг. Теплообменом с окружающей средой можно пренебречь. 4. Затем в цилиндр поместили вторую льдинку, также имеющую массу 10 г и взятую при температуре её плавления. Какая температура установится в цилиндре через продолжительное время? Ответ дайте в градусах Цельсия, округлив до целого числа. Теплообменом с окружающей средой можно пренебречь. 5. Каким будет уровень воды в измерительном цилиндре через продолжительное время после помещения туда второй льдинки? Ответ дайте в миллилитрах, округлив до целого числа. Плотность льда 900 кг/м3. Пока льдинки плавали, они не касались дна или стенок сосуда.","problemImage":"olympiad-assets/337.jpg"},{"id":"3.1.26","chapter":3,"chapterName":"Электричество","topic":"3.1","topicName":"Электрические цепи","difficulty":"hard","score":4.04,"searchText":"(«Физтех», 2023, 9 ) На рисунках к задаче приведены два варианта подключения амперметра и вольтметра для измерения силы тока через резистор сопротивлением R и напряжения на этом резисторе. При неизменном напряжении U источника показания вольтметра отличаются вдвое, а амперметра — в 1,5 раза. 1. Найдите сопротивление RV вольтметра. 2. На каком из приборов: вольтметре или амперметре и в какой именно цепи рассеивается наименьшая мощность? Ответ подкрепите соответствующими вычислениями. 3. Найдите эту наименьшую мощность Pmin.","problemImage":"olympiad-assets/338.jpg"},{"id":"1.18.2","chapter":1,"chapterName":"Механика","topic":"1.18","topicName":"Связанные тела","difficulty":"hard","score":4.05,"searchText":"(«Физтех», 2022, 9 ) На горизонтальном столе находятся бруски, соединённые нитью с системой блоков (см. рис.). Массы брусков m1 = 2m, m2 = 3m. Коэффициент трения скольжения нижнего бруска по столу и верхнего бруска по нижнему равен µ. Массы нити и блоков, а также трение в осях блоков пренебрежимо малы. 1. Найдите величину F0 горизонтальной силы, которую следует приложить к свободному концу нити, чтобы нижний брусок скользил по столу, а сила трения, действующая на верхний брусок, была равна нулю. 2. Найдите величину F минимальной силы, при которой нижний брусок скользит по столу, а верхний брусок движется влево относительно нижнего бруска.","problemImage":"olympiad-assets/339.jpg"},{"id":"1.16.7","chapter":1,"chapterName":"Механика","topic":"1.16","topicName":"Сила упругости","difficulty":"hard","score":4.07,"searchText":"(Всеросс., 2023, МЭ, 9 ) На горизонтальном столе лежат два груза массами m1 = 600 г и m2 = 800 г. К этим грузам сверху прикреплены лёгкие вертикальные недеформированные пружины с коэффициентами жёсткости k1 = 60 Н/м и k2 = 120 Н/м соответственно. Верхние концы пружин связаны невесомой нерастяжимой нитью, перекинутой через невесомый блок (см. рисунок). В исходном положении участки нити, не лежащие на блоке, вертикальны и не провисают. В некоторый момент блок начинают двигать вертикально вверх со скоростью v = 20 мм/с. Ускорение свободного падения g = 10 м/с2. Считайте, что за всё время эксперимента ни одна из пружин не успела коснуться блока. 1. Какой груз раньше оторвётся от стола? А) m1; Б) m2; В) одновременно. 2. Через какое время после начала движения блока произойдёт отрыв от стола одного из грузов? Ответ дайте в секундах и округлите до сотых долей. 3. На какую высоту над столом поднимется оторвавшийся груз спустя 3 с после момента отрыва? Ответ дайте в миллиметрах и округлите до целого числа.","problemImage":"olympiad-assets/340.jpg"},{"id":"3.6.1","chapter":3,"chapterName":"Электричество","topic":"3.6","topicName":"Диоды и резисторы","difficulty":"hard","score":4.09,"searchText":"(«Формула Единства» / «Третье тысячелетие», 2021, 9 ) Имеется схема, состоящая из четырёх резисторов R1 = R2 = 2 Ом, R3 = 1 Ом, R4 = 3 Ом, двух идеальных батареек (то есть их сопротивление равно нулю) c напряжениями U1 = 1 В и U2 = 2 В и двух идеальных диодов. Постройте график зависимости общей силы тока I в зависимости от подаваемого на схему напряжения U. Примечание. Идеальным диодом называют устройство, которое пропускает ток только в одном направлении (и это направление указано «стрелкой» диода). Оптика","problemImage":"olympiad-assets/341.jpg"},{"id":"3.5.1","chapter":3,"chapterName":"Электричество","topic":"3.5","topicName":"Электронагреватель","difficulty":"hard","score":4.1,"searchText":"(Олимпиада КФУ, 2021, 9 ) По длинной медной жиле (проводу) сечением s = 1,5 мм2 течет ток I = 16 А. Провод (жила) покрыт ПВХ изоляцией толщиной b = 2 мм с коэффициентом теплопроводности κ = 0,12 Вт/(м · К). Теплопроводность меди много больше теплопроводности изоляции. Найти температуру провода (жилы) T как функцию температуры окружающей среды T0. Построить график зависимости температуры провода (жилы) T от температуры окружающей среды в диапазоне T0 от −40 ◦ C до +40 ◦ C. Найти температуру провода (жилы) T как функцию величины тока I. Построить при температуре окружающей среды T0 = 20 ◦ C график зависимости температуры жилы при величинах токов от 16 А до 25 А. Удельное сопротивление меди при T20 = 20 ◦ C составляет ρ20 = 0,0175 Ом · мм2 /м. Тепловой коэффициент сопротивления меди α = 0,004 ◦ C−1, т. е. удельное сопротивление меди меняется с температурой по закону ρ = ρ20 (1 + α(T − T20 )). Указание. Принять во внимание, что полная мощность теплопередачи может быть вычислена по формуле P = κS∆T d, где κ — коэффициент теплопроводности материала. В данном случае речь идёт о стационарном потоке тепла от одной грани параллелепипеда площадью S к другой, расстояние между гранями равно d, разность температур ∆T. Поток тепла для простоты можно считать по сечению в середине слоя изоляции. Теплообменом через торцы провода пренебречь.","problemImage":"olympiad-assets/342.jpg"},{"id":"1.16.6","chapter":1,"chapterName":"Механика","topic":"1.16","topicName":"Сила упругости","difficulty":"hard","score":4.13,"searchText":"(Всеросс., 2021, МЭ, 9 ) У экспериментатора были два однородных лёгких упругих шнура — короткий и длинный. Длина меньшего шнура l0 = 20 см. Он соединил шнуры параллельно, попарно скрепив их концы друг с другом (начало короткого шнура с началом длинного, а конец короткого шнура — с концом длинного). После этого один из концов полученной связки он закрепил, а к другому стал подвешивать грузики различной массы. После обработки полученных экспериментальных данных была построена зависимость абсолютного удлинения ∆l связки шнуров от модуля силы F, приложенной к её свободному концу (см. рис.). Для сил растяжения каждого из шнуров справедлив закон Гука. 1. Найдите коэффициент жёсткости короткого шнура. Ответ приведите в Н/м, округлив до целого числа. 2. Найдите коэффициент жёсткости длинного шнура. Ответ приведите в Н/м, округлив до целого числа. Экспериментатор соединил эти же шнуры последовательно, верхний конец связки закрепил, а к нижнему концу приложил силу F = 4 Н. 3. Определите суммарную величину абсолютного удлинения этой связки шнуров. Ответ приведите в см, округлите до целого числа. Экспериментатор укоротил длинный шнур до размера короткого шнура и вновь соединил их параллельно. Верхний конец связки он снова закрепил, а к нижнему приложил силу F = 4 Н. 4. Определите суммарную величину абсолютного удлинения такой связки шнуров. Ответ приведите в см, округлив до целого числа.","problemImage":"olympiad-assets/343.jpg"},{"id":"1.28.4","chapter":1,"chapterName":"Механика","topic":"1.28","topicName":"Статика","difficulty":"hard","score":4.13,"searchText":"(Всеросс., 2021, МЭ, 9 ) Однородную доску длиной 4 м положили на небольшую опору. Поддерживать доску в горизонтальном положении (не смещая опору относительно доски) можно двумя способами: а) прикладывать минимальную силу 50 Н к одному концу доски; б) прикладывать минимальную силу 30 Н к другому концу доски. Ускорение свободного падения равно 10 м/с2. 1. Определите расстояние от центра тяжести доски до опоры. Ответ запишите в см, округлив до целого числа. 2. Определите расстояние от опоры до дальнего (от неё) конца доски. Ответ запишите в см, округлив до целого числа. 3. Определите массу доски. Ответ запишите в кг, округлив до целого числа. 4. Определите модуль силы реакции опоры при первом способе удержания доски в равновесии. Ответ запишите в Н, округлив до целого числа. 5. Определите модуль силы реакции опоры при втором способе удержания доски в равновесии. Ответ запишите в Н, округлив до целого числа.","problemImage":"olympiad-assets/344.jpg"},{"id":"1.28.3","chapter":1,"chapterName":"Механика","topic":"1.28","topicName":"Статика","difficulty":"hard","score":4.14,"searchText":"(Всеросс., 2020, МЭ, 9 ) Прямая однородная доска длиной 40 см лежит на двух неподвижных опорах в горизонтальном положении. Доску начинают двигать вправо в горизонтальном направлении с постоянной скоростью. На рисунке приведены графики зависимостей величин сил давления доски на опоры от времени t вплоть до момента опрокидывания доски. В момент начала движения a = 15 см. Ускорение свободного падения g = 10 м/с2. Трение отсутствует. 1. N1 — это сила давления доски: а) на левую опору; б) на правую опору. 2. Чему равна масса доски? Ответ выразите в граммах и округлите до целого числа. 3. Найдите расстояние b в момент начала движения доски. Ответ выразите в сантиметрах и округлите до целого числа. 4. Найдите модуль скорости, с которой двигают доску. Ответ выразите в см/с и округлите до целого числа.","problemImage":"olympiad-assets/345.jpg"},{"id":"2.3.17","chapter":2,"chapterName":"Тепловые явления","topic":"2.3","topicName":"Фазовые переходы","difficulty":"hard","score":4.15,"searchText":"(«Формула Единства» / «Третье тысячелетие», 2019, 9 ) Экспериментатор Глюк решил заварить чаю. Налил в кастрюлю воды, положил кипятильник и плотно закрыл крышкой. Чтобы не скучать, он построил график зависимости температуры воды от времени (см. рис.). Когда вода закипела, он передумал пить чай, убрал крышку, положил в кастрюлю ещё два таких же кипятильника и сел считать, через какое время испарится 5% воды. Сколько времени у него на расчёт (если он всё-таки хочет успеть раньше, чем эти 5% испарятся)? Примечание. Удельная теплоёмкость воды — 4200 Дж/(кг · ◦ C), удельная теплота парообразования воды — 2256 кДж/кг. • Теплопроводность. 8 • Теплопроводность. 9–11","problemImage":"olympiad-assets/346.jpg"},{"id":"1.25.4","chapter":1,"chapterName":"Механика","topic":"1.25","topicName":"Упругие взаимодействия","difficulty":"hard","score":4.18,"searchText":"(«Курчатов», 2022, 9 ) Рассмотрим футбольный мяч, заполненный воздухом. Избыточное давление внутри мяча ∆p = 20 кПа, радиус мяча R = 10 см и его масса m = 400 г. Можно пренебречь зависимостью избыточного давления от деформации шара и массы внутри шара. Материал, из которого сделан мяч, не растягивается. 1. Мяч зажали между двумя параллельными жесткими пластинами, расстояние между которыми равно 2R − 2h (так, что глубина деформации, на которую продавливается мяч, с каждой из двух сторон мяча равна h = 1 см). Найдите силу, с которой мяч давит на пластину. 2. Мяч движется со скоростью v0 = 2 м/с и ударяется о твердую стенку. Найти максимальную глубину деформированного участка h и время столкновения t. Считайте, что искомая величина h значительно меньше радиуса мяча R. m m 2πR∆p","problemImage":"olympiad-assets/347.jpg"},{"id":"1.29.29","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"hard","score":4.18,"searchText":"(«Будущие исследователи — будущее науки», 2023, 9 ) Три одинаковых цилиндрических сосуда стоят рядом на горизонтальном столе и соединены вблизи дна тонкими трубками, которые перекрыты кранами (см. рис.). Сосуды заполнены до уровня h0 жидкостями с плотностями ρ1, ρ2, ρ3, причем ρ1 > ρ2 > ρ3. В какой последовательности нужно открыть краны, чтобы получить максимальную высоту столба жидкости в одном из сосудов? Чему равна эта высота?","problemImage":"olympiad-assets/348.jpg"},{"id":"1.29.42","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"hard","score":4.18,"searchText":"(«Формула Единства» / «Третье тысячелетие», 2020, 9 ) Два лёгких сосуда, соединённые у основания тонким гибким шлангом, стоят на пружинах, прикреплённых к полу (см. рис.). Экспериментатор Глюк проделал с ними следующие операции: 1. Налил 160 мл воды в левый сосуд. В результате правый сосуд опустился на 2 см, а левый остался на месте. 2. Вылил воду, поменял сосуды местами и налил в левый 670 мл воды. Он опустился на 2 см, а правый опустился на 3 см. 3. Вылил воду и вернул сосуды в первоначальное положение. 4. Глюк решил подобрать такую жидкость, чтобы при наливании её в левый сосуд тот опускался. Постепенно варьируя плотность, он такую жидкость получил. 5. Он снова поменял сосуды местами и налил в левый 100 мл этой жидкости. На сколько опустится каждый из сосудов? Примечание. Известно, что площадь дна одного из сосудов в пять раз больше другого.","problemImage":"olympiad-assets/349.jpg"},{"id":"2.2.14","chapter":2,"chapterName":"Тепловые явления","topic":"2.2","topicName":"Теплообмен","difficulty":"hard","score":4.19,"searchText":"(«Курчатов», 2023, 9 ) В калориметре A находится m = 200 г воды при температуре t01 = 20 ◦ C, в калориметре B вдвое больше воды при температуре t02 = 80 ◦ C. Далее происходит следующий процесс: из калориметра B переливают ∆m = 50 г воды в калориметр A, после установления теплового равновесия в калориметре A переливают такое же количество воды обратно в калориметр B и ожидают установления теплового равновесия в калориметре B. Далее этот процесс повторяют несколько раз. Какое минимальное количество раз (учитывая первый процесс) потребуется совершить этот процесс, чтобы разность температур в двух калориметрах оказалась меньше 12 ◦ C? Удельная теплоёмкость воды c = 4200 Дж/(кг · ◦ C). Теплоёмкостью каждого калориметра пренебречь. Систему следует считать теплоизолированной.","problemImage":"olympiad-assets/350.jpg"},{"id":"1.20.7","chapter":1,"chapterName":"Механика","topic":"1.20","topicName":"Движение со связями","difficulty":"hard","score":4.28,"searchText":"(«Формула Единства» / «Третье тысячелетие», 2019, 9 ) Грузы массами m1 = 2 кг и m2 = 1 кг соединены невесомой нерастяжимой нитью через систему из двух неподвижных блоков. К правому блоку прикреплён жёстким невесомым стержнем длиной 40 см груз массой m3 = 0,5 кг. Радиусы обоих блоков равны 10 см. В начальный момент система неподвижна; стержень, соединяющий правый блок и груз m3, горизонтален. 1. Каково ускорение m3 в начальный момент? 2. Какими будут его скорость и ускорение при прохождении нижней точки траектории? 3. С какой начальной скоростью нужно было бы толкнуть вниз груз m3, чтобы он достиг верхней точки (ровно над блоком)? Примечание. Блоки невесомые, трения в осях нет, нить не проскальзывает по блоку. • Импульс • Системы материальных точек","problemImage":"olympiad-assets/351.jpg"},{"id":"1.28.18","chapter":1,"chapterName":"Механика","topic":"1.28","topicName":"Статика","difficulty":"hard","score":4.3,"searchText":"(«Шаг в будущее», 2022, 9 ) Брусок в форме прямоугольного параллелепипеда, сторонами a = 10 см, b = 20 см и c = 10 см расположен на тонкой доске вблизи края горизонтальной поверхности стола (см. рис., сторона c не видна). Правый конец доски закреплен в шарнире D и может свободно вращаться вокруг его оси. Доску медленно приподнимают за левый конец, прилагая минимальное усилие. Каким будет это усилие в момент начала движения бруска относительно доски? Масса доски m = 1 кг. Коэффициент трения бруска о доску µ = 0,6.","problemImage":"olympiad-assets/352.jpg"},{"id":"1.29.11","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"hard","score":4.31,"searchText":"(Всеросс., 2020, МЭ, 9 ) К цилиндрическому поплавку с площадью сечения S = 2 см2 привязана лёгкая тонкая леска длиной 4L (L = 30 см). К середине и к свободному концу лески прикреплены два одинаковых свинцовых грузила массой m = 10 г каждое. Изначально нижнее грузило лежит на дне, как показано на рисунке, а поплавок плавает вертикально. Плотность воды r0 = 1000 кг/м3, плотность свинца r = 11300 кг/м3. Ускорение свободного падения g = 10 м/с2. 1. Считая, что поплавок может удержать на плаву два грузила, найдите, при каком минимальном изменении уровня воды в водоёме нижнее грузило оторвётся от дна. Ответ выразите в сантиметрах и округлите до десятых долей. 2. Найдите силу натяжения верхней части лески (между поплавком и верхним грузилом) после отрыва нижнего грузила от дна. Ответ выразите в ньютонах и округлите до десятых долей.","problemImage":"olympiad-assets/353.jpg"},{"id":"3.4.15","chapter":3,"chapterName":"Электричество","topic":"3.4","topicName":"Мощность тока","difficulty":"hard","score":4.31,"searchText":"(«Курчатов», 2021, 9 ) У экспериментатора Глюка в наборе имеется батарейка с внутренним сопротивлением 1 Ом, при коротком замыкании через нее проходит ток 1 А. Также имеется четыре внешних разных резистора с сопротивлениями: 1,5 Ом, 2 Ом, 3 Ом, 6 Ом. Какой набор резисторов нужно составить и как нужно собрать электрическую схему из имеющихся элементов для выделения максимальной тепловой мощности на внешних резисторах? Чему равна эта мощность?","problemImage":"olympiad-assets/354.jpg"},{"id":"1.21.6","chapter":1,"chapterName":"Механика","topic":"1.21","topicName":"Импульс","difficulty":"hard","score":4.35,"searchText":"(«Курчатов», 2023, 9 ) Снаряд выпустили вертикально вверх. Он достиг высшей точки траектории на высоте H над землёй и в этот момент разорвался на три осколка равной массы. Все осколки после взрыва начали двигаться с одинаковыми по модулю начальными скоростями. Один осколок, двигаясь строго вертикально вниз, ударился о землю за время T1 = 5 секунд с момента взрыва. Два других осколка упали на землю одновременно за время T2 = 10 секунд с момента взрыва. Сопротивлением воздуха пренебречь. Ускорение свободного падения g = 10 м/с2. 1. Определите высоту H, на которой произошел разрыв снаряда. 2. Определите величины скоростей осколков сразу после разрыва снаряда и в момент падения на землю. 3. Докажите, что все три осколка в интервале времени от момента разрыва снаряда до T1 расположены на окружности c переменным радиусом, и опишите движение центра этой окружности c переменным радиусом. 1) H = 312,5 м; 2) v0 = 37,5 м/с, vк = 87,5 м/с; 3) окружность с центром в точке 0, H − gt2 и радиусом r = v0 t","problemImage":"olympiad-assets/355.jpg"},{"id":"2.2.15","chapter":2,"chapterName":"Тепловые явления","topic":"2.2","topicName":"Теплообмен","difficulty":"hard","score":4.4,"searchText":"(«Курчатов», 2022, 9 ) В водонагревателе мощностью P = 2,0 кВт изначально находится вода массы m0 и температуры T0 = 20 ◦ C. Водонагреватель включают, и в этот же момент вода с той же температурой T1 = 20 ◦ C начинает поступать извне в нагреватель с постоянной скоростью, то есть масса поступающей извне воды в единицу времени постоянна и равна µ = const (г/c). Когда нагреватель полностью наполняется водой, вода начинает вытекать из отверстия сверху. Температура вытекающей воды продолжает расти до установления на уровне 36 ◦ C. График изменения температуры воды, вытекающей из нагревателя, показан на рисунке. Найдите начальную массу воды m0 и массу поступающей извне воды в единицу времени µ. Предположим, что, кроме вытекающей из нагревателя воды, потерь тепла нет, а вода в нагревателе всегда имеет одинаковую температуру. Удельная теплоемкость воды c = 4,2 кДж/(кг · ◦ C). • Фазовые переходы. 8 • Теплообмен. 9–11","problemImage":"olympiad-assets/356.jpg"},{"id":"1.5.7","chapter":1,"chapterName":"Механика","topic":"1.5","topicName":"Относительность движения","difficulty":"hard","score":4.47,"searchText":"(«Физтех», 2023, 9 ) Пловец трижды переплывает реку. Движение пловца прямолинейное. Скорость пловца в подвижной системе отсчета, связанной с водой, во всех заплывах одинакова по модулю. В двух первых заплывах A — точка старта, B — точка финиша (см. рис., V — неизвестная скорость течения реки). Ширина реки AC = d = 70 м, снос, т. е. расстояние, на которое пловец смещается вдоль реки к моменту достижения противоположного берега, CB = L = 240 м. Продолжительность первого заплыва T1 = 192 с, продолжительность второго заплыва T2 = = 417 c. 1. Найдите скорости V1 и V2 пловца в лабораторной системе отсчета в первом и втором заплывах. 2. Найдите скорость U пловца в подвижной системе отсчета, связанной с водой. В третьем заплыве пловец стартует из точки A и движется так, что снос минимальный. 3. Найдите продолжительность T третьего заплыва. d ≈ 175 с ≈ 0,45 м/с; 3) T = V ·√ V1 +V2 d V 2 −U 2 U \u00112 2 \u0010 \u00112 2 r\u0010","problemImage":"olympiad-assets/357.jpg"},{"id":"1.5.8","chapter":1,"chapterName":"Механика","topic":"1.5","topicName":"Относительность движения","difficulty":"hard","score":4.5,"searchText":"(«Физтех», 2023, 9 ) На реке отведена зона для безопасного плавания. Граница зоны — половина окружности радиуса R = 100 м, центр в точке O (см. рис.). В ходе заплывов по реке пловец каждый раз стартует в точке O, плывет по прямой до границы зоны, а затем по той же прямой возвращается в точку старта. В системе отсчета, связанной с водой, скорость U ~ пловца одинакова по модулю U = 1,5 м/с при движении в любом направлении. В первом заплыве пловец проплывает 100 м вниз по течению (U ~ ↑↑ V~ ) и возвращается (−U~ ↑↓ V~ ) в точку старта. Время движения на второй половине дистанции в 5 раз больше, чем на первой. 1. Найдите скорость V течения реки. 2. Найдите продолжительность T заплыва, в котором вектор V~ cкорости реки образует угол α = 45◦ с прямой, по которой движется пловец (см. рис.). 3. За какое наименьшее время Tmin пловец после старта в точке O может доплыть до границы зоны и вернуться в точку старта? U 2 −V 2 ·sin2 α √ 1) V = 32 U = 1 м/с; 2) T = 2R U 2 −V 2","problemImage":"olympiad-assets/358.jpg"},{"id":"1.9.17","chapter":1,"chapterName":"Механика","topic":"1.9","topicName":"Баллистика. Координаты","difficulty":"hard","score":4.54,"searchText":"(«Физтех», 2023, 9 ) Камень брошен с башни высотой H = = 25,6 м под углом α к горизонту, tg α = 1,6 (см. рис.). Последние по вертикали h = 16 м камень пролетел за время τ = 0,8 с. 1. Через какое время t1 после старта камень находился на максимальной высоте? 2. Найдите горизонтальное перемещение S камня за время полета. Ускорение свободного падения g = 10 м/с2. Сопротивление воздуха пренебрежимо мало. Все высоты отсчитываются от горизонтальной поверхности.","problemImage":"olympiad-assets/359.jpg"},{"id":"1.29.13","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"hard","score":4.6,"searchText":"(Всеросс., 2022, МЭ, 9 ) К одному концу невесомой нити прикреплён железный куб объёмом 1 дм3, а к другому концу прикреплено очень лёгкое пластиковое ведро, в которое налита вода. Нить перекинута через блок, и система подвешена так, как показано на рисунке. При этом железный куб полностью погружён в воду и не касается стенок и дна ведра, а система находится в равновесии. Трение отсутствует. Плотность воды 1 г/см3, плотность железа 7,8 г/см3. 1. Сколько литров воды находится в ведре? Ответ округлите до десятых долей. 2. Что произойдёт, если налить в ведро ещё немного воды? А) Ведро и куб останутся на своих местах. Б) Ведро будет двигаться вверх, куб вниз, пока система не придёт в равновесие. В) Ведро будет двигаться вниз, куб вверх, пока система не придёт в равновесие. 3. Что произойдёт, если из ведра испарится немного воды? А) Ведро и куб останутся на своих местах. Б) Ведро будет двигаться вверх, куб вниз, пока система не придёт в равновесие. В) Ведро будет двигаться вниз, куб вверх, пока система не придёт в равновесие.","problemImage":"olympiad-assets/360.jpg"},{"id":"2.3.13","chapter":2,"chapterName":"Тепловые явления","topic":"2.3","topicName":"Фазовые переходы","difficulty":"hard","score":4.62,"searchText":"(Олимпиада КФУ, 2022, 9 ) Некоторое количество олова залито в тонкостенную стальную форму, подвешенную за тонкую ручку. В олово вплавлен термостойкий электрический нагревательный элемент постоянной мощности. Было замечено, что c момента достижения температуры плавления олова (T0 = 232 ◦ C) до полного перехода олова в жидкую фазу прошло t1 = 20 минут. После этого температура олова повысилась до T1 = 640 ◦ C, причем последние 10 ◦ C были достигнуты за t2 = 3 минуты. После отключения нагревательного элемента олово остыло до температуры плавления. Остывание с 243 ◦ C до 233 ◦ C при этом заняло t3 = 6 минут. Сколько приблизительно времени потребуется для кристаллизации всей массы олова, охлажденного до температуры плавления, в данных условиях? Примерно до какой температуры можно нагреть данный сосуд с оловом этим нагревателем в таких условиях? Теплоемкостью формы и нагревательного элемента можно пренебречь. Зависимостью теплоемкости олова от температуры пренебречь. Окружающая температура 32 ◦ C. Температура плавления стали 1400 ◦ C, температура кипения олова 2620 ◦ C.","problemImage":"olympiad-assets/361.jpg"},{"id":"1.29.14","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"hard","score":4.63,"searchText":"(Всеросс., 2023, МЭ, 9 ) Однородная деревянная линейка длиной l = 100 см имеет массу m = 210 г. К концу линейки прикрепили металлическую цепочку и опустили эту систему в сосуд с жидкостью. Линейка плавает, частично погрузившись в жидкость (см. рисунок). Часть цепочки лежит на дне сосуда. Плотность цепочки в k = 2,7 раза больше плотности жидкости, а масса вертикального участка цепочки равна M = 81 г. Ускорение свободного падения считать равным g = 10 м/с2. Толщина линейки очень маленькая. 1. Чему равен модуль силы, с которой цепочка действует на линейку? Ответ выразите в ньютонах и округлите до сотых долей. 2. Чему равен модуль силы Архимеда, действующей на линейку? Ответ выразите в ньютонах и округлите до сотых долей. 3. Чему равна длина погруженной в жидкость части линейки? Ответ выразите в сантиметрах и округлите до десятых долей. 4. Чему равно отношение плотности линейки к плотности жидкости? Ответ округлите до сотых долей.","problemImage":"olympiad-assets/362.jpg"},{"id":"1.29.22","chapter":1,"chapterName":"Механика","topic":"1.29","topicName":"Гидростатика","difficulty":"hard","score":4.65,"searchText":"(«Будущие исследователи — будущее науки», 2018, 9 ) Плот является жесткой конструкцией из шести бревен одинаковой длины и диаметра: трех — из дерева одной плотности (заштрихованы на рисунке) и трех — из дерева другой плотности (не заштрихованы). Когда человек стоит на втором бревне с краю, плот занимает горизонтальное положение, и каждое бревно погружено в воду до половины (см. рис.). То же бревно, взятое отдельно от плота, удерживает стоящего на нем человека, полностью погрузившись в воду. Во сколько раз масса плота больше массы человека? Чему равно отношение плотностей дерева, из которого сделан плот?","problemImage":"olympiad-assets/363.jpg"},{"id":"3.2.13","chapter":3,"chapterName":"Электричество","topic":"3.2","topicName":"Вычисление сопротивлений","difficulty":"hard","score":4.7,"searchText":"(«Формула Единства» / «Третье тысячелетие», 2020, 9 ) На испытаниях моделей электрического транспорта сделан круговой трек длиной 16 м из двух токопроводящих рельс. Около точки старта каждая из рельс подключена к клемме источника тока (см. рис.). Машинка едет по рельсам, замыкая электрическую цепь. Хулиган Даниэль поцарапал рельсы булавкой в некоторой точке L от старта, из-за чего их сопротивление в этом месте существенно возросло. Скорость машинки стала минимальной в точке 6 м. Даниэль на этом не остановился и так же повредил рельсы на расстоянии 2L, в результате чего точка минимальной скорости оказалась на отметке 5,2 м. Наконец, он отошёл на 4L и повторил акт вандализма три раза почти в одном месте. Определите расположение новой точки минимальной скорости. Примечание. Считайте, что Даниэль царапает рельсы всегда одним и тем же образом, все расстояния отложены по часовой стрелке от точки старта, а скорость машины пропорциональна мощности двигателя.","problemImage":"olympiad-assets/364.jpg"},{"id":"1.10.2","chapter":1,"chapterName":"Механика","topic":"1.10","topicName":"Баллистика. Отражения","difficulty":"hard","score":4.81,"searchText":"(«Физтех», 2023, 9 ) Футболист на тренировке наносит удары по мячу, лежащему на горизонтальной площадке, и направляет мяч к вертикальной стенке. После абсолютно упругого соударения со стенкой мяч падает на площадку. Наибольшая высота, на которой мяч находится в полете, H = 16,2 м. Расстояние от точки старта до стенки в 5 раз больше расстояния от стенки до точки падения мяча на площадку. 1. На какой высоте h происходит соударение мяча со стенкой? 2. Найдите продолжительность t1 полета мяча от старта до соударения со стенкой. Допустим, что в момент соударения мяча со стенкой на той же высоте h, стенка движется навстречу мячу со скоростью U = 2 м/с. 3. Найдите расстояние d между точками падения мяча на площадку в случаях: стенка покоится, стенка движется. Ускорение свободного падения g = 10 м/с2. Сопротивление воздуха пренебрежимо мало. Соударения мяча со стенкой абсолютно упругие. Траектории мяча лежат в вертикальной плоскости перпендикулярной стенке.","problemImage":"olympiad-assets/365.jpg"}];
